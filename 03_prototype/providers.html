<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渠道库 - API Radar</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.main h1 { font-size: 28px; margin-bottom: 8px; }
.page-desc { color: var(--muted); margin-bottom: 24px; }
</style>
</head>
<body>
<div id="topbar"></div>
<main class="main">
  <div class="page-hero fade-in">
    <div class="page-hero-tagline"><span class="page-hero-tagline-dot"></span><span>40 个渠道 · 实时</span></div>
    <h1><span class="gradient-text">📡 渠道库</span></h1>
    <p class="subtitle">{{total}} 个渠道 · 官方 / 中转 / 网关 / 自托管</p>
  </div>
  <div class="filter-bar" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;">
    <select id="type-filter" style="padding:8px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--fg);">
      <option value="">所有类型</option>
      <option value="official">官方</option>
      <option value="aggregator">中转</option>
      <option value="gateway">网关</option>
      <option value="self_host">自托管</option>
      <option value="cloud">云厂商</option>
    </select>
    <select id="region-filter" style="padding:8px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--fg);">
      <option value="">所有地区</option>
      <option value="cn">国内</option>
      <option value="global">海外</option>
      <option value="self">自托管</option>
    </select>
    <input type="text" id="provider-search" placeholder="🔍 搜索渠道名" style="padding:8px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--fg);min-width:240px;">
  </div>
  <div id="provider-grid" class="model-grid"></div>

</main>
<script src="data.js"></script>
<script src="app.js"></script>

<script>
(function() {
  if (typeof renderTopbar === 'function') renderTopbar('providers');
  const D = API_RADAR_DATA;
  const grid = document.getElementById('provider-grid');
  const typeFilter = document.getElementById('type-filter');
  const regionFilter = document.getElementById('region-filter');
  const search = document.getElementById('provider-search');

  const typeMap = { official: '官方', aggregator: '中转', gateway: '网关', self_host: '自托管', cloud: '云厂商' };
  const typeColor = { official: 'tag-accent', aggregator: 'tag-purple', gateway: 'tag-success', self_host: 'tag-warning', cloud: 'tag' };

  function render() {
    let items = D.providers;
    const t = typeFilter.value;
    const r = regionFilter.value;
    const q = (search.value||'').toLowerCase();
    if (t) items = items.filter(p => p.type === t);
    if (r) items = items.filter(p => (p.region||'').includes(r));
    if (q) items = items.filter(p => p.name.toLowerCase().includes(q));

    grid.innerHTML = items.map(p => {
      const offeringsCount = D.offerings.filter(o => o.provider_id === p.id).length;
      return `<a href="provider.html?id=${p.id}" class="card" style="text-decoration:none;color:inherit;padding:20px;">
        <div class="flex between items-center">
          <div style="font-weight:700;font-size:16px;">${p.name}</div>
          <span class="tag ${typeColor[p.type]||'tag'}">${typeMap[p.type]||p.type}</span>
        </div>
        <div class="muted text-sm" style="margin-top:6px;">${(p.notes||'').slice(0, 60)}</div>
        <div class="flex gap-3" style="margin-top:12px;font-size:11px;color:var(--muted);">
          <span>📦 ${offeringsCount} SKU</span>
          <span>💱 ${(p.payment_currency||[]).join('/')}</span>
          <span>💰 最低 ¥${p.min_charge||0}</span>
        </div>
      </a>`;
    }).join('') || '<div class="empty-state">没有匹配</div>';
  }

  typeFilter.addEventListener('change', render);
  regionFilter.addEventListener('change', render);
  search.addEventListener('input', render);
  render();
})();
</script>

</body>
</html>
