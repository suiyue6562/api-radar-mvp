<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型库 - API优选咨询</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
.main h1 { font-size: 28px; margin-bottom: 8px; }
.page-desc { color: var(--muted); margin-bottom: 24px; }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; padding: 16px; align-items: center; }
.filter-bar select, .filter-bar input { padding: 10px 14px; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 8px; color: var(--fg); }
.filter-bar .filter-label { font-size: 12px; color: var(--muted); margin-right: 4px; }
.cap-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.cap-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 10px; border-radius: 999px; font-size: 12px;
  background: var(--bg-deep); border: 1px solid var(--border); color: var(--muted);
  cursor: pointer; user-select: none; transition: all .15s ease;
}
.cap-chip:hover { border-color: var(--accent); color: var(--fg); }
.cap-chip.active { background: rgba(0,217,255,.12); border-color: var(--accent); color: var(--accent); }
.toggle-switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg); cursor: pointer; }
.toggle-switch input { width: 36px; height: 20px; appearance: none; -webkit-appearance: none; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 999px; position: relative; cursor: pointer; transition: all .15s ease; }
.toggle-switch input:checked { background: rgba(0,217,255,.25); border-color: var(--accent); }
.toggle-switch input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: var(--muted); border-radius: 50%; transition: all .15s ease; }
.toggle-switch input:checked::after { left: 18px; background: var(--accent); }
.model-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.model-card { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px; }
.model-card-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
.model-card-logo { width: 40px; height: 40px; border-radius: 10px; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.model-card-title { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.model-card-vendor { font-size: 12px; color: var(--muted); }
.model-card-capabilities { display: flex; gap: 4px; flex-wrap: wrap; }
.cap-icon { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 6px; background: var(--bg-deep); border: 1px solid var(--border); font-size: 13px; }
.cap-icon[title]:hover { border-color: var(--accent); }
.model-card-prices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 12px; font-size: 12px; }
.price-row { display: flex; justify-content: space-between; gap: 6px; }
.price-row .price-label { color: var(--muted); }
.price-row .price-val { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
.model-card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 8px; }
.model-card-trend { display: flex; align-items: center; gap: 4px; }
.trend-up { color: var(--success); }
.trend-down { color: var(--danger); }
.model-card-bestfor { display: flex; flex-wrap: wrap; gap: 4px; }
.bestfor-tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: rgba(176,107,255,.12); color: var(--accent-2); border: 1px solid rgba(176,107,255,.3); }
.score-badge {
  position: absolute; top: 12px; right: 12px;
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px; color: #0b0f17;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
.score-A { background: linear-gradient(135deg,#00ffa3,#00d9ff); }
.score-B { background: linear-gradient(135deg,#00d9ff,#b06bff); }
.score-C { background: linear-gradient(135deg,#ffb84d,#ff8c42); }
.score-D { background: linear-gradient(135deg,#ff8c42,#ff4757); }
</style>
</head>
<body>
<div id="topbar"></div>
<main class="main">
  <div class="page-hero fade-in">
    <div class="page-hero-tagline"><span class="page-hero-tagline-dot"></span><span id="model-count-tag">60 个模型 · 实时</span></div>
    <h1><span class="gradient-text">🧠 模型库</span></h1>
    <p class="subtitle" id="page-meta">加载中...</p>
  </div>

  <div class="card filter-bar">
    <div>
      <div class="filter-label">厂商</div>
      <select id="vendor-filter" style="min-width:160px;">
        <option value="">所有厂商</option>
      </select>
    </div>
    <div>
      <div class="filter-label">许可</div>
      <select id="license-filter" style="min-width:120px;">
        <option value="">所有许可</option>
        <option value="open">开源</option>
        <option value="proprietary">闭源</option>
      </select>
    </div>
    <div>
      <div class="filter-label">最佳用途</div>
      <select id="bestfor-filter" style="min-width:140px;">
        <option value="">全部</option>
        <option value="Coding">Coding</option>
        <option value="Reasoning">Reasoning</option>
        <option value="Throughput">Throughput</option>
        <option value="Vision">Vision</option>
        <option value="Audio">Audio</option>
        <option value="Agents">Agents</option>
        <option value="Long Context">Long Context</option>
      </select>
    </div>
    <div>
      <div class="filter-label">能力</div>
      <div class="cap-chips" id="cap-chips">
        <span class="cap-chip" data-cap="reasoning" title="Reasoning">🧠</span>
        <span class="cap-chip" data-cap="tool_use" title="Tool Call">🔧</span>
        <span class="cap-chip" data-cap="structured" title="Structured">📋</span>
        <span class="cap-chip" data-cap="vision" title="Vision">🖼️</span>
        <span class="cap-chip" data-cap="audio" title="Audio">🎤</span>
      </div>
    </div>
    <label class="toggle-switch">
      <input type="checkbox" id="open-weights-toggle">
      <span>Open Weights Only</span>
    </label>
    <input type="text" id="model-search" placeholder="🔍 搜索模型名 / 能力" style="flex:1;min-width:200px;">
  </div>

  <div id="model-grid" class="model-grid"></div>
</main>
<script src="data.js?v=20260921c"></script>
<script src="app.js?v=20260921c"></script>
<script>
function escapeHtml(s) { return String(s || "").replace(/[&<>"']/g, c => ({"&": "&", "<": "<", ">": ">", "\"": """, "'": "&#39;"})[c]); }

// ============ 能力图标映射 (学 models.dev) ============
const CAP_ICON_MAP = {
  reasoning:     { icon: '🧠', label: 'Reasoning' },
  tool_use:      { icon: '🔧', label: 'Tool Call' },
  structured:    { icon: '📋', label: 'Structured' },
  vision:        { icon: '🖼️', label: 'Vision' },
  audio:         { icon: '🎤', label: 'Audio' },
};
// modality 字段里含 image => vision，含 audio => audio
function modelHasCapability(m, cap) {
  const caps = m.capabilities || [];
  const mod = m.modality || [];
  if (cap === 'reasoning')  return caps.includes('reasoning');
  if (cap === 'tool_use')   return caps.includes('tool_use') || caps.includes('agentic_coding') || caps.includes('function_call');
  if (cap === 'structured') return caps.includes('structured') || caps.includes('json_mode');
  if (cap === 'vision')     return mod.includes('image') || caps.includes('vision');
  if (cap === 'audio')      return mod.includes('audio') || caps.includes('audio');
  return false;
}

function renderCapabilityIcons(m) {
  return Object.keys(CAP_ICON_MAP)
    .filter(c => modelHasCapability(m, c))
    .map(c => '<span class="cap-icon" title="' + CAP_ICON_MAP[c].label + '">' + CAP_ICON_MAP[c].icon + '</span>')
    .join('');
}

function renderPrice5D(m) {
  const inp = m.official_input_usd_m ?? m.price_input_per_m ?? 0;
  const out = m.official_output_usd_m ?? m.price_output_per_m ?? 0;
  const cr  = m.official_cache_read_usd_m ?? m.price_cache_read_per_m ?? null;
  // 没有 cache_write / reasoning 价的，置 null 显示 —
  const cw  = m.official_cache_write_usd_m ?? null;
  const rsn = m.official_reasoning_usd_m ?? null;
  const cell = (label, val) =>
    '<div class="price-row"><span class="price-label">' + label + '</span>' +
    '<span class="price-val">' + (val === null ? '—' : fmtUSD(val)) + '</span></div>';
  return cell('In', inp) + cell('Out', out) +
    cell('Cache read', cr) + cell('Cache write', cw) + cell('Reasoning', rsn);
}

(function() {
  if (typeof renderTopbar === 'function') renderTopbar('models');
  const D = API_RADAR_DATA;

  document.getElementById('page-meta').textContent =
    D.models.length + ' 个模型 · 按厂商 / 能力 / 最佳用途筛选';

  const grid = document.getElementById('model-grid');
  const vendorFilter = document.getElementById('vendor-filter');
  const licenseFilter = document.getElementById('license-filter');
  const bestforFilter = document.getElementById('bestfor-filter');
  const openWeightsToggle = document.getElementById('open-weights-toggle');
  const search = document.getElementById('model-search');
  const capChips = document.querySelectorAll('#cap-chips .cap-chip');
  const activeCaps = new Set();

  // 填厂商筛选
  D.vendors.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.id;
    opt.textContent = v.name_zh || v.name || v.id;
    vendorFilter.appendChild(opt);
  });

  // 能力 chip 多选
  capChips.forEach(chip => {
    chip.addEventListener('click', () => {
      const c = chip.dataset.cap;
      if (activeCaps.has(c)) { activeCaps.delete(c); chip.classList.remove('active'); }
      else { activeCaps.add(c); chip.classList.add('active'); }
      render();
    });
  });

  function filterByCapability(models, caps) {
    if (!caps.size) return models;
    return models.filter(m => Array.from(caps).every(c => modelHasCapability(m, c)));
  }
  function filterByOpenWeights(models) {
    if (!openWeightsToggle.checked) return models;
    return models.filter(m => m.is_open_weight);
  }
  function filterByBestFor(models, tag) {
    if (!tag) return models;
    return models.filter(m => (m.scenes || []).map(s => s.replace(/_/g, ' ')).some(s => s.toLowerCase() === tag.toLowerCase()));
  }

  function render() {
    let models = D.models.slice();
    const v = vendorFilter.value;
    const l = licenseFilter.value;
    const q = (search.value || '').trim().toLowerCase();
    if (v) models = models.filter(m => m.vendor_id === v);
    if (l === 'open') models = models.filter(m => m.is_open_weight);
    if (l === 'proprietary') models = models.filter(m => !m.is_open_weight);
    models = filterByCapability(models, activeCaps);
    models = filterByOpenWeights(models);
    models = filterByBestFor(models, bestforFilter.value);
    if (q) models = models.filter(m =>
      m.display_name.toLowerCase().includes(q) ||
      (m.capabilities || []).join(' ').toLowerCase().includes(q) ||
      (m.family || '').toLowerCase().includes(q) ||
      (m.scenes || []).join(' ').toLowerCase().includes(q)
    );

    document.getElementById('model-count-tag').textContent = models.length + ' / ' + D.models.length + ' 个模型 · 已筛选';

    if (models.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div>没有匹配的模型</div>';
      return;
    }

    grid.innerHTML = models.map(m => {
      const vendor = D.vendors.find(x => x.id === m.vendor_id);
      const weekly = window.computeWeeklyTokens ? window.computeWeeklyTokens(m) : null;
      const trend  = window.computeTrendDelta ? window.computeTrendDelta(m) : 0;
      const best   = window.computeBestFor ? window.computeBestFor(m) : (m.scenes || []);
      const score  = window.computeCompositeScore ? window.computeCompositeScore(m) : null;
      const scoreClass = score === null ? '' : (score >= 85 ? 'score-A' : score >= 70 ? 'score-B' : score >= 55 ? 'score-C' : 'score-D');
      const trendIcon = trend > 0 ? '▲' : trend < 0 ? '▼' : '─';
      const trendCls  = trend > 0 ? 'trend-up' : trend < 0 ? 'trend-down' : '';
      const trendSign = trend > 0 ? '+' : '';
      return '<a href="model.html?id=' + m.id + '" class="card model-card" style="text-decoration:none;color:inherit;">' +
        (score !== null ? '<div class="score-badge ' + scoreClass + '" title="综合分数">' + score + '</div>' : '') +
        '<div class="model-card-head">' +
          '<div class="model-card-logo">' + (vendor?.logo || '🤖') + '</div>' +
          '<div style="flex:1;min-width:0;">' +
            '<div class="model-card-title">' + escapeHtml(m.display_name) + '</div>' +
            '<div class="model-card-vendor">' + escapeHtml(vendor?.name_zh || vendor?.name || '') + ' · ' + (m.release_date || '') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="model-card-capabilities">' + renderCapabilityIcons(m) + '</div>' +
        '<div class="model-card-prices">' + renderPrice5D(m) + '</div>' +
        (best.length ? '<div class="model-card-bestfor">Best for: ' + best.slice(0,3).map(b => '<span class="bestfor-tag">' + escapeHtml(b) + '</span>').join('') + '</div>' : '') +
        '<div class="model-card-meta">' +
          '<div class="model-card-trend" title="周 token 用量趋势">' +
            (weekly !== null ? '📈 ' + weekly + ' tokens/week · ' : '') +
            '<span class="' + trendCls + '">' + trendSign + trend + '% ' + trendIcon + '</span>' +
          '</div>' +
          '<div>' + fmtCtx(m.context_window) + ' ctx</div>' +
        '</div>' +
      '</a>';
    }).join('');
  }

  vendorFilter.addEventListener('change', render);
  licenseFilter.addEventListener('change', render);
  bestforFilter.addEventListener('change', render);
  openWeightsToggle.addEventListener('change', render);
  search.addEventListener('input', render);
  render();
})();
</script>

<script>
// 触发本页初始化
if (window.PAGE_INITIALIZERS && window.PAGE_INITIALIZERS["models"]) {
  window.PAGE_INITIALIZERS["models"]();
}
</script>
</body>
</html>
