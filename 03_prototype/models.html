<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型库 - API Radar</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
.main h1 { font-size: 28px; margin-bottom: 8px; }
.page-desc { color: var(--muted); margin-bottom: 24px; }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; padding: 16px; }
</style>
</head>
<body>
<div id="topbar"></div>
<main class="main">
  <div class="page-hero fade-in">
    <div class="page-hero-tagline"><span class="page-hero-tagline-dot"></span><span>60 个模型 · 实时</span></div>
    <h1><span class="gradient-text">🧠 模型库</span></h1>
    <p class="subtitle" id="page-meta">加载中...</p>
  </div>

  <div class="card filter-bar">
    <select id="vendor-filter" style="padding:10px 14px;background:var(--bg-deep);border:1px solid var(--border);border-radius:8px;color:var(--fg);min-width:160px;">
      <option value="">所有厂商</option>
    </select>
    <select id="license-filter" style="padding:10px 14px;background:var(--bg-deep);border:1px solid var(--border);border-radius:8px;color:var(--fg);min-width:140px;">
      <option value="">所有许可</option>
      <option value="open">开源</option>
      <option value="proprietary">闭源</option>
    </select>
    <input type="text" id="model-search" placeholder="🔍 搜索模型名 / 能力" style="padding:10px 14px;background:var(--bg-deep);border:1px solid var(--border);border-radius:8px;color:var(--fg);min-width:280px;flex:1;">
  </div>

  <div id="model-grid" class="model-grid"></div>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function() {
  if (typeof renderTopbar === 'function') renderTopbar('models');
  const D = API_RADAR_DATA;

  document.getElementById('page-meta').textContent = D.models.length + ' 个模型 · 按厂商 / 价格筛选';

  const grid = document.getElementById('model-grid');
  const vendorFilter = document.getElementById('vendor-filter');
  const licenseFilter = document.getElementById('license-filter');
  const search = document.getElementById('model-search');

  // 填厂商筛选
  D.vendors.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.id;
    opt.textContent = v.name;
    vendorFilter.appendChild(opt);
  });

  function render() {
    let models = D.models.slice();
    const v = vendorFilter.value;
    const l = licenseFilter.value;
    const q = (search.value || '').trim().toLowerCase();
    if (v) models = models.filter(m => m.vendor_id === v);
    if (l === 'open') models = models.filter(m => m.is_open_weight);
    if (l === 'proprietary') models = models.filter(m => !m.is_open_weight);
    if (q) models = models.filter(m =>
      m.display_name.toLowerCase().includes(q) ||
      (m.capabilities || []).join(' ').toLowerCase().includes(q) ||
      (m.family || '').toLowerCase().includes(q)
    );

    if (models.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div>没有匹配的模型</div>';
      return;
    }

    grid.innerHTML = models.map(m => {
      const vendor = D.vendors.find(x => x.id === m.vendor_id);
      const price = m.official_input_usd_m;
      const output = m.official_output_usd_m;
      return `<a href="model.html?id=${m.id}" class="card model-card" style="text-decoration:none;color:inherit;">
        <div class="model-card-head">
          <div class="model-card-logo">${vendor?.logo || '🤖'}</div>
          <div style="flex:1;min-width:0;">
            <div class="model-card-title">${m.display_name}</div>
            <div class="model-card-vendor">${vendor?.name || ''} · ${m.release_date}</div>
          </div>
        </div>
        <div class="flex between items-center" style="margin-top:8px;">
          <div class="model-card-price mono">${fmtUSD(price)} <span class="muted text-xs">in</span> · ${fmtUSD(output)} <span class="muted text-xs">out</span></div>
          <div class="muted text-xs">${fmtCtx(m.context_window)} ctx</div>
        </div>
        <div class="model-card-tags">
          ${(m.capabilities || []).slice(0, 3).map(c => '<span class="tag">' + c + '</span>').join('')}
          ${m.is_open_weight ? '<span class="tag tag-success">开源</span>' : ''}
        </div>
      </a>`;
    }).join('');
  }

  vendorFilter.addEventListener('change', render);
  licenseFilter.addEventListener('change', render);
  search.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
