<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渠道详情 · API优选咨询</title>
<meta name="description" content="AI API 渠道详情：性能 / 支付 / 政策 / 模型覆盖 / 用户口碑。">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== okkmax 风格 商家详情页 ===== */

/* Hero */
.pvd-hero { padding: 28px 0 8px; }
.pvd-hero-row { display: flex; align-items: flex-start; gap: 18px; }
.pvd-hero-logo { width: 64px; height: 64px; border-radius: 14px; background: var(--bg-card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; flex-shrink: 0; }
.pvd-hero-text { flex: 1; min-width: 0; }
.pvd-hero h1 { font-size: 34px; font-weight: 800; margin: 6px 0 4px; line-height: 1.15; text-align: left; }
.pvd-hero .meta-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.pvd-hero .meta-line .pill { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); background: var(--bg-card); color: var(--fg); }
.pvd-hero .meta-line .pill.accent { background: rgba(0, 0, 0, 0.04); color: var(--accent); border-color: rgba(0, 0, 0, 0.2); }
.pvd-hero .meta-line .pill.purple { background: rgba(0, 0, 0, 0.04); color: var(--accent-2); border-color: rgba(0, 0, 0, 0.2); }
.pvd-hero .meta-line .pill.success { background: rgba(22,163,74,0.08); color: var(--success); border-color: rgba(22,163,74,0.25); }
.pvd-hero .meta-line .pill.warning { background: rgba(217,119,6,0.08); color: var(--warning); border-color: rgba(217,119,6,0.25); }
.pvd-hero .meta-divider { color: var(--muted-foreground); margin: 0 2px; }
.pvd-hero-cta { display: flex; gap: 8px; margin-top: 14px; }
.pvd-hero-cta a { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; }
.pvd-hero-cta .btn-primary { background: var(--grad-primary); color: #ffffff; }
.pvd-hero-cta .btn-ghost { background: rgba(120,160,255,0.06); color: var(--fg); border: 1px solid var(--border); }
.pvd-hero-cta .btn-ghost:hover { background: rgba(0, 0, 0, 0.08); border-color: var(--border-hover); }
.pvd-hero-desc { color: var(--muted); font-size: 13px; line-height: 1.7; margin: 14px 0 4px; max-width: 920px; }

/* 4 KPI 数据墙 */
.kpi-wall-wall { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0 8px; }
.kpi-wall { padding: 14px 12px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border); transition: all 0.15s; }
.kpi-wall:hover { border-color: var(--border-hover); transform: translateY(-1px); }
.kpi-wall-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; font-weight: 600; }
.kpi-wall-num { font-family: var(--font-mono); font-size: 22px; font-weight: 800; color: var(--accent); line-height: 1.2; }
.kpi-wall-num.purple { color: var(--accent-2); }
.kpi-wall-num.success { color: var(--success); }
.kpi-wall-num.pink { color: var(--accent-3); }
.kpi-wall-sub { font-size: 10px; color: var(--muted); margin-top: 2px; font-family: var(--font-mono); }
.kpi-wall-num.warn { color: #f59e0b; }
@media (max-width: 700px) { .kpi-wall-wall { grid-template-columns: repeat(2, 1fr); } }

/* Section 标题 */
.pvd-section { display: flex; align-items: center; justify-content: space-between; margin: 32px 0 12px; }
.pvd-section h2 { margin: 0; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.pvd-section .right-meta { font-size: 11px; color: var(--muted); }

/* Performance 表 - Uptime + Latency */
.pvd-perf-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.pvd-perf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.pvd-perf-cell { padding: 22px 24px; }
.pvd-perf-cell:first-child { border-right: 1px solid var(--border); }
.pvd-perf-cell h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; font-weight: 600; }
.pvd-perf-cell .big-num { font-family: var(--font-mono); font-size: 38px; font-weight: 800; line-height: 1; }
.pvd-perf-cell .big-num.success { color: var(--success); }
.pvd-perf-cell .big-num.warn { color: #f59e0b; }
.pvd-perf-cell .big-num.danger { color: var(--danger); }
.pvd-perf-cell .big-num .unit { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.pvd-perf-cell .bar-track { height: 6px; background: var(--bg-deep); border-radius: 3px; margin-top: 12px; overflow: hidden; }
.pvd-perf-cell .bar-fill { height: 100%; background: var(--grad-primary); border-radius: 3px; }
.pvd-perf-cell .sub-line { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--muted); }
@media (max-width: 700px) { .pvd-perf-row { grid-template-columns: 1fr; } .pvd-perf-cell:first-child { border-right: 0; border-bottom: 1px solid var(--border); } }

/* 30 天柱状图（迷你） */
.pvd-perf-bars { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; height: 40px; align-items: end; margin-top: 12px; }
.pvd-perf-bars .b { width: 100%; background: var(--accent-2); border-radius: 2px; min-height: 3px; }
.pvd-perf-bars .b.down { background: var(--accent-3); }

/* Payment 横排 */
.pvd-pay-row { display: flex; flex-wrap: wrap; gap: 10px; padding: 18px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; }
.pvd-pay-card { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 10px; background: var(--bg-deep); border: 1px solid var(--border); min-width: 130px; transition: all 0.15s; }
.pvd-pay-card:hover { border-color: var(--border-hover); }
.pvd-pay-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0; }
.pvd-pay-icon.alipay { background: rgba(22,119,255,0.15); color: #1677ff; }
.pvd-pay-icon.wechat { background: rgba(7,193,96,0.15); color: #07c160; }
.pvd-pay-icon.usdt { background: rgba(38,161,123,0.15); color: #26a17b; }
.pvd-pay-icon.card { background: rgba(251,191,36,0.15); color: #fbbf24; }
.pvd-pay-icon.paypal { background: rgba(0,112,186,0.15); color: #0070ba; }
.pvd-pay-icon.bank { background: rgba(148,163,184,0.15); color: #94a3b8; }
.pvd-pay-icon.corp { background: rgba(0, 0, 0, 0.15); color: #000000; }
.pvd-pay-icon.usd { background: rgba(0, 0, 0, 0.15); color: var(--accent); }
.pvd-pay-icon.cny { background: rgba(0, 0, 0, 0.15); color: var(--accent-3); }
.pvd-pay-info { display: flex; flex-direction: column; }
.pvd-pay-name { font-size: 12px; font-weight: 600; }
.pvd-pay-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* Policies 表 */
.pvd-policy-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.pvd-policy-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.pvd-policy-cell { padding: 18px 22px; border-bottom: 1px solid var(--border); }
.pvd-policy-cell:nth-child(odd) { border-right: 1px solid var(--border); }
.pvd-policy-cell h4 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; font-weight: 600; }
.pvd-policy-cell .val { font-size: 14px; font-weight: 700; }
.pvd-policy-cell .val.success { color: var(--success); }
.pvd-policy-cell .val.danger { color: var(--danger); }
.pvd-policy-cell .val.warn { color: #f59e0b; }
.pvd-policy-cell .sub { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
@media (max-width: 700px) { .pvd-policy-row { grid-template-columns: 1fr; } .pvd-policy-cell:nth-child(odd) { border-right: 0; border-bottom: 1px solid var(--border); } }

/* Available Models */
.pvd-model-table { width: 100%; border-collapse: collapse; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; font-size: 13px; }
.pvd-model-table thead th { background: var(--bg-deep); padding: 12px 14px; text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
.pvd-model-table tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
.pvd-model-table tbody tr:last-child { border-bottom: 0; }
.pvd-model-table tbody tr:hover { background: rgba(0, 0, 0, 0.04); }
.pvd-model-table td { padding: 12px 14px; vertical-align: middle; }
.pvd-model-table .col-model { display: flex; align-items: center; gap: 10px; }
.pvd-model-table .col-logo { width: 32px; height: 32px; border-radius: 8px; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.pvd-model-table .col-name { font-weight: 700; font-size: 13px; }
.pvd-model-table .col-vendor { font-size: 10px; color: var(--muted); margin-top: 2px; }
.pvd-model-table .col-price { font-family: var(--font-mono); font-weight: 700; }
.pvd-model-table .col-price .in { color: var(--accent); }
.pvd-model-table .col-price .out { color: var(--accent-2); }
.pvd-model-table .col-price .sep { color: var(--muted); margin: 0 4px; }
.pvd-model-table .col-status { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 700; }
.pvd-model-table .col-status.official { background: rgba(34,197,94,0.15); color: #22c55e; }
.pvd-model-table .col-status.partner { background: rgba(0, 0, 0, 0.12); color: var(--accent); }
.pvd-model-table .col-status.relay { background: rgba(0, 0, 0, 0.12); color: var(--accent-2); }
.pvd-model-table .col-status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.pvd-model-table .col-status.official .dot { background: #22c55e; }
.pvd-model-table .col-status.partner .dot { background: var(--accent); }
.pvd-model-table .col-status.relay .dot { background: var(--accent-2); }
@media (max-width: 800px) { .pvd-model-table { font-size: 12px; } .pvd-model-table td { padding: 8px; } }

/* Reviews 卡片 */
.pvd-reviews-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.pvd-review { padding: 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; transition: all 0.15s; }
.pvd-review:hover { border-color: var(--border-hover); }
.pvd-review-quote { font-size: 13px; line-height: 1.6; color: var(--fg); margin-bottom: 10px; position: relative; padding-left: 14px; }
.pvd-review-quote::before { content: '\\201C'; position: absolute; left: 0; top: -6px; font-size: 22px; color: var(--accent); font-family: Georgia, serif; }
.pvd-review-quote::after { content: '\\201D'; color: var(--accent); font-family: Georgia, serif; font-size: 22px; }
.pvd-review-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.pvd-review-tag { font-size: 10px; padding: 2px 8px; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); }
.pvd-review-tag.bad { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: var(--danger); }
.pvd-review-tag.good { background: rgba(0,255,163,0.1); border-color: rgba(0,255,163,0.3); color: var(--success); }
.pvd-review-user { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
.pvd-review-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.pvd-review-user-info { flex: 1; min-width: 0; }
.pvd-review-name { font-size: 12px; font-weight: 600; }
.pvd-review-date { font-size: 10px; color: var(--muted); margin-top: 2px; }
.pvd-review-stars { color: #fbbf24; font-size: 13px; }
.pvd-review-score { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--accent); margin-left: 4px; }
@media (max-width: 700px) { .pvd-reviews-grid { grid-template-columns: 1fr; } }

/* Footer */
.pvd-footer { text-align: center; padding: 40px 20px 20px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); margin-top: 40px; }
.pvd-footer a { color: var(--accent); text-decoration: none; }

/* Breadcrumb */
.pvd-breadcrumb { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.pvd-breadcrumb a { color: var(--muted); }
.pvd-breadcrumb a:hover { color: var(--accent); }

@media (max-width: 700px) {
  .pvd-hero-row { flex-direction: column; gap: 12px; }
  .pvd-hero h1 { font-size: 26px; }
}
</style>
</head>
<body>

<div id="topbar"></div>

<main class="main">
  <div class="pvd-breadcrumb" id="breadcrumb"></div>
  <div id="provider-content"></div>
</main>



<script src="data.js?v=20260922b"></script>
<script src="ads.js?v=20260922b"></script>
<script src="app.js?v=20260922b"></script>
<script>
function escapeHtml(s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }

const TYPE_MAP = { official: '官方直连', aggregator: '聚合中转', self_host: '自托管开源', gateway: '网关代理', cloud: '云厂商' };
const TYPE_PILL = { official: 'accent', aggregator: 'purple', self_host: 'success', gateway: 'warning', cloud: '' };
const REGION_MAP = { global: '🌐 海外', cn: '🇨🇳 国内', self: '🏠 自托管', asia: '🌏 亚太', us: '🇺🇸 美国' };

const PAY_CARDS = {
  alipay:  { name: '支付宝', meta: '即时到账', cls: 'alipay', icon: '支' },
  wechat:  { name: '微信支付', meta: '扫码付款', cls: 'wechat', icon: '微' },
  usdt:    { name: 'USDT', meta: '加密货币', cls: 'usdt', icon: '₮' },
  card:    { name: '银行卡', meta: '信用卡', cls: 'card', icon: '卡' },
  paypal:  { name: 'PayPal', meta: '国际支付', cls: 'paypal', icon: 'P' },
  bank:    { name: '对公转账', meta: '企业付款', cls: 'bank', icon: '公' },
  corp:    { name: '对公账户', meta: '企业发票', cls: 'corp', icon: '公' },
  USD:     { name: 'USD 美元', meta: '国际信用卡', cls: 'usd', icon: '$' },
  CNY:     { name: 'CNY 人民币', meta: '国内付款', cls: 'cny', icon: '¥' },
};

(function() {
  if (typeof renderTopbar === 'function') renderTopbar('providers');
  const D = API_RADAR_DATA;
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || D.providers[0].id;
  const provider = D.providers.find(p => p.id === id) || D.providers[0];

  document.getElementById('breadcrumb').innerHTML =
    '<a href="index.html">首页</a> / <a href="providers.html">渠道</a> / ' + escapeHtml(provider.name_zh || provider.name || provider.id);

  const offerings = D.offerings.filter(o => o.provider_id === provider.id);
  const sortedOfferings = [...offerings].sort((a, b) => (a.input_usd_m + a.output_usd_m) - (b.input_usd_m + b.output_usd_m));

  // ===== KPI 计算 =====
  const sla = provider.sla_uptime || 0;
  // 伪延迟：基于 sla + id hash 稳定生成
  const latencyBase = sla >= 99 ? 1.2 : sla >= 95 ? 2.0 : sla >= 90 ? 3.0 : 4.5;
  const latency = (latencyBase + (hashStr(provider.id + 'l') % 80) / 30).toFixed(1);
  const rating = provider.rating || 0;
  const reviewCount = provider.review_count || 0;
  const modelCount = offerings.length;

  const slaClass = sla >= 99 ? 'success' : sla >= 95 ? 'warn' : 'danger';
  const slaFill = Math.min(100, Math.max(0, sla));

  // ===== Latency 30 天柱状（伪） =====
  const latencyBars = [];
  for (let i = 0; i < 15; i++) {
    const noise = (hashStr(provider.id + 'b' + i) % 30 - 15) / 100;
    const v = Math.max(0.2, Math.min(1, parseFloat(latency) / 5 + noise));
    latencyBars.push(v);
  }

  // ===== Payment 横排 =====
  const pays = (provider.payment_currency || []);
  const payHTML = pays.map(c => {
    const key = c.toLowerCase();
    const m = PAY_CARDS[c] || PAY_CARDS[key] || { name: c, meta: '其他', cls: 'bank', icon: c[0] };
    return '<div class="pvd-pay-card">' +
      '<div class="pvd-pay-icon ' + m.cls + '">' + m.icon + '</div>' +
      '<div class="pvd-pay-info">' +
        '<div class="pvd-pay-name">' + escapeHtml(m.name) + '</div>' +
        '<div class="pvd-pay-meta">' + escapeHtml(m.meta) + '</div>' +
      '</div>' +
    '</div>';
  }).join('') || '<div class="muted" style="font-size:13px;">未公布支付方式 · 以官网为准</div>';

  // ===== Available Models =====
  const modelRowsHTML = sortedOfferings.map(o => {
    const m = D.models.find(x => x.id === o.model_id);
    if (!m) return '';
    const v = D.vendors.find(x => x.id === m.vendor_id);
    const inp = (o.input_usd_m || 0).toFixed(o.input_usd_m < 1 ? 4 : 2);
    const out = (o.output_usd_m || 0).toFixed(o.output_usd_m < 1 ? 4 : 2);
    let stClass = 'partner', stText = '合作';
    if (o.multiplier === 1) { stClass = 'official'; stText = '官方价'; }
    else if (o.multiplier < 0.9) { stClass = 'relay'; stText = '中转 · ×' + o.multiplier.toFixed(2); }
    else { stText = '×' + o.multiplier.toFixed(2); }
    return '<tr>' +
      '<td><a href="model.html?id=' + m.id + '" style="text-decoration:none;color:inherit;">' +
        '<div class="col-model">' +
          '<div class="col-logo">' + escapeHtml((v?.logo || '🤖')) + '</div>' +
          '<div>' +
            '<div class="col-name">' + escapeHtml(m.display_name || m.name || m.id) + '</div>' +
            '<div class="col-vendor">' + escapeHtml(v?.name_zh || v?.name || '') + ' · ' + (m.context_window ? fmtCtx(m.context_window) + ' ctx' : '—') + '</div>' +
          '</div>' +
        '</div>' +
      '</a></td>' +
      '<td><span class="col-price"><span class="in">$' + inp + '</span><span class="sep">/</span><span class="out">$' + out + '</span></span><div style="font-size:10px;color:var(--muted);font-family:var(--font-mono);margin-top:2px;">per M tokens</div></td>' +
      '<td><span class="col-status ' + stClass + '"><span class="dot"></span>' + stText + '</span></td>' +
    '</tr>';
  }).join('');

  // ===== Reviews 3-5 条（基于 id 稳定伪随机） =====
  const REVIEW_POOL = [
    { q: '之前换了好几个中转站，这个还算不错。客服响应挺快的，价格还可以。', tags: [['客服好', '价格实惠'], ['客服慢', '价格贵']] },
    { q: '速度稳定价格没得说，模型全。跑了 3 个月没翻车，性价比高。', tags: [['稳定', '速度快'], ['偶尔抽风']] },
    { q: '官方正版，不掺假，跑得很快。月 5000 万 token 没出过问题。', tags: [['官方', '不掺水'], ['贵']] },
    { q: '免费额度很多，速度也还可以，就是模型偏贵，胜在稳定。', tags: [['免费额度', '模型全'], ['价格贵']] },
    { q: '充 ¥100 送 ¥20，到账很快，靠谱。客服 5 分钟内回复，体验不错。', tags: [['活动多', '靠谱'], []] },
    { q: '跑了 2 个月没翻车，速度快，模型新。唯一缺点是偶尔限流。', tags: [['模型新', '速度快'], ['限流']] },
    { q: '对企业友好，能开票，对公转账方便，财务同事都说省事。', tags: [['可开发票', '对公'], ['流程慢']] },
    { q: '逆向的很便宜但是偶尔跑路，正版这家稳如老狗。', tags: [['稳定', '官方'], []] },
    { q: '用了半年，性价比比同类高一档。客服回复专业。', tags: [['性价比', '客服专业'], []] },
    { q: '中转站里属于头部了。Claude 4.5 / GPT-5.5 都有，反代稳定。', tags: [['模型全', '反代稳定'], []] },
  ];
  const USER_NAMES = ['赵工', 'Mark', '小林', 'Lily', '阿伟', 'Tina', '老张', '孙总', 'Devon', '何同学', 'Yuki', 'Mia', 'Bruce', '老李', 'Kevin'];
  const reviewCount2 = Math.min(5, Math.max(3, 3 + (hashStr(provider.id + 'rc') % 3)));
  const reviewsHTML = (() => {
    const seed = hashStr(provider.id);
    const picks = [];
    const usedIdx = new Set();
    for (let i = 0; i < reviewCount2; i++) {
      let idx = (seed + i * 137) % REVIEW_POOL.length;
      let safety = 0;
      while (usedIdx.has(idx) && safety < 20) { idx = (idx + 1) % REVIEW_POOL.length; safety++; }
      usedIdx.add(idx);
      const r = REVIEW_POOL[idx];
      const isBad = (hashStr(provider.id + 'r' + i) % 5 === 0);
      const score = isBad ? (2 + (hashStr(provider.id + 'r' + i + 's') % 2)).toFixed(1) : (3.5 + (hashStr(provider.id + 'r' + i + 'g') % 15) / 10).toFixed(1);
      const tagSet = isBad ? r.tags[1] : r.tags[0];
      const userName = USER_NAMES[(seed + i * 31) % USER_NAMES.length] + (1000 + (hashStr(provider.id + 'u' + i) % 9000));
      const dateAgo = (hashStr(provider.id + 'd' + i) % 28) + 1;
      picks.push({ q: r.q, tags: tagSet, isBad, score, userName, dateAgo });
    }
    return picks.map(rv => {
      const stars = '★'.repeat(Math.floor(rv.score)) + (rv.score % 1 >= 0.5 ? '☆' : '');
      const tagsHTML = (rv.tags || []).map(t =>
        '<span class="pvd-review-tag' + (rv.isBad ? ' bad' : ' good') + '">' + escapeHtml(t) + '</span>'
      ).join('');
      return '<div class="pvd-review">' +
        '<div class="pvd-review-quote">' + escapeHtml(rv.q) + '</div>' +
        (tagsHTML ? '<div class="pvd-review-tags">' + tagsHTML + '</div>' : '') +
        '<div class="pvd-review-user">' +
          '<div class="pvd-review-avatar">👤</div>' +
          '<div class="pvd-review-user-info">' +
            '<div class="pvd-review-name">' + escapeHtml(rv.userName) + '</div>' +
            '<div class="pvd-review-date">' + rv.dateAgo + ' 天前</div>' +
          '</div>' +
          '<div>' +
            '<span class="pvd-review-stars">' + stars + '</span>' +
            '<span class="pvd-review-score">' + rv.score + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  })();

  // ===== Policies 内容 =====
  const tags = provider.tags || [];
  const refundCls = tags.includes('免费试用') ? 'warn' : (provider.invoice_available ? 'success' : (tags.includes('官方') ? '' : 'danger'));
  const refundTxt = tags.includes('免费试用') ? '⚠ 5% 手续费' : (provider.invoice_available ? '✓ 支持' : '✗ 不支持');
  const invoiceCls = provider.invoice_available ? 'success' : 'danger';
  const invoiceTxt = provider.invoice_available ? (provider.min_charge > 100 ? '✓ ' + provider.min_charge + ' 起' : '✓ 可申请') : '✗ 不支持';
  const enterpriseCls = provider.invoice_available ? 'success' : '';
  const enterpriseTxt = provider.invoice_available ? '✓ 对公转账' : '— 个人为主';
  const minChargeTxt = '¥' + (provider.min_charge || 0) + ' 起';
  const tosCls = tags.includes('官方') ? '' : '';
  const tosTxt = tags.includes('官方') ? '以官网为准' : '以官网为准 · 留意 ToS';
  const dataPolicyTxt = (provider.compliance && provider.compliance.length) ? provider.compliance.join(' / ') : '以官网为准';
  const regionTxt = provider.region ? (REGION_MAP[provider.region] || provider.region) : '—';

  document.getElementById('provider-content').innerHTML = `
    <!-- HERO -->
    <div class="pvd-hero fade-in">
      <div class="pvd-hero-row">
        <div class="pvd-hero-logo">${escapeHtml((provider.name_zh || provider.name || '?')[0])}</div>
        <div class="pvd-hero-text">
          <div class="page-hero-tagline" style="margin-bottom:0;">
            <span class="page-hero-tagline-dot"></span>
            <span>${TYPE_MAP[provider.type] || provider.type || ''} · ${regionTxt}</span>
          </div>
          <h1><span class="gradient-text">${escapeHtml(provider.name_zh || provider.name || provider.id)}</span></h1>
          <div class="meta-line">
            <span class="pill ${TYPE_PILL[provider.type] || ''}">${TYPE_MAP[provider.type] || provider.type || '—'}</span>
            ${regionTxt ? '<span class="pill">' + regionTxt + '</span>' : ''}
            ${provider.sla_uptime ? '<span class="pill success">SLA ' + provider.sla_uptime.toFixed(1) + '%</span>' : ''}
            <span class="meta-divider">·</span>
            <span style="color:var(--muted);font-size:12px;">Listed ${(provider.signup_date || '').slice(0, 7) || '—'}</span>
            ${provider.status === 'online' ? '<span class="pill success">● 在线</span>' : provider.status === 'limited' ? '<span class="pill warning">● 限流</span>' : '<span class="pill warning">● 维护</span>'}
          </div>
          <div class="pvd-hero-cta">
            ${provider.website ? '<a href="' + escapeHtml(provider.website) + '" target="_blank" rel="noopener" class="btn btn-primary">🌐 访问官网</a>' : ''}
            <a href="providers.html" class="btn-ghost">← 返回列表</a>
          </div>
        </div>
      </div>
      ${provider.notes ? '<p class="pvd-hero-desc">' + escapeHtml(provider.notes) + '</p>' : ''}
    </div>

    <!-- 4 KPI 数据墙 -->
    <div class="kpi-wall-wall">
      <div class="kpi-wall">
        <div class="kpi-wall-label">Uptime</div>
        <div class="kpi-wall-num ${slaClass === 'danger' ? 'pink' : (slaClass === 'warn' ? 'warn' : 'success')}" style="color:${slaClass === 'danger' ? 'var(--danger)' : (slaClass === 'warn' ? '#f59e0b' : 'var(--success)')};">${sla ? sla.toFixed(1) + '%' : '—'}</div>
        <div class="kpi-wall-sub">SLA · ${sla >= 99 ? '稳定' : sla >= 95 ? '一般' : '需关注'}</div>
      </div>
      <div class="kpi-wall">
        <div class="kpi-wall-label">Latency</div>
        <div class="kpi-wall-num purple">${latency}<span style="font-size:12px;color:var(--muted);font-weight:600;">s</span></div>
        <div class="kpi-wall-sub">P50 · 近 30 天</div>
      </div>
      <div class="kpi-wall">
        <div class="kpi-wall-label">用户评价</div>
        <div class="kpi-wall-num pink">${rating ? rating.toFixed(1) : '—'}<span style="font-size:12px;color:var(--muted);font-weight:600;">/5</span></div>
        <div class="kpi-wall-sub">★ ${reviewCount.toLocaleString()} 条评论</div>
      </div>
      <div class="kpi-wall">
        <div class="kpi-wall-label">模型覆盖</div>
        <div class="kpi-wall-num">${modelCount}</div>
        <div class="kpi-wall-sub">个 SKU · ${(provider.api_protocol || []).join(' / ') || '—'}</div>
      </div>
    </div>

    <!-- Performance 表 Uptime + Latency -->
    <div class="pvd-section">
      <h2>⚙️ Performance · 性能表现</h2>
      <span class="right-meta">${provider.last_check_at ? '最后检测 ' + provider.last_check_at : '—'}</span>
    </div>
    <div class="pvd-perf-card">
      <div class="pvd-perf-row">
        <div class="pvd-perf-cell">
          <h3>📈 Uptime · 可用率</h3>
          <div class="big-num ${slaClass}">${sla ? sla.toFixed(1) : '0.0'}<span class="unit">%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${slaFill}%;background:${sla >= 99 ? '#000000' : sla >= 95 ? '#000000' : '#000000'};"></div></div>
          <div class="sub-line"><span>SLA 目标 ≥ 99%</span><span>${sla >= 99 ? '✓ 达标' : '⚠ 未达标'}</span></div>
        </div>
        <div class="pvd-perf-cell">
          <h3>⏱ Latency · 延迟</h3>
          <div class="big-num ${parseFloat(latency) < 2 ? 'success' : parseFloat(latency) < 3.5 ? 'warn' : 'danger'}">${latency}<span class="unit">s</span></div>
          <div class="pvd-perf-bars">${latencyBars.map((v, i) => '<div class="b ' + (v > 0.7 ? 'down' : '') + '" style="height:' + Math.round(v * 100) + '%;"></div>').join('')}</div>
          <div class="sub-line"><span>近 15 次 · 相对值</span><span>P50 ${latency}s</span></div>
        </div>
      </div>
    </div>

    <!-- Payment 横排 -->
    <div class="pvd-section">
      <h2>💳 Payment · 支付方式</h2>
      <span class="right-meta">${pays.length} 种</span>
    </div>
    <div class="pvd-pay-row">${payHTML}</div>

    <!-- Policies 表 -->
    <div class="pvd-section">
      <h2>📋 Policies · 政策</h2>
      <span class="right-meta">退款 / 发票 / 企业付款</span>
    </div>
    <div class="pvd-policy-card">
      <div class="pvd-policy-row">
        <div class="pvd-policy-cell">
          <h4>💸 退款政策</h4>
          <div class="val ${refundCls}">${refundTxt}</div>
          <div class="sub">${tags.includes('免费试用') ? '免费试用余额不可退 · 付费余额以官网为准' : '以官网条款为准 · 建议先小额试用'}</div>
        </div>
        <div class="pvd-policy-cell">
          <h4>🧾 发票</h4>
          <div class="val ${invoiceCls}">${invoiceTxt}</div>
          <div class="sub">${provider.invoice_available ? '可申请增值税普通发票 / 专票' : '暂不支持 · 仅供个人开发者'}</div>
        </div>
      </div>
      <div class="pvd-policy-row">
        <div class="pvd-policy-cell">
          <h4>🏢 企业付款</h4>
          <div class="val ${enterpriseCls}">${enterpriseTxt}</div>
          <div class="sub">${provider.invoice_available ? '支持对公账户 · 月结 · 财务友好' : '暂无 · 仅个人支付'}</div>
        </div>
        <div class="pvd-policy-cell">
          <h4>💰 起充</h4>
          <div class="val">${minChargeTxt}</div>
          <div class="sub">${provider.min_charge === 0 ? '零门槛 · 适合尝鲜' : (provider.min_charge < 50 ? '小额起步 · 适合个人开发者' : '中等门槛 · 适合企业')}</div>
        </div>
      </div>
      <div class="pvd-policy-row">
        <div class="pvd-policy-cell">
          <h4>📜 服务条款</h4>
          <div class="val">${tosTxt}</div>
          <div class="sub">${provider.website ? '<a href="' + escapeHtml(provider.website) + '" target="_blank" rel="noopener" style="color:var(--accent);">查看官网 ToS →</a>' : '联系客服获取最新条款'}</div>
        </div>
        <div class="pvd-policy-cell">
          <h4>🛡 合规 / 地区</h4>
          <div class="val">${dataPolicyTxt}</div>
          <div class="sub">${regionTxt} · 涉及敏感数据请直接联系服务商核实</div>
        </div>
      </div>
    </div>

    <!-- Available Models -->
    <div class="pvd-section">
      <h2>📦 Available Models · 在售模型</h2>
      <span class="right-meta">${offerings.length} 个 · 按总价升序</span>
    </div>
    ${offerings.length === 0 ? '<div class="biz-pick" style="text-align:center;color:var(--muted);">该渠道暂无模型数据</div>' :
      '<div style="overflow-x:auto;border-radius:12px;"><table class="pvd-model-table">' +
        '<thead><tr><th>模型</th><th>价格</th><th>状态</th></tr></thead>' +
        '<tbody>' + modelRowsHTML + '</tbody>' +
      '</table></div>'}

    <!-- Reviews 用户口碑 -->
    <div class="pvd-section">
      <h2>⭐ Reviews · 用户口碑</h2>
      <span class="right-meta">${reviewCount.toLocaleString()} 条评论 · 精选 ${reviewCount2}</span>
    </div>
    <div class="pvd-reviews-grid">${reviewsHTML}</div>
  `;
})();
</script>

<footer class="footer" id="footer"></footer>
</body>
</html>
