<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渠道详情 - API Radar</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.main h1 { font-size: 28px; }
.tri-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 24px; }
.tri-card { padding: 22px; }
.tri-card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 14px; }
.tri-card .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.tri-card .info-row:last-child { border: 0; }
.tri-card .info-row span:first-child { color: var(--muted); }
.tri-card .info-row span:last-child { font-weight: 600; }
.model-mini-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: center; }
.model-mini-row:last-child { border: 0; }
.model-mini-row:hover { background: rgba(0,217,255,0.04); }
.breadcrumb { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.breadcrumb a { color: var(--muted); }
.breadcrumb a:hover { color: var(--accent); }
.type-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
<div id="topbar"></div>
<main class="main">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="provider-content"></div>

  <!-- 广告位 -->
  <div style="max-width:1100px;margin:24px auto;padding:0 24px;"><div class="ad-slot" data-slot="providers_top"></div></div>
</main>
<script src="data.js"></script>
<script src="ads.js"></script>
<script src="app.js"></script>
<script>
function escapeHtml(s) { return String(s || "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"})[c]); }
(function() {
  if (typeof renderTopbar === 'function') renderTopbar('providers');
  const D = API_RADAR_DATA;
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || D.providers[0].id;
  const provider = D.providers.find(p => p.id === id) || D.providers[0];

  document.getElementById('breadcrumb').innerHTML = '<a href="index.html">首页</a> / <a href="providers.html">渠道</a> / ' + provider.name;

  const offerings = D.offerings.filter(o => o.provider_id === provider.id);
  const typeMap = { official: '官方直连', aggregator: '聚合中转', self_host: '自托管开源', gateway: '网关代理', cloud: '云厂商' };
  const typeColor = { official: 'tag-accent', aggregator: 'tag-purple', self_host: 'tag-success', gateway: 'tag-warning', cloud: 'tag' };

  document.getElementById('provider-content').innerHTML = `
    <div class="page-hero fade-in" style="text-align:left;padding:32px 0 16px;">
    <div class="page-hero-tagline" style="margin-bottom:8px;"><span class="page-hero-tagline-dot"></span><span>${typeMap[provider.type]||provider.type} · ${provider.region||''}</span></div>
    <h1 style="font-size:36px;text-align:left;"><span class="gradient-text">${escapeHtml(provider.name)}</span></h1>
    <p class="subtitle" style="text-align:left;margin:8px 0 0;">${encodeURIComponent(provider.website ? '<a href="' + provider.website + '" target="_blank">官网 →</a>' : '')} <a href="providers.html" style="color:var(--accent);">← 返回列表</a></p>
  </div>

    <p class="muted" style="line-height:1.7;padding:18px;background:var(--bg-card);border-radius:12px;border:1px solid var(--border);">
      ${escapeHtml(provider.notes || '—')}
    </p>

    <div class="tri-grid">
      <!-- 左：技术表现 -->
      <div class="card tri-card">
        <h3>⚙️ 技术表现</h3>
        <div class="info-row"><span>支持的模型</span><span>${offerings.length} 个</span></div>
        <div class="info-row"><span>价格区间</span><span>${(offerings.length > 0 ? '最低 ¥' + fmtCNY(Math.min(...offerings.map(o => o.input_usd_m)) * API_RADAR.FX) : '—')}</span></div>
        <div class="info-row"><span>协议</span><span>OpenAI 兼容</span></div>
        <div class="info-row"><span>实测样本</span><span style="color:var(--muted);">未测</span></div>
        <div class="info-row"><span>成功率</span><span style="color:var(--muted);">未测</span></div>
        <div class="info-row"><span>状态</span><span style="color:var(--success);">公开可用</span></div>
        <div class="muted text-xs" style="margin-top:16px;padding:8px;background:rgba(255,184,77,0.06);border-left:2px solid var(--warning);border-radius:4px;">
          ⚠️ 成功率/延迟本站不直接测试。请结合用户评价与自测判断。
        </div>
      </div>

      <!-- 中：商业条件 -->
      <div class="card tri-card">
        <h3>💼 商业条件</h3>
        <div class="info-row"><span>付费方式</span><span>${(provider.payment_currency || []).join(' / ')}</span></div>
        <div class="info-row"><span>起充</span><span>¥${provider.min_charge || 0}</span></div>
        <div class="info-row"><span>发票</span><span>${provider.invoice_available ? '<span style="color:var(--success);">✓ 可申请</span>' : '<span style="color:var(--muted);">× 不支持</span>'}</span></div>
        <div class="info-row"><span>企业付款</span><span>${provider.invoice_available ? '✓ 对公转账' : '— 个人为主'}</span></div>
        <div class="info-row"><span>退款政策</span><span style="color:var(--muted);">以官网为准</span></div>
        <div class="info-row"><span>服务条款</span><span style="color:var(--muted);">以官网为准</span></div>
      </div>

      <!-- 右：政策 -->
      <div class="card tri-card">
        <h3>🛡️ 数据政策</h3>
        <div class="info-row"><span>数据存储</span><span style="color:var(--muted);">以官网为准</span></div>
        <div class="info-row"><span>训练使用</span><span style="color:var(--muted);">以官网为准</span></div>
        <div class="info-row"><span>合规认证</span><span style="color:var(--muted);">以官网为准</span></div>
        <div class="info-row"><span>地区</span><span>${provider.region || '—'}</span></div>
        <div class="muted text-xs" style="margin-top:16px;padding:8px;background:rgba(255,71,87,0.06);border-left:2px solid var(--danger);border-radius:4px;">
          ⚠️ 涉及敏感数据（医疗/法律/企业机密）请直接联系服务商核实合规政策，本数据仅供参考。
        </div>
      </div>
    </div>

    <h2 style="margin:32px 0 16px;">📦 在售模型（${offerings.length}）</h2>
    <div class="card" style="padding:0;">
      ${offerings.length === 0 ? '<div class="empty-state"><div class="empty-state-icon">📦</div>暂无模型</div>' :
        offerings.sort((a, b) => (a.input_usd_m + a.output_usd_m) - (b.input_usd_m + b.output_usd_m)).map(o => {
          const m = D.models.find(x => x.id === o.model_id);
          if (!m) return '';
          return `<a href="model.html?id=${m.id}" class="model-mini-row" style="text-decoration:none;color:inherit;padding:14px 20px;">
            <div>
              <div style="font-weight:600;">${escapeHtml(m.display_name)}</div>
              <div class="muted text-xs">${(D.vendors.find(v => v.id === m.vendor_id)||{}).name || ''} · ${o.multiplier === 1.0 ? '官方价' : '×' + o.multiplier}</div>
            </div>
            <div style="text-align:right;">
              <div class="mono" style="color:var(--accent);font-weight:700;">${fmtUSD(o.input_usd_m)} / ${fmtUSD(o.output_usd_m)}</div>
              <div class="muted text-xs">${fmtCtx(m.context_window)} ctx</div>
            </div>
          </a>`;
        }).join('')
      }
    </div>
  `;
})();
</script>
</body>
</html>
