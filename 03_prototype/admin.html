<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API优选咨询 后台管理</title>
<style>
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #050714; color: #e6edff; margin: 0; padding: 0; min-height: 100vh; }

/* 顶部导航 */
.topbar { background: rgba(15,22,41,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(120,160,255,0.12); padding: 14px 24px; position: sticky; top: 0; z-index: 50; display: flex; justify-content: space-between; align-items: center; }
.topbar h1 { font-size: 18px; margin: 0; background: linear-gradient(135deg, #00d9ff, #b066ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
.topbar .user-info { font-size: 12px; color: #8896b8; }
.topbar button { background: rgba(255,71,87,0.15); color: #ff4757; border: 1px solid rgba(255,71,87,0.3); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.topbar button:hover { background: rgba(255,71,87,0.25); }

.container { max-width: 1280px; margin: 0 auto; padding: 24px; }

/* 卡片 */
.card { background: rgba(15,22,41,0.72); border: 1px solid rgba(120,160,255,0.12); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
.card h3 { margin: 0 0 16px; font-size: 16px; }

/* 表单元素 */
input, select, textarea, button { font-family: inherit; }
input, select, textarea { padding: 10px 14px; background: #0a0e1f; border: 1px solid rgba(120,160,255,0.12); border-radius: 8px; color: #e6edff; font-size: 14px; box-sizing: border-box; width: 100%; }
input:focus, select:focus, textarea:focus { outline: none; border-color: #00d9ff; box-shadow: 0 0 0 3px rgba(0,217,255,0.15); }
button { background: linear-gradient(135deg, #00d9ff, #b066ff); color: #001428; font-weight: 700; cursor: pointer; border: none; padding: 10px 18px; border-radius: 8px; width: auto; font-size: 14px; transition: opacity 0.15s; }
button:hover { opacity: 0.85; }
button.secondary { background: rgba(120,160,255,0.12); color: #8896b8; }
button.secondary:hover { background: rgba(120,160,255,0.2); color: #fff; }
button.danger { background: linear-gradient(135deg, #ff4757, #ff6b9d); color: #fff; }

/* 仪表盘统计 */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-card { padding: 20px; text-align: center; background: linear-gradient(135deg, rgba(0,217,255,0.08), rgba(176,107,255,0.05)); border-radius: 10px; border: 1px solid rgba(120,160,255,0.1); }
.stat-num { font-size: 32px; font-weight: 700; background: linear-gradient(135deg, #00d9ff, #b066ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin-bottom: 4px; }
.stat-label { font-size: 12px; color: #8896b8; }

/* Tab 切换 */
.tab-bar { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; padding: 4px; background: rgba(15,22,41,0.5); border-radius: 10px; }
.tab-bar button { padding: 8px 16px; background: transparent; color: #8896b8; font-size: 13px; }
.tab-bar button.active { background: linear-gradient(135deg, #00d9ff, #b066ff); color: #001428; }

/* 表格 */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 10px 12px; border-bottom: 1px solid rgba(120,160,255,0.12); text-align: left; }
th { color: #8896b8; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; font-weight: 600; background: rgba(10,14,31,0.5); }
tbody tr:hover { background: rgba(0,217,255,0.04); }

/* 模态框 */
.modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal.show { display: flex; }
.modal-content { background: #0a0e1f; border: 1px solid rgba(0,217,255,0.3); border-radius: 14px; padding: 28px; max-width: 720px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: 0 0 60px rgba(0,217,255,0.2); }
.modal h3 { margin: 0 0 20px; font-size: 18px; }

/* 表单布局 */
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.form-row { margin-bottom: 14px; }
.form-row.full { grid-column: 1 / -1; }
.form-row label { display: block; font-size: 11px; color: #8896b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.checkbox-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
.checkbox-row input[type=checkbox] { width: auto; }

/* 通用类 */
.flex { display: flex; gap: 12px; align-items: center; }
.flex-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.muted { color: #8896b8; font-size: 12px; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: rgba(0,217,255,0.1); color: #00d9ff; margin-right: 4px; }
.tag.tag-success { background: rgba(34,197,94,0.15); color: #22c55e; }
.tag.tag-warn { background: rgba(255,184,77,0.15); color: #ffb84d; }
.tag.tag-danger { background: rgba(255,71,87,0.15); color: #ff4757; }

/* 登录页 */
.login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-card { background: rgba(15,22,41,0.85); border: 1px solid rgba(0,217,255,0.2); border-radius: 16px; padding: 40px; max-width: 440px; width: 100%; box-shadow: 0 0 80px rgba(0,217,255,0.15); }
.login-card h2 { text-align: center; background: linear-gradient(135deg, #00d9ff, #b066ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 8px; font-size: 28px; }
.login-card .subtitle { text-align: center; color: #8896b8; margin-bottom: 24px; font-size: 13px; }

/* 操作按钮组 */
.btn-group { display: flex; gap: 4px; }
.btn-group button { padding: 4px 10px; font-size: 11px; }

/* 滚动 */
pre { background: #050714; border: 1px solid rgba(120,160,255,0.12); border-radius: 8px; padding: 16px; overflow-x: auto; font-size: 11px; max-height: 320px; }

@media (max-width: 900px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- 登录视图 -->
<div id="login-view" class="login-page">
  <div class="login-card">
    <h2>API优选咨询 后台</h2>
    <p class="subtitle">输入管理员令牌登录</p>
    <label style="display:block;font-size:11px;color:#8896b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;">管理员令牌 (ADMIN TOKEN)</label>
    <input type="password" id="login-token" placeholder="粘贴 ADMIN_TOKEN" />
    <button onclick="doLogin()" style="margin-top:20px;width:100%;padding:12px;font-size:14px;">登录</button>
    <p class="muted" style="margin-top:20px;text-align:center;">令牌保存在浏览器本地，30 天内有效</p>
  </div>
</div>

<!-- 主视图 -->
<div id="main-view" style="display:none;">
  <div class="topbar">
    <h1>API优选咨询 后台管理</h1>
    <div class="user-info">管理员 · <span id="user-id">admin</span> · <a href="https://api.apiyouxuan.top/api/admin/export" target="_blank" style="color:#00d9ff;">查看 API</a></div>
    <button onclick="logout()">退出登录</button>
  </div>

  <div class="container">
    <!-- 仪表盘 -->
    <div class="card">
      <div class="flex-between">
        <h3>📊 仪表盘</h3>
        <span class="muted" id="last-update">—</span>
      </div>
      <div class="stats-grid" id="stats-grid"></div>
    </div>

    <!-- Tab 切换 -->
    <div class="tab-bar" id="tab-bar">
      <button class="active" data-tab="models">模型管理</button>
      <button data-tab="providers">渠道管理</button>
      <button data-tab="vendors">厂商管理</button>
      <button data-tab="events">行情事件</button>
      <button data-tab="ads">广告位</button>
      <button data-tab="watch">关注列表</button>
      <button data-tab="log">操作日志</button>
      <button data-tab="ab">A/B 测试</button>
      <button data-tab="export">数据导出</button>
    </div>

    <div class="card" id="tab-content"></div>
  </div>
</div>

<!-- 编辑模态框 -->
<div class="modal" id="edit-modal">
  <div class="modal-content" id="modal-content"></div>
</div>

<script>
const TOKEN_KEY = "api_youxuan_admin_token_zh";
const API_BASE = location.hostname.includes("admin.") || location.hostname.includes("api.") || location.hostname === "api-youxuan-api.suiyue6562.workers.dev" ? location.origin : "https://api.apireader.top";

let currentTab = "models";
let cache = {};

const $(id) => document.getElementById(id);

async function api(path, opts = {}) {
  const token = localStorage.getItem(TOKEN_KEY);
  opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {}, { "Authorization": "Bearer " + token });
  if (opts.body && typeof opts.body !== "string") opts.body = JSON.stringify(opts.body);
  const r = await fetch(API_BASE + path, opts);
  if (!r.ok) {
    const err = await r.json().catch(() => ({ error: r.statusText }));
    return { error: (err.error || r.statusText) };
  }
  return await r.json();
}

async function doLogin() {
  const t = $("login-token").value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  const r = await api("/api/admin/stats");
  if (r.counts) { $("login-view").style.display = "none"; $("main-view").style.display = "block"; loadStats(); switchTab("models"); }
  else { alert("登录失败：" + (r.error || "token 无效")); localStorage.removeItem(TOKEN_KEY); }
}

function logout() { localStorage.removeItem(TOKEN_KEY); location.reload(); }

async function loadStats() {
  const r = await api("/api/admin/stats");
  if (r.error) { logout(); return; }
  const labels = { vendors: "厂商数", models: "模型数", providers: "渠道数", offerings: "价格组合数", events: "事件数", ads: "广告位数" };
  $("stats-grid").innerHTML = Object.entries(r.counts).map(([k, v]) =>
    '<div class="stat-card"><div class="stat-num">' + v + '</div><div class="stat-label">' + (labels[k] || k) + '</div></div>'
  ).join("") + '<div class="stat-card"><div class="stat-num">' + r.page_views_24h + '</div><div class="stat-label">24 小时浏览</div></div><div class="stat-card"><div class="stat-num">' + r.ad_clicks_24h + '</div><div class="stat-label">24 小时广告点击</div></div>';
  $("last-update").textContent = "更新于 " + new Date(r.ts).toLocaleString("zh-CN", { hour12: false });
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll("#tab-bar button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  const renderers = { models: renderModels, providers: renderProviders, vendors: renderVendors, events: renderEvents, ads: renderAds, watch: renderWatch, log: renderLog, ab: renderAB, export: renderExport };
  renderers[tab] ? renderers[tab]() : null;
}

function formatVal(v) {
  if (v === null || v === undefined) return '<span class="muted">—</span>';
  if (typeof v === "object") return '<span class="tag">' + JSON.stringify(v).slice(0, 50) + '</span>';
  return String(v).slice(0, 80);
}

function actionBtns(table, id) {
  return '<div class="btn-group"><button onclick="editRecord(\'' + table + '\', \'' + id + '\')">编辑</button><button class="danger" onclick="deleteRecord(\'' + table + '\', \'' + id + '\')">删除</button></div>';
}

async function renderTable(tab, table, columns, schema, labelMap) {
  cache[table] = await api("/api/admin/" + table);
  if (cache[table].error) { $("tab-content").innerHTML = '<p class="muted">加载失败</p>'; return; }
  const data = cache[table];
  const labels = columns.map(c => labelMap[c] || c);
  $("tab-content").innerHTML = `
    <div class="flex-between">
      <h3 style="margin:0;">${tab} <span class="muted">共 ${data.length} 条</span></h3>
      <button onclick="editRecord('${table}', null)">+ 新增</button>
    </div>
    <table>
      <thead><tr>${labels.map(l => '<th>' + l + '</th>').join("")}<th>操作</th></tr></thead>
      <tbody>${data.map(row =>
        '<tr>' + columns.map(c => '<td>' + formatVal(row[c]) + '</td>').join("") + '<td>' + actionBtns(table, row.id) + '</td></tr>'
      ).join("")}</tbody>
    </table>`;
  window['schema_' + table] = schema;
  window['labelMap_' + table] = labelMap;
}

const T_LABELS = { models: "模型管理", providers: "渠道管理", vendors: "厂商管理", events: "行情事件", ads: "广告位", watch: "关注列表" };

async function renderModels() {
  await renderTable(T_LABELS.models, "models",
    ["id", "name", "vendor_id", "category", "price_input_per_m", "price_output_per_m", "context_window", "data_status"],
    { id: "text", vendor_id: "vendor", name: "text", display_name: "text", family: "text",
      category: ["reasoning", "balanced", "agentic_coding", "multimodal"],
      tags: "json", context_window: "number", max_output_tokens: "number", release_date: "text",
      price_input_per_m: "number", price_output_per_m: "number", price_cache_read_per_m: "number",
      tool_use: "bool", vision: "bool", function_calling: "bool", streaming: "bool",
      batch_discount: "number", description: "textarea", notes: "textarea",
      license: "text", is_open_weight: "bool", data_status: ["A", "B", "C"] },
    { id: "ID", name: "名称", vendor_id: "厂商", category: "类别", price_input_per_m: "输入价/M", price_output_per_m: "输出价/M", context_window: "上下文", data_status: "完整度" }
  );
}

async function renderProviders() {
  await renderTable(T_LABELS.providers, "providers",
    ["id", "name_zh", "type", "region", "min_charge", "invoice_available", "data_status"],
    { id: "text", name_zh: "text", name_en: "text",
      type: ["official", "aggregator", "gateway", "self_host", "platform", "individual"],
      region: ["global", "cn"], website: "text", min_charge: "number", sla_uptime: "text",
      concurrent_rpm: "number", notes: "textarea", data_status: ["A", "B", "C"] },
    { id: "ID", name_zh: "中文名", type: "类型", region: "地区", min_charge: "最低充值", invoice_available: "开发票", data_status: "完整度" }
  );
}

async function renderVendors() {
  await renderTable(T_LABELS.vendors, "vendors",
    ["id", "name_zh", "region", "logo", "data_status"],
    { id: "text", name_zh: "text", name_en: "text",
      region: ["global", "cn"], logo: "text", website: "text", data_status: ["A", "B", "C"] },
    { id: "ID", name_zh: "中文名", region: "地区", logo: "Logo", data_status: "完整度" }
  );
}

async function renderEvents() {
  await renderTable(T_LABELS.events, "events",
    ["id", "date", "event_type", "severity", "target_name", "title"],
    { id: "text", date: "text",
      event_type: ["price_change", "new_model", "outage", "capability_update", "policy_change", "model_deprecate"],
      severity: ["high", "medium", "low", "positive", "neutral"],
      target_type: ["model", "provider"], target_id: "text", target_name: "text",
      title: "text", description: "textarea" },
    { id: "ID", date: "日期", event_type: "类型", severity: "严重度", target_name: "对象", title: "标题" }
  );
}

async function renderAds() {
  await renderTable(T_LABELS.ads, "ads",
    ["id", "slot", "type", "title", "active", "impressions", "clicks"],
    { id: "text",
      slot: ["home_top", "home_mid", "sidebar", "models_top", "footer", "providers_top"],
      type: ["banner", "text", "sponsored_card"],
      title: "text", content: "textarea", image_url: "text", link_url: "text", advertiser: "text",
      start_date: "text", end_date: "text", active: "bool", priority: "number", max_impressions: "number" },
    { id: "ID", slot: "位置", type: "类型", title: "标题", active: "启用", impressions: "展示", clicks: "点击" }
  );
}

async function renderWatch() {
  cache.watch = await api("/api/admin/watches");
  if (cache.watch.error || !cache.watch) {
    // 没 watches 端点，从 change_log 推断
    cache.watch = [];
  }
  $("tab-content").innerHTML = `
    <h3>关注列表 <span class="muted">用户添加到 watch 的模型/渠道</span></h3>
    <p class="muted">此功能需要前台用户登录后使用。后台暂不管理个人关注列表。</p>
  `;
}

async function renderLog() {
  const log = await api("/api/admin/log");
  if (log.error) { $("tab-content").innerHTML = '<p class="muted">加载失败</p>'; return; }
  const ACTION_LABEL = { create: "新增", update: "更新", delete: "删除" };
  $("tab-content").innerHTML = `
    <h3>操作日志 <span class="muted">最近 100 条</span></h3>
    <table>
      <thead><tr><th>时间</th><th>操作</th><th>表</th><th>记录 ID</th><th>用户</th></tr></thead>
      <tbody>${log.map(r => '<tr><td class="muted">' + new Date(r.ts).toLocaleString("zh-CN", { hour12: false }) + '</td><td><span class="tag">' + (ACTION_LABEL[r.action] || r.action) + '</span></td><td>' + r.table_name + '</td><td><code style="font-size:11px;">' + r.record_id + '</code></td><td>' + (r.username || "—") + '</td></tr>').join("")}</tbody>
    </table>
  `;
}


async function renderAB() {
  const exps = await api("/api/admin/ab_experiments");
  if (exps.error) { $("tab-content").innerHTML = '<p class="muted">加载失败</p>'; return; }
  const traffic = await api("/api/stats/traffic");
  const total24 = traffic && traffic.last_24h ? traffic.last_24h.reduce((s, x) => s + x.pv, 0) : 0;
  const total7 = traffic && traffic.last_7d ? traffic.last_7d.reduce((s, x) => s + x.pv, 0) : 0;

  const html = `
    <h3>A/B 实验管理 <span class="muted">${exps.length} 个实验</span></h3>

    <div class="card" style="margin-bottom:16px;">
      <h4>流量总览</h4>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num">${total24}</div><div class="stat-label">24 小时 PV</div></div>
        <div class="stat-card"><div class="stat-num">${total7}</div><div class="stat-label">7 天 PV</div></div>
        <div class="stat-card"><div class="stat-num">${exps.length}</div><div class="stat-label">活跃实验</div></div>
      </div>
    </div>

    <table>
      <thead><tr><th>ID</th><th>名称</th><th>状态</th><th>流量分配</th><th>目标</th><th>操作</th></tr></thead>
      <tbody>
        ${exps.map(e => {
          const split = JSON.parse(e.traffic_split || '{}');
          const splitText = Object.entries(split).map(([k,v]) => k + ':' + v + '%').join(', ');
          const statusTag = e.status === "running" ? '<span class="tag tag-success">运行中</span>' : (e.status === "paused" ? '<span class="tag tag-warn">暂停</span>' : '<span class="tag">' + e.status + '</span>');
          return '<tr><td><code>' + e.id + '</code></td><td>' + e.name + '</td><td>' + statusTag + '</td><td>' + splitText + '</td><td>' + (e.goal_event || '-') + '</td><td><div class="btn-group"><button onclick="viewABResults(\'' + e.id + '\')">查看结果</button><button onclick="editAB(\'' + e.id + '\')">编辑</button><button class="danger" onclick="deleteAB(\'' + e.id + '\')">删除</button></div></td></tr>';
        }).join("")}
        ${!exps.length ? '<tr><td colspan="6" style="text-align:center;color:#8896b8;padding:32px;">还没有创建实验<br><br><button onclick="createAB()" style="margin-top:12px;">+ 创建第一个实验</button></td></tr>' : ''}
      </tbody>
    </table>
    ${exps.length ? '<button onclick="createAB()" style="margin-top:16px;">+ 新建实验</button>' : ''}
  `;
  $("tab-content").innerHTML = html;
}

async function viewABResults(expId) {
  const r = await api("/api/ab/results/" + expId);
  if (r.error) { alert("加载失败：" + r.error); return; }
  const buckets = {};
  (r.buckets || []).forEach(b => buckets[b.variant] = b.users);
  const events = {};
  (r.events || []).forEach(e => {
    if (!events[e.variant]) events[e.variant] = {};
    events[e.variant][e.event_type] = e.c;
  });
  let msg = "实验 " + expId + " 结果\n\n";
  msg += "流量分布：\n";
  Object.entries(buckets).forEach(([v, u]) => msg += "  " + v + ": " + u + " 用户\n");
  msg += "\n事件转化：\n";
  Object.entries(events).forEach(([v, evs]) => {
    msg += "  " + v + ":\n";
    Object.entries(evs).forEach(([e, c]) => msg += "    " + e + ": " + c + " 次\n");
  });
  alert(msg);
}

function createAB() {
  const id = prompt("实验 ID（英文+下划线，如 exp_homepage_v1）:");
  if (!id) return;
  const name = prompt("实验名称:");
  if (!name) return;
  const split = prompt("流量分配（JSON，如 {\"control\":50,\"variant_a\":50}）:");
  if (!split) return;
  const goal = prompt("目标事件（如 click_button）:") || "click_button";
  api("/api/admin/ab_experiments", {
    method: "POST",
    body: { id, name, status: "running", traffic_split: split, goal_event: goal }
  }).then(r => {
    if (r.error) alert("创建失败：" + r.error);
    else renderAB();
  });
}

function editAB(expId) {
  alert("编辑功能开发中。可用 SQL 编辑：" + expId);
}

async function deleteAB(expId) {
  if (!confirm("确认删除实验 " + expId + "？")) return;
  const r = await api("/api/admin/ab_experiments/" + expId, { method: "DELETE" });
  if (r.error) alert("删除失败：" + r.error);
  else renderAB();
}

function renderExport() {
  $("tab-content").innerHTML = `
    <h3>数据导出</h3>
    <p class="muted">下载完整 JSON（包含所有公开数据，不含内部审计日志）。</p>
    <button onclick="doExport()">下载 seed_data.json</button>
    <pre id="export-preview" style="margin-top:16px;"></pre>
  `;
  api("/api/admin/export").then(data => {
    if (data.error) { $("export-preview").textContent = "导出失败：" + data.error; return; }
    $("export-preview").textContent = JSON.stringify({
      vendors: data.vendors.length,
      models: data.models.length,
      providers: data.providers.length,
      offerings: data.offerings.length,
      events: data.events.length,
      ads: data.ads.length,
      生成时间: data.ts
    }, null, 2);
  });
}

function doExport() {
  api("/api/admin/export").then(data => {
    if (data.error) { alert("导出失败：" + data.error); return; }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "seed_data_" + new Date().toISOString().slice(0, 10) + ".json"; a.click();
  });
}

async function editRecord(table, id) {
  let record = {};
  if (id) {
    cache[table] = cache[table] || await api("/api/admin/" + table);
    record = cache[table].find(r => r.id === id) || {};
  }
  const schema = window['schema_' + table];
  cache.vendors = cache.vendors || await api("/api/admin/vendors");

  const fields = [];
  for (const [key, def] of Object.entries(schema)) {
    const v = record[key] !== undefined ? record[key] : (def === "bool" ? 0 : "");
    let input;
    if (def === "vendor") {
      input = '<select name="' + key + '"><option value="">— 选择厂商 —</option>' + cache.vendors.map(o => '<option value="' + o.id + '"' + (v === o.id ? ' selected' : '') + '>' + o.name_zh + '</option>').join('') + '</select>';
    } else if (Array.isArray(def)) {
      input = '<select name="' + key + '">' + def.map(o => '<option value="' + o + '"' + (v === o ? ' selected' : '') + '>' + o + '</option>').join('') + '</select>';
    } else if (def === "bool") {
      input = '<div class="checkbox-row"><input type="checkbox" name="' + key + '"' + (v ? ' checked' : '') + '> 启用 ' + key + '</div>';
    } else if (def === "textarea" || def === "json") {
      const tv = typeof v === "object" ? JSON.stringify(v, null, 2) : v;
      input = '<textarea name="' + key + '" rows="3" placeholder="' + (def === "json" ? "JSON 格式" : "") + '">' + (tv || '') + '</textarea>';
    } else {
      const step = def === "number" ? ' step="any"' : '';
      input = '<input type="' + (def || "text") + '" name="' + key + '" value="' + (v !== null && v !== undefined ? v : '') + '"' + (key === "id" ? ' readonly' : '') + step + '>';
    }
    const full = (def === "textarea" || def === "json" || key === "description" || key === "notes" || key === "content") ? ' full' : '';
    fields.push('<div class="form-row' + full + '"><label>' + key + '</label>' + input + '</div>');
  }

  $("modal-content").innerHTML = `
    <h3>${id ? '编辑' : '新增'} ${table} 记录</h3>
    <form onsubmit="submitRecord(event, '${table}', '${id || ""}')">
      <div class="form-grid">${fields.join("")}</div>
      <div class="flex" style="margin-top:20px;justify-content:flex-end;">
        <button type="button" class="secondary" onclick="closeModal()">取消</button>
        <button type="submit">保存</button>
      </div>
    </form>`;
  $("edit-modal").classList.add("show");
}

function closeModal() { $("edit-modal").classList.remove("show"); }

async function submitRecord(e, table, id) {
  e.preventDefault();
  const form = e.target;
  const data = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === "checkbox") data[el.name] = el.checked ? 1 : 0;
    else if (el.type === "number") data[el.name] = parseFloat(el.value) || 0;
    else if (el.tagName === "TEXTAREA") {
      try { data[el.name] = JSON.parse(el.value); } catch { data[el.name] = el.value; }
    } else data[el.name] = el.value;
  }
  const method = id ? "PATCH" : "POST";
  const url = id ? "/api/admin/" + table + "/" + id : "/api/admin/" + table;
  const r = await api(url, { method, body: data });
  if (r.error) { alert("保存失败：" + r.error); return; }
  cache[table] = null;
  closeModal();
  switchTab(currentTab);
  if (currentTab !== "log" && currentTab !== "export" && currentTab !== "watch") loadStats();
}

async function deleteRecord(table, id) {
  if (!confirm("确认删除 " + table + " / " + id + "？此操作不可恢复。")) return;
  const r = await api("/api/admin/" + table + "/" + id, { method: "DELETE" });
  if (r.error) { alert("删除失败：" + r.error); return; }
  cache[table] = null;
  switchTab(currentTab);
  loadStats();
}
