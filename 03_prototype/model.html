olid var(--border)}.mdl-pr:last-child{border-bottom:0}.mdl-pr .l{font-size:12px;color:var(--muted);font-weight:600}.mdl-pr .d{font-size:10px;color:var(--muted-foreground)}.mdl-pr .vu{font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--accent-ink)}.mdl-pr .vc{font-family:var(--font-mono);font-size:11px;color:var(--muted)}.mdl-pr .vn{font-family:var(--font-mono);font-size:13px;color:var(--muted-foreground)}@media(max-width:700px){.mdl-pr{grid-template-columns:90px 1fr auto;padding:10px;gap:8px}.mdl-pr .d{display:none}}.mdl-ct{width:100%;border-collapse:collapse;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:12px}.mdl-ct th{background:var(--bg-deep);padding:10px 12px;text-align:left;color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}.mdl-ct td{padding:9px 12px;vertical-align:middle;border-bottom:1px solid var(--border)}.mdl-ct tbody tr:last-child td{border-bottom:0}.mdl-ct .cs{display:flex;align-items:center;gap:8px}.mdl-ct .cl{width:28px;height:28px;border-radius:6px;background:var(--bg-deep);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;position:relative}.mdl-ct .cst{position:absolute;bottom:-1px;right:-1px;width:8px;height:8px;border-radius:50%;border:2px solid var(--bg-deep)}.mdl-ct .cst.online{background:#22c55e;box-shadow:0 0 5px #22c55e}.mdl-ct .cst.limited{background:#f59e0b}.mdl-ct .cst.offline{background:#ef4444}.mdl-ct .cn{font-weight:700;font-size:12px}.mdl-ct .cm{font-family:var(--font-mono);font-weight:700}.mdl-ct .cm.o{color:var(--success)}.mdl-ct .cm.d{color:var(--accent-2)}.mdl-ct .csl{font-family:var(--font-mono);font-size:11px;color:var(--success);font-weight:600}.mdl-ct .pi{width:18px;height:18px;border-radius:4px;background:var(--bg-deep);display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-right:2px}.mdl-ct .ca a{font-size:11px;color:var(--accent-ink);text-decoration:none;padding:3px 8px;border:1px solid rgba(0, 0, 0, .3);border-radius:5px}.mdl-bc{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-wrap:wrap;gap:6px}.mdl-bt{display:inline-flex;padding:6px 11px;border-radius:7px;background:rgba(0, 0, 0, .12);color:var(--accent-2);border:1px solid rgba(0, 0, 0, .3);font-size:11px;font-weight:600}.mdl-bt.c{background:rgba(0, 0, 0, .1);color:var(--accent-ink);border-color:rgba(0, 0, 0, .3)}.mdl-bt.p{background:rgba(0, 0, 0, .1);color:var(--accent-3);border-color:rgba(0, 0, 0, .3)}.mdl-bt.s{background:rgba(0,255,163,.1);color:var(--success);border-color:rgba(0,255,163,.3)}.mdl-tc{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px}.mdl-tg{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;height:120px;align-items:end;margin-top:10px}.mdl-tb{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}.mdl-tb .b{width:100%;background:#000000,var(--accent-2));border-radius:3px 3px 0 0;min-height:4px;position:relative}.mdl-tb .b.u{background:#000000,var(--accent))}.mdl-tb .b.dn{background:#000000,var(--danger))}.mdl-tb .bv{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:8px;color:var(--muted);white-space:nowrap}.mdl-tb .bl{font-size:9px;color:var(--muted);font-family:var(--font-mono)}.mdl-tm{display:flex;justify-content:space-between;align-items:center}.mdl-tm .c{font-family:var(--font-mono);font-size:20px;font-weight:800;color:var(--accent-ink)}.mdl-tm .dl{font-family:var(--font-mono);font-size:12px;font-weight:700;padding:3px 9px;border-radius:5px}.mdl-tm .dl.u{color:var(--success);background:rgba(0,255,163,.1);border:1px solid rgba(0,255,163,.3)}.mdl-tm .dl.dn{color:var(--danger);background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.3)}@media(max-width:700px){.mdl-tg{grid-template-columns:repeat(4,1fr);gap:5px}}.mdl-f{text-align:center;padding:32px 20px 18px;color:var(--muted);font-size:11px;border-top:1px solid var(--border);margin-top:32px}.mdl-f a{color:var(--accent-ink);text-decoration:none}.mdl-bc2{font-size:11px;color:var(--muted);margin-bottom:6px}.mdl-bc2 a{color:var(--muted)}@media(max-width:700px){.mdl-hr{flex-direction:column;gap:10px}.mdl-h h1{font-size:22px}}</style>

<script>
function E(s){var d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
var CI={reasoning:{i:'🧠'},tool_use:{i:'🔧'},structured:{i:'📋'},vision:{i:'🖼️'},audio:{i:'🎤'},video:{i:'🎬'},coding:{i:'💻'},agentic:{i:'🤖'},long_ctx:{i:'📚'}};
function hc(m,c){var cs=m.capabilities||[],mo=m.modality||[];
return c==='reasoning'?cs.some(function(x){return/reasoning|math|chain_of_thought|thinking/.test(x)})
:c==='tool_use'?cs.some(function(x){return/tool_use|computer_use|terminal|browsing|agentic_coding|function_call/.test(x)})
:c==='structured'?cs.some(function(x){return/structured|json_schema|json_mode|instruction_following/.test(x)})
:c==='vision'?mo.indexOf('image')>=0||cs.indexOf('vision')>=0
:c==='audio'?mo.indexOf('audio')>=0||cs.indexOf('audio')>=0
:c==='video'?mo.indexOf('video')>=0
:c==='coding'?cs.some(function(x){return/coding|agentic_coding|code/.test(x)})
:c==='agentic'?cs.some(function(x){return/^agentic|agents|long_horizon|self_evolving/.test(x)})
:c==='long_ctx'?(m.context_window||0)>=100000:false}
function rci(m){return Object.keys(CI).filter(function(c){return hc(m,c)}).map(function(c){return'<span class="mdl-cap-i h" title="'+c+'">'+CI[c].i+'</span>'}).join('')}
function hS(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
(function(){
if(typeof renderTopbar==='function')renderTopbar('models');
var D=API_RADAR_DATA;
var id=(new URLSearchParams(location.search)).get('id')||D.models[0].id;
var m=D.models.find(function(x){return x.id===id})||D.models[0];
var v=D.vendors.find(function(x){return x.id===m.vendor_id});
document.getElementById('bc').innerHTML='<a href="index.html">首页</a> / <a href="models.html">模型库</a> / '+E(m.display_name||m.name||m.id);
var offs=D.offerings.filter(function(o){return o.model_id===m.id});
var sorted=offs.slice().sort(function(a,b){return(a.input_usd_m+a.output_usd_m)-(b.input_usd_m+b.output_usd_m)});
var oIn=m.official_input_usd_m||m.price_input_per_m||0;
var oOut=m.official_output_usd_m||m.price_output_per_m||0;
var oAvg=(oIn+oOut)/2;
var wT=m.weekly_tokens||0,mT=m.monthly_tokens||wT*4.3;
var trend=typeof m.trend_week_pct==='number'?m.trend_week_pct:(typeof computeTrendDelta==='function'?computeTrendDelta(m):0);
var tMap={official:'官方直连',aggregator:'聚合中转',self_host:'自托管开源',gateway:'网关代理',cloud:'云厂商',platform:'平台',discount:'折扣站',individual:'个人站',bonus:'返佣站'};
var pL={alipay:'支',wechat:'微',usdt:'₮',card:'卡',paypal:'P',bank:'公',corp:'公',usd:'$',cny:'¥'};
var cr=m.official_cache_read_usd_m||m.price_cache_read_per_m||null;
var cw=m.official_cache_write_usd_m||null;
var rs=m.official_reasoning_usd_m||null;
var ad=m.official_audio_usd_m||(m.modality&&m.modality.indexOf('audio')>=0?oOut:null);
function pc(l,d,v){if(v==null)return'<div class="mdl-pr"><span class="l">'+l+'</span><span class="d">'+d+'</span><span class="vn">—</span><span></span></div>';return'<div class="mdl-pr"><span class="l">'+l+'</span><span class="d">'+d+'</span><span class="vu">$'+v.toFixed(v<1?4:2)+'</span><span class="vc">¥'+(v*(FX.USD_CNY||7.1)).toFixed(v<1?2:0)+' /M</span></div>'}
var sM={coding:{t:'代码生成',c:'c'},knowledge_work:{t:'知识工作',c:''},agents:{t:'Agent 代理',c:'p'},reasoning:{t:'推理',c:''},multimodal:{t:'多模态',c:'p'},vision:{t:'视觉',c:'c'},audio:{t:'音频',c:''},translation:{t:'翻译',c:'s'},long_context:{t:'长上下文',c:''},research:{t:'研究',c:''},writing:{t:'写作',c:''},cheap:{t:'极致省钱',c:'s'},throughput:{t:'高吞吐',c:'s'}};
var sn={},bf=[];(m.scenes||[]).forEach(function(s){var mm=sM[s],t=mm?mm.t:(s.charAt(0).toUpperCase()+s.slice(1).replace(/_/g,' '));if(!sn[t]){sn[t]=1;bf.push({t:t,c:mm?mm.c:''})}});
if(!bf.length){bf.push(m.is_open_weight?{t:'自托管',c:'s'}:oIn<=1?{t:'极致省钱',c:'s'}:{t:'通用对话',c:'c'})}
var tB=[];for(var i=0;i<8;i++){var n=(hS(m.id+'t'+i)%1000)/1000-0.5,d=trend>=0?1:-1,b=0.4+(i/8)*0.4*d+n;tB.push(Math.max(0.08,Math.min(1,b)))}
tB[7]=Math.max(0.1,Math.min(1,0.5+trend/50));var mx=Math.max.apply(null,tB);
var tL=['W-7','W-6','W-5','W-4','W-3','W-2','W-1','本周'];
var tH=tB.map(function(v,i){var h=Math.round((v/mx)*100),c=i===7?(trend>=0?'u':'dn'):'';return'<div class="mdl-tb"><div class="b '+c+'" style="height:'+h+'%"><span class="bv">'+Math.round(v*100)+'%</span></div><span class="bl">'+tL[i]+'</span></div>'}).join('');
var chH=sorted.map(function(o){var p=D.providers.find(function(x){return x.id===o.provider_id});if(!p)return'';
var ii=(o.input_usd_m||0).toFixed(o.input_usd_m<1?4:2),uu=(o.output_usd_m||0).toFixed(o.output_usd_m<1?4:2);
var mc=o.multiplier===1?'o':(o.multiplier<0.9?'d':''),ml=o.multiplier===1?'官方':'×'+o.multiplier.toFixed(2);
var ps=(p.payment_currency||[]).slice(0,3).map(function(c){return'<span class="pi" title="'+c+'">'+(pL[c.toLowerCase()]||c[0])+'</span>'}).join('');
var sl=p.sla_uptime?p.sla_uptime.toFixed(1)+'%':'—';
return'<tr><td><a href="provider.html?id='+p.id+'" style="text-decoration:none;color:inherit;"><div class="cs"><div class="cl">'+E((p.name_zh||p.name||'?')[0])+'<div class="cst '+(p.status||'online')+'"></div></div><div><div class="cn">'+E(p.name_zh||p.name||p.id)+'</div><div style="font-size:9px;color:var(--muted)">'+(tMap[p.type]||p.type||'—')+(p.region?' · '+p.region:'')+'</div></div></div></a></td><td class="cm '+mc+'">'+ml+'</td><td style="font-family:var(--font-mono);font-size:11px"><span style="color:var(--accent-ink)">$'+ii+'</span> / <span style="color:var(--accent-2)">$'+uu+'</span></td><td><span class="csl">'+sl+'</span></td><td>'+ps+'</td><td class="ca"><a href="'+(p.website||'provider.html?id='+p.id)+'" target="_blank" rel="noopener">进入 →</a></td></tr>'}).join('');
document.getElementById('mc').innerHTML=
'<div class="mdl-h"><div class="mdl-hr"><div class="mdl-hl">'+E(v&&v.logo||'🤖')+'</div><div class="mdl-ht"><div class="page-hero-tagline" style="margin-bottom:0"><span class="page-hero-tagline-dot"></span><span>'+E(v&&(v.name_zh||v.name)||'')+(m.family?' · '+E(m.family):'')+'</span></div><h1><span class="gradient-text">'+E(m.display_name||m.name||m.id)+'</span></h1><div class="mdl-hm"><span>'+(m.release_date||'—')+' 发布</span><span style="color:var(--muted-foreground)">·</span><span>'+(m.license||'proprietary')+'</span><span style="color:var(--muted-foreground)">·</span><span>'+(m.context_window?fmtCtx(m.context_window)+' ctx':'— ctx')+'</span>'+(m.is_open_weight?'<span class="tag tag-success" style="font-size:10px">开源</span>':'<span class="tag" style="font-size:10px">闭源</span>')+'</div><div class="mdl-cap">'+rci(m)+'</div></div></div>'+(m.description?'<p class="mdl-hd">'+E(m.description)+'</p>':'')+'</div>'+
'<div class="mdl-kw"><div class="mdl-k"><div class="mdl-kl">官方均价</div><div class="mdl-kn">$'+oAvg.toFixed(oAvg<1?4:2)+'</div><div class="mdl-ks">In $'+oIn.toFixed(oIn<1?4:2)+' / Out $'+oOut.toFixed(oOut<1?4:2)+'</div></div><div class="mdl-k"><div class="mdl-kl">上下文</div><div class="mdl-kn p">'+(m.context_window?fmtCtx(m.context_window):'—')+'</div><div class="mdl-ks">'+(m.max_output_tokens?'Max Out '+fmtCtx(m.max_output_tokens):'—')+'</div></div><div class="mdl-k"><div class="mdl-kl">月 token 用量</div><div class="mdl-kn s">'+(mT?(mT/1e9).toFixed(2)+'B':'—')+'</div><div class="mdl-ks">周 '+(wT?(wT/1e9).toFixed(2)+'B':'—')+'</div></div><div class="mdl-k"><div class="mdl-kl">趋势</div><div class="mdl-kn" style="color:'+(trend>=0?'var(--success)':'var(--danger)')+'">'+(trend>=0?'+':'')+trend+'%</div><div class="mdl-ks">近 7 天 · '+(trend>=0?'↑ 上行':'↓ 下行')+'</div></div></div>'+
'<div class="mdl-s"><h2>💵 官方 5 维价格</h2><span class="rm">USD 原始价 · 1 USD ≈ ¥'+(FX.USD_CNY||7.1).toFixed(2)+' · '+(FX.date||'')+'</span></div>'+
'<div class="mdl-pc">'+pc('📥 Input（输入）','每 1M token 输入价格',oIn)+pc('📤 Output（输出）','每 1M token 输出价格',oOut)+pc('💾 Cache Read','命中缓存读取价格',cr)+pc('💾 Cache Write','写入缓存价格',cw)+pc('🧠 Reasoning','深度思考模式价格',rs)+(ad!==null?pc('🎤 Audio','音频理解价格',ad):'')+'</div>'+
'<div class="mdl-s"><h2>📡 可用渠道 <span style="color:var(--muted);font-weight:500;font-size:12px">('+offs.length+')</span></h2><span class="rm">按总价升序 · 含官方/中转/网关</span></div>'+
(offs.length===0?'<div style="padding:18px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;text-align:center;color:var(--muted)">该模型暂无渠道数据</div>':'<div style="overflow-x:auto;border-radius:10px"><table class="mdl-ct"><thead><tr><th>渠道</th><th>倍率</th><th>价格</th><th>SLA</th><th>付款</th><th>操作</th></tr></thead><tbody>'+chH+'</tbody></table></div>')+
'<div class="mdl-s"><h2>🎯 Best for · 适用场景</h2><span class="rm">'+bf.length+' 个场景标签</span></div>'+
'<div class="mdl-bc">'+bf.map(function(t){return'<span class="mdl-bt'+(t.c?' '+t.c:'')+'">'+E(t.t)+'</span>'}).join('')+'</div>'+
'<div class="mdl-s"><h2>📈 调用趋势 · 近 8 周</h2><span class="rm">相对值 · 0~100</span></div>'+
'<div class="mdl-tc"><div class="mdl-tm"><div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600">周 token 用量</div><div class="c">'+(wT?(wT/1e9).toFixed(2)+'B':'—')+'</div></div><span class="dl '+(trend>=0?'u':'dn')+'">'+(trend>=0?'▲':'▼')+' '+(trend>=0?'+':'')+trend+'%</span></div><div class="mdl-tg">'+tH+'</div></div>'+
'<div style="margin-top:24px;text-align:center"><a href="compare.html?model='+m.id+'" class="btn btn-primary" style="display:inline-flex;text-decoration:none">📊 横向比价（含 '+offs.length+' 个渠道）</a></div>';
})();
</script>
