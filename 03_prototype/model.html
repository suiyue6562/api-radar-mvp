<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型详情 - API优选咨询</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.main h1 { font-size: 28px; margin-bottom: 4px; }
.page-meta { color: var(--muted); margin-bottom: 24px; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
.detail-card { padding: 22px; }
.detail-card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 12px; }
.info-table { width: 100%; }
.info-table td { padding: 6px 0; border: 0; font-size: 13px; }
.info-table td:first-child { color: var(--muted); width: 110px; }
.price-display { display: flex; flex-direction: column; gap: 8px; }
.price-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.price-row:last-child { border: 0; }
.price-label { color: var(--muted); }
.price-value { font-family: var(--font-mono); font-weight: 700; color: var(--accent); }
.price-value-big { font-size: 18px; }
.provider-mini-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); text-decoration: none; color: inherit; }
.provider-mini-item:last-child { border: 0; }
.provider-mini-item:hover { background: rgba(0,217,255,0.04); }
.channels-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.channel-card { background: var(--bg-deep); border: 1px solid var(--border); border-radius: 6px; padding: 10px; text-decoration: none; color: inherit; transition: all 0.15s; display: block; }
.channel-card:hover { border-color: var(--accent); }
.channel-card .ch-name { font-weight: 600; font-size: 12px; }
.channel-card .ch-price { font-family: var(--font-mono); color: var(--accent); font-size: 13px; font-weight: 700; }
.channel-card .ch-meta { font-size: 10px; color: var(--muted); }
.breadcrumb { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.breadcrumb a { color: var(--muted); }
.breadcrumb a:hover { color: var(--accent); }
</style>
</head>
<body>
<div id="topbar"></div>
<main class="main">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="model-content"></div>

  <!-- 广告位 -->
  <div style="max-width:1100px;margin:24px auto;padding:0 24px;"><div class="ad-slot" data-slot="models_top"></div></div>
</main>
<script src="data.js"></script>
<script src="ads.js"></script>
<script src="app.js"></script>
<script>
function escapeHtml(s) { return String(s || "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"})[c]); }
(function() {
  if (typeof renderTopbar === 'function') renderTopbar('models');
  const D = API_RADAR_DATA;
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || D.models[0].id;
  const model = D.models.find(m => m.id === id) || D.models[0];
  const vendor = D.vendors.find(v => v.id === model.vendor_id);

  document.getElementById('breadcrumb').innerHTML = '<a href="index.html">首页</a> / <a href="models.html">模型</a> / ' + model.display_name;

  const offerings = D.offerings.filter(o => o.model_id === model.id);
  const sorted = [...offerings].sort((a, b) => (a.input_usd_m + a.output_usd_m) - (b.input_usd_m + b.output_usd_m));

  document.getElementById('model-content').innerHTML = `
  <div class="page-hero fade-in" style="text-align:left;padding:32px 0 16px;">
    <div class="page-hero-tagline" style="margin-bottom:8px;"><span class="page-hero-tagline-dot"></span><span>${escapeHtml(vendor?.name || '')} · ${model.family || ''}</span></div>
    <h1 style="font-size:36px;text-align:left;"><span class="gradient-text">${escapeHtml(model.display_name || model.name || model.id)}</span></h1>
    <p class="subtitle" style="text-align:left;margin:8px 0 0;">${model.release_date || ''} 发布 · ${model.license || ''} · ${model.context_window ? fmtCtx(model.context_window) + ' context' : ''}</p>
  </div>
  <p class="muted" style="margin:0 0 32px;line-height:1.7;">${escapeHtml(model.description || model.notes || '')}</p>

    <div class="detail-grid">
      <!-- 左：能力 -->
      <div class="card detail-card">
        <h3>📊 能力参数</h3>
        <table class="info-table">
          <tr><td>上下文窗口</td><td><strong>${fmtCtx(model.context_window)}</strong> tokens</td></tr>
          <tr><td>最大输出</td><td>${model.max_output_tokens ? fmtCtx(model.max_output_tokens) + ' tokens' : '未公布'}</td></tr>
          <tr><td>模态</td><td>${(model.modality || []).join(' / ')}</td></tr>
          <tr><td>开源</td><td>${model.is_open_weight ? '<span class="tag tag-success">是</span>' : '<span class="tag">否</span>'}</td></tr>
        </table>
        <div style="margin-top:14px;">
          <h3 style="margin-bottom:6px;">核心能力</h3>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${(model.capabilities || []).map(c => '<span class="tag tag-accent" style="font-size:11px;">' + c + '</span>').join('')}
          </div>
        </div>
        <div style="margin-top:14px;">
          <h3 style="margin-bottom:6px;">典型场景</h3>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${(model.scenes || []).map(s => '<span class="tag tag-purple" style="font-size:11px;">' + s + '</span>').join('')}
          </div>
        </div>
      </div>

      <!-- 中：官方价格 -->
      <div class="card detail-card">
        <h3>💵 官方价格</h3>
        <div class="price-display">
          <div class="price-row">
            <span class="price-label">输入</span>
            <span class="price-value price-value-big">${fmtUSD(model.official_input_usd_m)} <span class="muted text-xs" style="color:var(--muted);">/ M tokens</span></span>
          </div>
          <div class="price-row">
            <span class="price-label">输出</span>
            <span class="price-value price-value-big">${fmtUSD(model.official_output_usd_m)} <span class="muted text-xs" style="color:var(--muted);">/ M tokens</span></span>
          </div>
          ${model.official_cache_read_usd_m ? `
          <div class="price-row">
            <span class="price-label">缓存读取</span>
            <span class="price-value">${fmtUSD(model.official_cache_read_usd_m)} <span class="muted text-xs" style="color:var(--muted);">/ M tokens</span></span>
          </div>` : ''}
        </div>
        <div class="muted text-xs" style="margin-top:12px;line-height:1.6;">
          USD 原始价 · ${model.license}<br>
          汇率 ${API_RADAR_DATA.fx_rate.date} · 1 USD = ${API_RADAR.FX} CNY
        </div>
        <a href="compare.html?model=${model.id}" class="btn btn-primary" style="display:block;text-align:center;margin-top:16px;">📊 横向比价（含 ${offerings.length} 渠道）</a>
      </div>

      <!-- 右：使用场景与风险 -->
      <div class="card detail-card">
        <h3>⚡ 适用与注意</h3>
        <div style="display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--fg);">
          ${model.is_open_weight ? '<div>✅ 开源可自托管</div>' : '<div>🔒 闭源，依赖服务商</div>'}
          ${(model.context_window >= 1000000) ? '<div>📏 1M 长上下文</div>' : ''}
          ${(model.official_cache_read_usd_m && model.official_cache_read_usd_m > 0) ? '<div>💾 支持 prompt cache</div>' : ''}
          ${(model.modality || []).includes('image') ? '<div>🖼️ 支持图像理解</div>' : ''}
          ${(model.modality || []).includes('audio') ? '<div>🔊 支持音频</div>' : ''}
        </div>
      </div>
    </div>

    <!-- 渠道列表 -->
    <h2 style="margin:32px 0 16px;">📡 可用渠道（${offerings.length}）</h2>
    <div class="channels-grid">
      ${sorted.slice(0, 18).map(o => {
        const p = D.providers.find(x => x.id === o.provider_id);
        if (!p) return '';
        const cost = calcCost(model, o, 100, 20, 0);
        return `<a href="provider.html?id=${p.id}" class="channel-card">
          <div class="ch-name">${escapeHtml(p.name)} ${o.multiplier === 1.0 ? '<span style="color:var(--accent);font-size:9px;">官方</span>' : '<span style="color:var(--muted);font-size:9px;">×' + o.multiplier + '</span>'}</div>
          <div class="ch-price">${fmtCNY(cost.total)}</div>
          <div class="ch-meta">月 1.2亿tok · ${p.type === 'official' ? '官方' : p.type === 'aggregator' ? '中转' : p.type === 'gateway' ? '网关' : p.type === 'self_host' ? '自托管' : '云厂商'}</div>
        </a>`;
      }).join('')}
    </div>
    ${offerings.length > 18 ? '<div class="muted text-center" style="margin-top:12px;">还有 ' + (offerings.length - 18) + ' 个渠道在 <a href="compare.html?model=' + model.id + '">比价页</a> 查看</div>' : ''}
  `;
})();
</script>
</body>
</html>
