<script>function E(s){var d=document.createElement("div");d.textContent=s||"";return d.innerHTML} const CI={reasoning:{i:'🧠',l:'Reasoning'},tool_use:{i:'🔧',l:'Tool Call'},structured:{i:'📋',l:'Structured'},vision:{i:'🖼️',l:'Vision'},audio:{i:'🎤',l:'Audio'},video:{i:'🎬',l:'Video'},coding:{i:'💻',l:'Coding'},agentic:{i:'🤖',l:'Agentic'},long_ctx:{i:'📚',l:'Long Ctx'}}; function hc(m,c){const cs=m.capabilities||[],mo=m.modality||[]; return c==='reasoning'?cs.some(x=>/reasoning|math|chain_of_thought|thinking/.test(x)) :c==='tool_use'?cs.some(x=>/tool_use|computer_use|terminal|browsing|agentic_coding|function_call/.test(x)) :c==='structured'?cs.some(x=>/structured|json_schema|json_mode|instruction_following/.test(x)) :c==='vision'?mo.includes('image')||cs.includes('vision') :c==='audio'?mo.includes('audio')||cs.includes('audio') :c==='video'?mo.includes('video')||cs.includes('video') :c==='coding'?cs.some(x=>/coding|agentic_coding|code/.test(x)) :c==='agentic'?cs.some(x=>/^agentic|agents|long_horizon|self_evolving/.test(x)) :c==='long_ctx'?(m.context_window||0)>=100000:false} function rci(m){return Object.keys(CI).filter(c=>hc(m,c)).map(c=>'<span class="cap-icon has" title="'+CI[c].l+'">'+CI[c].i+'</span>').join('')} (function(){ if(typeof renderTopbar==='function')renderTopbar('models'); const D=API_RADAR_DATA; const id=new URLSearchParams(location.search).get('id')||D.models[0].id; const model=D.models.find(m=>m.id===id)||D.models[0]; const vendor=D.vendors.find(v=>v.id===model.vendor_id); document.getElementById('breadcrumb').innerHTML='<a href="index.html">首页</a> / <a href="models.html">模型库</a> / '+E(model.display_name||model.name||model.id); const offerings=D.offerings.filter(o=>o.model_id===model.id); const sorted=[...offerings].sort((a,b)=>(a.input_usd_m+a.output_usd_m)-(b.input_usd_m+b.output_usd_m)); const oIn=model.official_input_usd_m||model.price_input_per_m||0; const oOut=model.official_output_usd_m||model.price_output_per_m||0; const oAvg=(oIn+oOut)/2; const wT "><div class="mdl-hero-logo">${E(vendor?.logo||'🤖')}</div><div class="mdl-hero-text"><div class="page-hero-tagline" style="margin-bottom:0;"><span class="page-hero-tagline-dot"></span><span>${E(vendor?.name_zh||vendor?.name||'')}${model.family?' · '+E(model.family):''}</span></div><h1><span class="gradient-text">${E(model.display_name||model.name||model.id)}</span></h1><div class="meta-line"><span>${model.release_date||'—'} 发布</span><span style="color:var(--muted-foreground);margin:0 2px;">·</span><span>${model.license||'proprietary'}</span><span style="color:var(--muted-foreground);margin:0 2px;">·</span><span>${model.context_window?fmtCtx(model.context_window)+' ctx':'— ctx'}</span>${model.is_open_weight?'<span class="tag tag-success" style="font-size:10px;">开源</span>':'<span class="tag" style="font-size:10px;">闭源</span>'}</div><div class="cap-icons">${rci(model)}</div></div></div>${model.description?'<p class="mdl-hero-desc">'+E(model.description)+'</p>':''}</div><div class="mdl-kpi-wall"><div class="mdl-kpi"><div class="mdl-kpi-label">官方均价</div><div class="mdl-kpi-num">$${oAvg.toFixed(oAvg<1?4:2)}</div><div class="mdl-kpi-sub">In $${oIn.toFixed(oIn<1?4:2)} / Out $${oOut.toFixed(oOut<1?4:2)}</div></div><div class="mdl-kpi"><div class="mdl-kpi-label">上下文</div><div class="mdl-kpi-num purple">${model.context_window?fmtCtx(model.context_window):'—'}</div><div class="mdl-kpi-sub">${model.max_output_tokens?'Max Out '+fmtCtx(model.max_output_tokens):'—'}</div></div><div class="mdl-kpi"><div class="mdl-kpi-label">月 token 用量</div><div class="mdl-kpi-num success">${mT?((mT/1e9).toFixed(2)+'B'):'—'}</div><div class="mdl-kpi-sub">周 ${wT?((wT/1e9).toFixed(2)+'B'):'—'}</div></div><div class="mdl-kpi"><div class="mdl-kpi-label">趋势</div><div class="mdl-kpi-num" style="color:${trend>=0?'var(--success)':'var(--danger)'};">${trend>=0?'+':''}${trend}%</div><div class="mdl-kpi-sub">近 7 天 · ${trend>=0?'↑ 上行':'↓ 下行'}</div></div></div><div class="mdl-section"><h2>💵 官方 5 维价格</h2><span class="right-meta">USD 原始价 · 1 USD ≈ ¥${(FX.USD_CNY||7.1).toFixed(2)} · 汇率 ${FX.date||''}</span></div><div class="mdl-price-card">${pc('📥 Input（输入）','每 1M token 输入价格',oIn)} ${pc('📤 Output（输出）','每 1M token 输出价格',oOut)} ${pc('💾 Cache Read','命中缓存读取价格',cr)} ${pc('💾 Cache Write','写入缓存价格',cw)} ${pc('🧠 Reasoning','深度思考模式价格',rs)} ${ad!==null?pc('🎤 Audio','音频理解价格',ad):''}</div><div class="mdl-section"><h2>📡 可用渠道<span style="color:var(--muted);font-weight:500;font-size:13px;">(${offerings.length})</span></h2><span class="right-meta">按总价升序 · 含官方/中转/网关</span></div>${offerings.length===0?'<div class="biz-pick" style="text-align:center;color:var(--muted);">该模型暂无渠道数据</div>': '<div style="overflow-x:auto;border-radius:12px;"><table class="mdl-chan-table"><thead><tr><th>渠道</th><th>倍率</th><th>价格</th><th>SLA</th><th>付款</th><th>操作</th></tr></thead><tbody>'+chH+'</tbody></table></div>'}<div class="mdl-section"><h2>🎯 Best for · 适用场景</h2><span class="right-meta">${bf.length} 个场景标签</span></div><div class="mdl-bestfor-card">${bf.map(t=>'<span class="mdl-bestfor-tag'+(t.c?' '+t.c:'')+'">'+E(t.t)+'</span>').join('')}</div><div class="mdl-section"><h2>📈 调用趋势 · 近 8 周</h2><span class="right-meta">相对值 · 0~100</span></div><div class="mdl-trend-card"><div class="mdl-trend-meta"><div><div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;">周 token 用量</div><div class="current">${wT?(wT/1e9).toFixed(2)+'B':'—'}</div></div><span class="delta ${trend>=0?'up':'down'}">${trend>=0?'▲':'▼'} ${trend>=0?'+':''}${trend}%</span></div><div class="mdl-trend-grid">${tH}</div></div><div style="margin-top:28px;text-align:center;"><a href="compare.html?model=${model.id}" class="btn btn-primary" style="display:inline-flex;text-decoration:none;">📊 横向比价（含 ${offerings.length} 个渠道）</a></div>`; })();</script>
