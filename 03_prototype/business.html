<style>
/* === 信息发布站 — okkmax 风格 === */
.biz-hero { padding: 32px 0 12px; text-align: center; }
.biz-hero h1 { font-size: 36px; margin-bottom: 6px; font-weight: 800; }
.biz-hero .gradient-text { background: var(--accent); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.biz-hero p { color: var(--muted); max-width: 720px; margin: 0 auto 12px; font-size: 14px; }

/* KPI 数字墙 */
.kpi-wall { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 720px; margin: 16px auto 0; }
.biz-kpi { padding: 12px 8px; text-align: center; border-radius: 10px; background: var(--bg-card); border: 1px solid var(--border); }
.biz-kpi-num { font-family: var(--font-mono); font-size: 22px; font-weight: 800; color:var(--accent-ink); }
.biz-kpi-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
.biz-kpi.warn .biz-kpi-num { color: #f59e0b; }
@media (max-width: 700px) { .kpi-wall { grid-template-columns: repeat(2, 1fr); } }

/* === Latest test results 时间线（仿 okkmax） === */
.biz-section-title { display: flex; align-items: center; justify-content: space-between; margin: 28px 0 12px; }
.biz-section-title h2 { margin: 0; font-size: 18px; font-weight: 700; }
.biz-section-title a { color:var(--accent-ink); font-size: 12px; text-decoration: none; }
.biz-section-title .live-dot { display: inline-block; width: 6px; height: 6px; background: #22c55e; border-radius: 50%; margin-right: 6px; }

.biz-timeline { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.biz-timeline-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border); transition: all 0.15s; text-decoration: none; color: inherit; }
.biz-timeline-row:hover { border-color:var(--accent-ink); transform: translateX(2px); }
.biz-timeline-row .tl-logo { width: 24px; height: 24px; border-radius: 6px; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.biz-timeline-row .tl-model { font-weight: 600; font-size: 12px; }
.biz-timeline-row .tl-badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; font-weight: 600; }
.biz-timeline-row .tl-badge.official { background: rgba(34,197,94,0.15); color: #22c55e; }
.biz-timeline-row .tl-badge.mixed { background: rgba(245,158,11,0.15); color: #f59e0b; }
.biz-timeline-row .tl-badge.suspicious { background: rgba(239,68,68,0.15); color: #ef4444; }
.biz-timeline-row .tl-badge.unverified { background: rgba(148,163,184,0.15); color: #94a3b8; }
.biz-timeline-row .tl-date { margin-left: auto; font-size: 10px; color: var(--muted); font-family: var(--font-mono); }
@media (max-width: 700px) { .biz-timeline { grid-template-columns: 1fr; } }

/* === Rankings 主表（仿 okkmax 6 列） === */
.biz-table { width: 100%; border-collapse: collapse; margin-top: 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 12px; }
.biz-table thead th { background: var(--bg-deep); padding: 10px 12px; text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
.biz-table tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
.biz-table tbody tr:hover { background: rgba(0, 0, 0, 0.04); }
.biz-table tbody tr:last-child { border-bottom: 0; }
.biz-table td { padding: 12px; vertical-align: middle; }
.biz-table .col-site { display: flex; align-items: center; gap: 10px; min-width: 180px; }
.biz-table .col-logo { width: 36px; height: 36px; border-radius: 8px; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; position: relative; }
.biz-table .col-status { position: absolute; bottom: -2px; right: -2px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg-deep); }
.biz-table .col-name { font-weight: 700; font-size: 13px; }
.biz-table .col-listed { font-size: 10px; color: var(--muted); margin-top: 2px; }
.biz-table .col-perf { font-family: var(--font-mono); }
.biz-table .col-perf .uptime { font-weight: 700; color: #22c55e; }
.biz-table .col-perf .uptime.warn { color: #f59e0b; }
.biz-table .col-perf .uptime.bad { color: #ef4444; }
.biz-table .col-perf .latency { font-size: 10px; color: var(--muted); margin-top: 2px; }
.biz-table .col-pay { display: flex; gap: 4px; flex-wrap: wrap; max-width: 140px; }
.biz-table .pay-icon { width: 20px; height: 20px; border-radius: 4px; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
.biz-table .pay-icon.alipay { color: #1677ff; }
.biz-table .pay-icon.wechat { color: #07c160; }
.biz-table .pay-icon.usdt { color: #26a17b; }
.biz-table .pay-icon.card { color: #fbbf24; }
.biz-table .pay-icon.paypal { color: #0070ba; }
.biz-table .pay-icon.bank { color: #94a3b8; }
.biz-table .pay-icon.corp { color: #000000; }
.biz-table .col-policy { font-size: 11px; line-height: 1.5; }
.biz-table .col-policy .check { color: #22c55e; }
.biz-table .col-policy .cross { color: #ef4444; }
.biz-table .col-policy .dash { color: var(--muted); }
.biz-table .col-policy .fee { color: #f59e0b; font-size: 10px; }
.biz-table .col-review { font-size: 12px; }
.biz-table .col-review .stars { color: #fbbf24; font-size: 12px; }
.biz-table .col-review .no-rating { color: var(--muted); font-size: 11px; }
.biz-table .col-coverage { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; max-width: 130px; }
.biz-table .col-coverage .count { font-family: var(--font-mono); font-size: 13px; font-weight: 700; margin-right: 4px; }
.biz-table .col-coverage .vendor-icon { width: 18px; height: 18px; border-radius: 4px; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; }
.biz-table .col-coverage .more { font-size: 10px; color: var(--muted); }
@media (max-width: 900px) { .biz-table { font-size: 11px; } .biz-table td { padding: 8px; } }

/* === Top Picks 用户口碑（仿 okkmax） === */
.biz-picks-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.biz-pick { padding: 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; transition: all 0.15s; }
.biz-pick:hover { border-color:var(--accent-ink); }
.biz-pick-quote { font-size: 13px; line-height: 1.5; color: var(--fg); margin-bottom: 8px; }
.biz-pick-quote::before { content: '\201C'; font-size: 20px; color:var(--accent-ink); margin-right: 2px; }
.biz-pick-quote::after { content: '\201D'; font-size: 20px; color:var(--accent-ink); margin-left: 2px; }
.biz-pick-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.biz-pick-tag { font-size: 10px; padding: 2px 7px; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); }
.biz-pick-tag.bad { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #ef4444; }
.biz-pick-user { display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.biz-pick-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; font-size: 11px; }
.biz-pick-name { font-size: 12px; font-weight: 600; flex: 1; }
.biz-pick-stars { color: #fbbf24; font-size: 11px; }
.biz-pick-station { display: flex; align-items: center; gap: 6px; margin-top: 6px; padding: 6px 8px; background: var(--bg-deep); border-radius: 6px; text-decoration: none; color: inherit; font-size: 12px; }
.biz-pick-station-logo { width: 18px; height: 18px; border-radius: 4px; background: var(--bg-card); display: flex; align-items: center; justify-content: center; font-size: 10px; }
@media (max-width: 700px) { .biz-picks-grid { grid-template-columns: 1fr; } }

/* === Perks & promotions === */
.biz-perks-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.biz-perk { padding: 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; transition: all 0.15s; text-decoration: none; color: inherit; }
.biz-perk:hover { border-color:var(--accent-ink); transform: translateY(-1px); }
.biz-perk-tag { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 8px; font-weight: 600; margin-bottom: 8px; }
.biz-perk-tag.free { background: rgba(34,197,94,0.15); color: #22c55e; }
.biz-perk-tag.discount { background: rgba(0, 0, 0, 0.15); color: #000000; }
.biz-perk-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.biz-perk-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
.biz-perk-meta { font-size: 11px; color: var(--muted); margin-top: 8px; }
.biz-perk-cta { margin-top: 10px; font-size: 12px; color:var(--accent-ink); font-weight: 600; }
@media (max-width: 900px) { .biz-perks-grid { grid-template-columns: 1fr; } }

/* === 排序 + 筛选栏 === */
.biz-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; flex-wrap: wrap; gap: 8px; }
.biz-bar select, .biz-bar input { background: var(--bg-deep); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: var(--fg); font-size: 12px; }
.biz-bar input { min-width: 200px; }
.biz-bar label { font-size: 12px; color: var(--muted); }
.biz-bar strong { color: var(--fg); }

/* === Footer === */
.biz-footer { text-align: center; padding: 40px 20px 20px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); margin-top: 40px; }
.biz-footer a { color:var(--accent-ink); text-decoration: none; }
</style>
</head>

<script>
function escapeHtml(s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
if (typeof renderTopbar === "function") renderTopbar("business");


// 支付方式图标映射
const PAY_LABELS = {
  alipay: { name: '支付宝', cls: 'alipay', char: '支' },
  wechat: { name: '微信', cls: 'wechat', char: '微' },
  usdt: { name: 'USDT', cls: 'usdt', char: '₮' },
  card: { name: '银行卡', cls: 'card', char: '卡' },
  paypal: { name: 'PayPal', cls: 'paypal', char: 'P' },
  bank: { name: '对公', cls: 'bank', char: '公' },
  corp: { name: '对公', cls: 'corp', char: '公' }
};

// 模型厂商图标
const VENDOR_LABELS = {
  claude: { char: 'C', color: '#cc785c' },
  openai: { char: 'O', color: '#10a37f' },
  gemini: { char: 'G', color: '#4285f4' },
  deepseek: { char: 'D', color: '#4d6bfe' },
  qwen: { char: 'Q', color: '#ff6a00' },
  llama: { char: 'L', color: '#0866ff' },
  mistral: { char: 'M', color: '#ff7000' },
  glm: { char: 'Z', color: '#3478f6' }
};

function getSlaClass(sla) {
  if (!sla || sla === 0) return 'bad';
  if (sla >= 99) return '';
  if (sla >= 90) return 'warn';
  return 'bad';
}

function renderTimeline() {
  // 模拟"Latest test results" — 取最近 8 个测试
  const tests = [];
  for (let i = 0; i < 8; i++) {
    const m = D.models[i % D.models.length];
    const v = D.vendors.find(vv => vv.id === m.vendor_id);
    const r = (i * 137) % 100;
    let badge = 'official', cls = 'official';
    if (r < 15) { badge = '可疑似'; cls = 'suspicious'; }
    else if (r < 35) { badge = '混合'; cls = 'mixed'; }
    else if (r < 50) { badge = '未验证'; cls = 'unverified'; }
    else { badge = '官方'; cls = 'official'; }
    const date = '0' + ((i % 9) + 1);
    tests.push({
      logo: (v?.name_zh || '?')[0],
      model: m.display_name || m.id,
      badge, cls,
      date: '09-' + (i % 30 + 1)
    });
  }
  document.getElementById("biz-timeline").innerHTML = tests.map(t =>
    '<a class="biz-timeline-row" href="#">' +
      '<div class="tl-logo">' + escapeHtml(t.logo) + '</div>' +
      '<span class="tl-model">' + escapeHtml(t.model) + '</span>' +
      '<span class="tl-badge ' + t.cls + '">' + t.badge + '</span>' +
      '<span class="tl-date">' + t.date + '</span>' +
    '</a>'
  ).join('');
}

function renderTable() {
  const list = [...D.providers];
  const sortBy = document.getElementById("biz-sort").value;
  list.sort((a, b) => {
    if (sortBy === 'uptime') return (b.sla_uptime || 0) - (a.sla_uptime || 0);
    if (sortBy === 'latency') return (a.tags?.includes('限时优惠') ? 0 : 1) - (b.tags?.includes('限时优惠') ? 0 : 1);
    if (sortBy === 'rating') return (b.rating || 0) - (a.rating || 0);
    if (sortBy === 'review_count') return (b.review_count || 0) - (a.review_count || 0);
    if (sortBy === 'model_count') return (b.models_count || 0) - (a.models_count || 0);
    if (sortBy === 'sla') return (b.sla_uptime || 0) - (a.sla_uptime || 0);
    if (sortBy === 'promo') return (b.promo ? 1 : 0) - (a.promo ? 1 : 0);
    return (a.name_zh || '').localeCompare(b.name_zh || '', 'zh');
  });

  // 延迟排序（基于 sla 反向）
  if (sortBy === 'latency') {
    list.sort((a, b) => {
      const la = a.tags?.includes('限时优惠') ? 0 : (100 - (a.sla_uptime || 0)) * 0.1;
      const lb = b.tags?.includes('限时优惠') ? 0 : (100 - (b.sla_uptime || 0)) * 0.1;
      return la - lb;
    });
  }

  const tbody = document.getElementById("biz-tbody");
  tbody.innerHTML = list.map(p => {
    const slaClass = getSlaClass(p.sla_uptime);
    const slaText = p.sla_uptime ? (p.sla_uptime.toFixed(1) + '%') : '—';
    const latency = (p.browse_count ? (1 + ((hashStr(p.id + 'l') % 60) / 10)).toFixed(1) : '0.0');
    
    // 支付方式
    const pays = (p.payment_currency || []).map(c => {
      const m = PAY_LABELS[c.toLowerCase()] || { name: c, cls: 'bank', char: c[0] };
      return '<span class="pay-icon ' + m.cls + '" title="' + m.name + '">' + m.char + '</span>';
    }).join('');
    
    // 政策
    const refund = p.tags?.includes('免费试用') ? '<span class="fee">5%手续费</span>' : 
                   p.tags?.includes('可开发票') ? '<span class="check">✓</span>' : 
                   p.tags?.includes('官方') ? '<span class="dash">—</span>' :
                   '<span class="cross">✗</span>';
    const invoice = p.tags?.includes('可开发票') ? (p.min_charge > 100 ? '<span class="dash">' + p.min_charge + '起</span>' : '<span class="check">✓</span>') : '<span class="cross">✗</span>';
    
    // 评价
    const rating = p.rating ? 
      '<div class="col-review">' +
        '<span class="stars">' + '★'.repeat(Math.floor(p.rating)) + (p.rating % 1 >= 0.5 ? '☆' : '') + '</span>' +
        ' <strong>' + p.rating + '</strong>' +
        ' <span class="no-rating">(' + (p.review_count || 0) + ')</span>' +
      '</div>' :
      '<span class="no-rating">暂无评分</span>';
    
    // 模型覆盖 — 分配 3-4 个厂商图标 + +N
    const vendorCount = p.models_count || 30;
    const vendorIcons = ['claude', 'openai', 'gemini', 'deepseek', 'qwen'];
    const icons = vendorIcons.slice(0, Math.min(4, Math.floor(vendorCount / 50) + 2)).map(v => 
      '<span class="vendor-icon" style="color:' + (VENDOR_LABELS[v]?.color || '#94a3b8') + ';" title="' + v + '">' + (VENDOR_LABELS[v]?.char || '?') + '</span>'
    ).join('');
    const more = vendorCount > 200 ? '<span class="more">+' + Math.floor((vendorCount - 200) / 10) + '</span>' : '';
    
    const logo = (p.name_zh || '?')[0];
    const statusClass = p.status || 'online';
    
    return '<tr>' +
      '<td>' +
        '<div class="col-site">' +
          '<div class="col-logo">' + escapeHtml(logo) + '<div class="col-status ' + statusClass + '"></div></div>' +
          '<div>' +
            '<div class="col-name"><a href="' + escapeHtml(p.website || '#') + '" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;">' + escapeHtml(p.name_zh) + '</a></div>' +
            '<div class="col-listed">Listed ' + escapeHtml((p.signup_date || '2026-09').slice(0, 7)) + '</div>' +
          '</div>' +
        '</div>' +
      '</td>' +
      '<td class="col-perf">' +
        '<div class="uptime ' + slaClass + '">' + slaText + '</div>' +
        '<div class="latency">Latency ' + latency + 's</div>' +
      '</td>' +
      '<td><div class="col-pay">' + pays + '</div></td>' +
      '<td class="col-policy">退款 ' + refund + '<br>发票 ' + invoice + '</td>' +
      '<td>' + rating + '</td>' +
      '<td>' +
        '<div class="col-coverage">' +
          '<span class="count">' + vendorCount + '</span>' +
          icons + more +
        '</div>' +
      '</td>' +
    '</tr>';
  }).join('');
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function renderPicks() {
  // 用户口碑精选 — 6 条
  const picks = [];
  for (let i = 0; i < 6; i++) {
    const p = D.providers[i];
    const r = hashStr(p.id) % 100;
    let rating = (3 + r / 50).toFixed(1);
    if (rating > 5) rating = '5.0';
    const quotes = [
      '之前换了好几个中转站，这个还算不错。客服响应挺快的，价格还可以。',
      '速度稳定价格没得说，模型全。',
      '稳定啊 还是原生的 20x 号池好使啊 ！',
      '官方正版，不掺假，跑得很快。',
      '免费额度很多，速度也还可以，就是模型偏贵。',
      '充 ¥100 送 ¥20，到账很快，可靠。',
      '跑了 3 个月没翻车，性价比高。',
      '逆向的很便宜 但是偶尔跑路。'
    ];
    const tags = [
      [['客服好', '价格实惠'], ['客服慢', '价格贵']],
      [['稳定', '速度快'], ['满100%']],
      [['原生号池', '快']],
      [['官方', '不掺水'], ['贵']],
      [['免费额度', '模型全'], ['价格贵']],
      [['充100送20', '靠谱']]
    ];
    const qIdx = hashStr(p.id + 'q') % quotes.length;
    const tIdx = hashStr(p.id + 't') % tags.length;
    const isBad = (hashStr(p.id + 'b') % 5 === 0);
    picks.push({
      quote: quotes[qIdx],
      tags: isBad ? tags[tIdx][1].map(t => ({ text: t, bad: true })) : tags[tIdx][0].map(t => ({ text: t, bad: false })),
      user: '用户' + (1000 + hashStr(p.id) % 9000),
      rating: isBad ? (2 + (hashStr(p.id) % 2)).toFixed(1) : rating,
      p
    });
  }
  document.getElementById("biz-picks").innerHTML = picks.map(pk =>
    '<div class="biz-pick">' +
      '<div class="biz-pick-quote">' + escapeHtml(pk.quote) + '</div>' +
      '<div class="biz-pick-tags">' + pk.tags.map(t =>
        '<span class="biz-pick-tag' + (t.bad ? ' bad' : '') + '">' + escapeHtml(t.text) + '</span>'
      ).join('') + '</div>' +
      '<div class="biz-pick-user">' +
        '<div class="biz-pick-avatar">👤</div>' +
        '<span class="biz-pick-name">' + escapeHtml(pk.user) + '</span>' +
        '<span class="biz-pick-stars">' + '★'.repeat(Math.floor(pk.rating)) + '</span>' +
      '</div>' +
      '<a href="' + escapeHtml(pk.p.website || '#') + '" target="_blank" rel="noopener" class="biz-pick-station">' +
        '<div class="biz-pick-station-logo">' + escapeHtml((pk.p.name_zh || '?')[0]) + '</div>' +
        '<span>' + escapeHtml(pk.p.name_zh) + ' →</span>' +
      '</a>' +
    '</div>'
  ).join('');
}

function renderPerks() {
  const perks = [];
  // 优先从 data 抽带 promo 的 + 3 个固定免费/优惠位
  const promoProviders = D.providers.filter(p => p.promo).slice(0, 3);
  const freeProviders = D.providers.filter(p => p.min_charge === 0 || (p.tags || []).includes('免费试用')).slice(0, 3);
  
  for (const p of promoProviders) {
    const promo = typeof p.promo === 'object' ? p.promo : { text: p.promo };
    perks.push({
      tag: 'discount',
      tagText: '限时优惠',
      title: p.name_zh,
      desc: promo.text || '限时折扣',
      meta: '至 ' + (p.last_check_at || '本周') + ' · 仅限新用户',
      cta: '立即领取',
      url: p.website
    });
  }
  // 加 2 个固定的免费试用
  perks.push({
    tag: 'free', tagText: '🆓 免费 API',
    title: 'Claude 4.5 Sonnet 免费试用',
    desc: '新用户首月 1000 次免费调用 · 浏览器内 Playground 即测',
    cta: '前往 Playground →',
    url: 'playground.html'
  });
  perks.push({
    tag: 'free', tagText: '🆓 免费 API',
    title: 'GPT-5.5 限时开放',
    desc: '20 次/分钟 · 50 次/日免费调用 · 无需信用卡',
    cta: '立即试用 →',
    url: 'playground.html'
  });
  perks.push({
    tag: 'discount', tagText: '💰 推荐奖励',
    title: '邀请好友得 ¥50',
    desc: '好友充值 100 送 50 · 你也得 50 · 永久有效',
    cta: '查看邀请计划 →',
    url: '#'
  });

  document.getElementById("biz-perks").innerHTML = perks.map(p =>
    '<a href="' + escapeHtml(p.url || '#') + '" class="biz-perk">' +
      '<span class="biz-perk-tag ' + p.tag + '">' + p.tagText + '</span>' +
      '<div class="biz-perk-title">' + escapeHtml(p.title) + '</div>' +
      '<div class="biz-perk-desc">' + escapeHtml(p.desc) + '</div>' +
      (p.meta ? '<div class="biz-perk-meta">' + p.meta + '</div>' : '') +
      '<div class="biz-perk-cta">' + p.cta + '</div>' +
    '</a>'
  ).join('');
}

function init() {
  // KPI
  const total = D.providers.length;
  const online = D.providers.filter(p => p.status === 'online').length;
  const degraded = D.providers.filter(p => p.status === 'offline' || p.status === 'limited').length;
  const tested = D.models.length * 2;
  document.getElementById("biz-kpi-total").textContent = total;
  document.getElementById("biz-kpi-online").textContent = online;
  document.getElementById("biz-kpi-degraded").textContent = degraded;
  document.getElementById("biz-kpi-tested").textContent = tested;

  // Sections
  renderTimeline();
  renderTable();
  renderPicks();
  renderPerks();

  // Sort handler
  document.getElementById("biz-sort").addEventListener("change", renderTable);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
