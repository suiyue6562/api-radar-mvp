<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行情事件 - API优选咨询</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.main h1 { font-size: 28px; }
.event-filters { display: flex; gap: 10px; flex-wrap: wrap; padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; align-items: center; }
.filter-chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-card); color: var(--muted-foreground); font-size: 13px; font-weight: 500; cursor: pointer; }
.filter-chip:hover { border-color: var(--accent); color: var(--fg); }
.filter-chip.active { background: var(--grad-primary); border-color: var(--accent); color: #001428; font-weight: 700; }
.filter-label { font-size: 12px; color: var(--muted); }
select.filter-sel { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--fg); font-size: 13px; }
.event-list { display: flex; flex-direction: column; gap: 12px; }
.event-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; gap: 16px; }
.event-item:hover { border-color: var(--border-hover); }
.event-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.sev-high .event-icon { background: rgba(255,71,87,0.12); color: var(--danger); }
.sev-medium .event-icon { background: rgba(255,184,77,0.12); color: var(--warning); }
.sev-low .event-icon, .sev-positive .event-icon { background: rgba(0,255,163,0.12); color: var(--success); }
.sev-neutral .event-icon { background: rgba(176,107,255,0.12); color: var(--accent-2); }
.event-body { flex: 1; min-width: 0; }
.event-title { font-weight: 700; font-size: 15px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.event-desc { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
.event-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.tag { padding: 3px 10px; border-radius: 6px; font-size: 11px; }
.event-date { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; }
</style>
</head>
<body>
<div id="topbar"></div>
<main class="main">
  <div class="page-hero fade-in">
    <div class="page-hero-tagline"><span class="page-hero-tagline-dot"></span><span>实时 · 30 天回顾</span></div>
    <h1><span class="gradient-text">📊 行情事件</span></h1>
    <p class="subtitle">价格变动 · 新模型发布 · 服务中断 · 政策调整 — 2024-09 至 2026-09</p>
  </div>
  <div class="event-filters" id="event-filters">
    <span class="filter-label">类型：</span>
    <button class="filter-chip active" data-type="">全部</button>
    <button class="filter-chip" data-type="new_model">新模型</button>
    <button class="filter-chip" data-type="price_change">价格变动</button>
    <button class="filter-chip" data-type="policy_change">政策变更</button>
    <span class="filter-label">严重：</span>
    <select class="filter-sel" id="filter-severity"><option value="">全部</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option><option value="positive">正面</option></select>
    <span class="filter-label">对象：</span>
    <select class="filter-sel" id="filter-target-type"><option value="">全部</option><option value="model">模型</option><option value="provider">渠道</option></select>
    <span id="filter-count" style="margin-left:auto;font-size:13px;color:var(--muted);"></span>
  </div>
  <div class="event-list" id="event-list"></div>
</main>
<script src="data.js?v=20260921b"></script>
<script src="app.js?v=20260921b"></script>
<script>
(function() {
  if (typeof renderTopbar === 'function') renderTopbar('events');
  
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"\']/g, function(c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; });
}

  const EVENTS = API_RADAR_DATA.events;
  let current = { type: '', severity: '', targetType: '' };
  const typeMap = { price_change: '价格变动', new_model: '新模型', outage: '中断', capability_update: '能力', policy_change: '政策', model_deprecate: '停用' };
  const sevLabel = { high: '高', medium: '中', low: '低', positive: '正面', neutral: '中性' };
  const iconMap = { price_change: '💰', new_model: '🚀', outage: '⚠️', capability_update: '🧠', policy_change: '📋', model_deprecate: '🗑️' };

  function matches(e) {
    if (current.type && e.event_type !== current.type) return false;
    if (current.severity && e.severity !== current.severity) return false;
    if (current.targetType && e.target_type !== current.targetType) return false;
    return true;
  }

  function render() {
    const filtered = EVENTS.filter(matches).sort((a, b) => b.date.localeCompare(a.date));
    const list = document.getElementById('event-list');
    document.getElementById('filter-count').textContent = '显示 ' + filtered.length + ' / ' + EVENTS.length + ' 条';
    list.innerHTML = filtered.length === 0 ? '<div class="empty-state"><div class="empty-state-icon">📭</div>没有符合条件的事件</div>' :
      filtered.map(e => {
        const date = new Date(e.date).toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
        const sev = e.severity || 'medium';
        const targetTag = e.target_type === 'model' ? '<span class="tag tag-accent">' + escapeHtml(e.target_name || '') + '</span>' : e.target_type === 'provider' ? '<span class="tag tag-purple">' + escapeHtml(e.target_name || '') + '</span>' : '';
        return `<div class="event-item sev-${sev}">
          <div class="event-icon">${iconMap[e.event_type] || '📌'}</div>
          <div class="event-body">
            <div class="event-title">${escapeHtml(e.title)} <span class="tag" style="background:rgba(120,160,255,0.12);">${escapeHtml(sevLabel[sev] || sev)}</span></div>
            <div class="event-desc">${escapeHtml(e.description || '')}</div>
            <div class="event-meta">
              ${(e.tags || []).map(t => '<span class="tag" style="background:rgba(120,160,255,0.1);">' + (typeMap[t] || t) + '</span>').join('')}
              ${targetTag}
              ${(e.source_urls && e.source_urls[0]) ? '<a href="' + e.source_urls[0] + '" target="_blank" style="margin-left:auto;color:var(--accent);font-size:11px;">🔗 来源</a>' : ''}
            </div>
          </div>
          <div class="event-date">${date}</div>
        </div>`;
      }).join('');
  }

  document.querySelectorAll('#event-filters .filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#event-filters .filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      current.type = chip.dataset.type;
      render();
    });
  });
  document.getElementById('filter-severity').addEventListener('change', e => { current.severity = e.target.value; render(); });
  document.getElementById('filter-target-type').addEventListener('change', e => { current.targetType = e.target.value; render(); });

  render();
})();
</script>

<script>
// 触发本页初始化
if (window.PAGE_INITIALIZERS && window.PAGE_INITIALIZERS["events"]) {
  window.PAGE_INITIALIZERS["events"]();
}
</script>
</body>
</html>
