<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的关注 - API Radar</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
.main h1 { font-size: 28px; }
.add-form { display: flex; gap: 8px; margin-bottom: 24px; padding: 20px; }
.add-form select { flex: 1; padding: 10px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; color:var(--fg); }
.add-form button { padding: 10px 20px; }
.watch-list { display: flex; flex-direction: column; gap: 12px; }
.watch-item { padding: 18px 20px; display: flex; gap: 16px; align-items: center; }
.watch-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.watch-body { flex: 1; }
.watch-name { font-weight: 600; }
.watch-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.watch-price { font-family: var(--font-mono); font-weight: 700; color: var(--accent); font-size: 14px; }
.watch-change { font-size: 11px; padding: 3px 8px; border-radius: 4px; }
.watch-change.up { background: rgba(255,71,87,0.15); color: var(--danger); }
.watch-change.down { background: rgba(0,255,163,0.15); color: var(--success); }
.watch-remove { padding: 6px 10px; background: rgba(255,71,87,0.1); color: var(--danger); border: 1px solid rgba(255,71,87,0.2); border-radius: 6px; font-size: 12px; cursor: pointer; }
.watch-remove:hover { background: rgba(255,71,87,0.2); }
</style>
</head>
<body>
<div id="topbar"></div>
<main class="main">
  <h1>🔔 我的关注</h1>
  <p class="muted" style="margin-bottom:24px;">订阅关注的模型/渠道，本地存储（localStorage），价格变化时自动记录</p>

  <div class="card add-form">
    <select id="add-type">
      <option value="model">📦 模型</option>
      <option value="provider">📡 渠道</option>
    </select>
    <select id="add-target"></select>
    <button class="btn btn-primary" id="add-btn">+ 添加关注</button>
  </div>

  <div class="watch-list" id="watch-list"></div>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function() {
  if (typeof renderTopbar === 'function') renderTopbar('watch');
  const D = API_RADAR_DATA;
  const STORAGE_KEY = 'api_radar_watch_v2';

  function getWatched() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch (e) { return []; }
  }
  function saveWatched(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }

  const addType = document.getElementById('add-type');
  const addTarget = document.getElementById('add-target');

  function refreshTargetOptions() {
    const type = addType.value;
    addTarget.innerHTML = '';
    if (type === 'model') {
      D.models.forEach(m => { const opt = document.createElement('option'); opt.value = m.id; opt.textContent = m.display_name; addTarget.appendChild(opt); });
    } else {
      D.providers.forEach(p => { const opt = document.createElement('option'); opt.value = p.id; opt.textContent = p.name; addTarget.appendChild(opt); });
    }
  }
  addType.addEventListener('change', refreshTargetOptions);
  refreshTargetOptions();

  document.getElementById('add-btn').addEventListener('click', () => {
    const list = getWatched();
    const type = addType.value;
    const id = addTarget.value;
    if (list.find(x => x.type === type && x.id === id)) return;
    list.push({ type, id, addedAt: Date.now() });
    saveWatched(list);
    render();
  });

  function render() {
    const list = getWatched();
    const wrap = document.getElementById('watch-list');
    if (list.length === 0) {
      wrap.innerHTML = `<div class="card glass-strong" style="text-align:center;padding:60px 24px;">
        <div style="font-size:48px;opacity:0.4;margin-bottom:16px;">🔔</div>
        <h3 style="margin-bottom:8px;">还没有关注项</h3>
        <p class="muted" style="margin-bottom:20px;">从上方添加你想跟踪的模型或渠道</p>
      </div>`;
      return;
    }
    wrap.innerHTML = list.map(item => {
      if (item.type === 'model') {
        const m = D.models.find(x => x.id === item.id);
        if (!m) return '';
        const vendor = D.vendors.find(v => v.id === m.vendor_id);
        return `<div class="card watch-item">
          <div class="watch-icon">${vendor?.logo || '🤖'}</div>
          <div class="watch-body">
            <div class="watch-name">${m.display_name}</div>
            <div class="watch-meta">${vendor?.name || ''} · ${m.release_date} · ${fmtCtx(m.context_window)} ctx</div>
          </div>
          <div class="watch-price">${fmtUSD(m.official_input_usd_m)} <span class="muted text-xs">in</span></div>
          <button class="watch-remove" data-id="${item.id}" data-type="model">✕</button>
        </div>`;
      } else {
        const p = D.providers.find(x => x.id === item.id);
        if (!p) return '';
        const offerings = D.offerings.filter(o => o.provider_id === p.id).length;
        return `<div class="card watch-item">
          <div class="watch-icon">📡</div>
          <div class="watch-body">
            <div class="watch-name">${p.name}</div>
            <div class="watch-meta">${p.type} · ${offerings} SKU · ${(p.payment_currency || []).join('/')}</div>
          </div>
          <div class="muted text-sm">起充 ¥${p.min_charge || 0}</div>
          <button class="watch-remove" data-id="${item.id}" data-type="provider">✕</button>
        </div>`;
      }
    }).join('');

    wrap.querySelectorAll('.watch-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        const list = getWatched().filter(x => !(x.type === btn.dataset.type && x.id === btn.dataset.id));
        saveWatched(list);
        render();
      });
    });
  }

  render();
})();
</script>
</body>
</html>
