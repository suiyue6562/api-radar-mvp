<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground - API Radar</title>
<meta name="description" content="免费在线测试任意 AI API。支持 OpenAI/Anthropic 协议，流式输出，多模型对比，Token 费用统计。">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.pg-hero { padding: 32px 0 16px; text-align: center; }
.pg-hero h1 { font-size: 36px; margin-bottom: 8px; }
.pg-hero p { color: var(--muted); font-size: 14px; }

/* 三栏布局 */
.pg-layout { display: grid; grid-template-columns: 240px 1fr 320px; gap: 16px; margin-top: 16px; }
@media (max-width: 1100px) { .pg-layout { grid-template-columns: 1fr; } }

/* 左：参数面板 */
.pg-params { padding: 16px; height: fit-content; position: sticky; top: 80px; }
.param-group { margin-bottom: 16px; }
.param-group label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.05em; }
.param-group input[type="range"] { width: 100%; }
.param-group .val { color: var(--accent); font-family: var(--font-mono); font-weight: 700; font-size: 13px; float: right; }
.param-group select, .param-group input[type="number"], .param-group input[type="text"] { width: 100%; padding: 8px 12px; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 6px; color: var(--fg); font-size: 13px; }
.param-group input[type="checkbox"] { margin-right: 6px; }
.param-group textarea { width: 100%; min-height: 80px; padding: 10px; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 6px; color: var(--fg); font-family: var(--font-mono); font-size: 13px; resize: vertical; }
.param-group textarea:focus { outline: none; border-color: var(--accent); }

/* 中：对话区 */
.pg-chat { display: flex; flex-direction: column; height: calc(100vh - 200px); min-height: 600px; }
.pg-messages { flex: 1; overflow-y: auto; padding: 16px; }
.pg-msg { margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; max-width: 90%; }
.pg-msg.user { background: var(--grad-glow); border: 1px solid var(--border-strong); margin-left: auto; }
.pg-msg.assistant { background: var(--bg-card); border: 1px solid var(--border); }
.pg-msg.system { background: rgba(255,184,77,0.08); border: 1px solid rgba(255,184,77,0.3); font-size: 12px; color: var(--muted); }
.pg-msg-role { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.05em; }
.pg-msg-content { white-space: pre-wrap; word-wrap: break-word; line-height: 1.6; font-size: 14px; }
.pg-msg-meta { font-size: 11px; color: var(--muted); margin-top: 6px; font-family: var(--font-mono); }

/* 右：历史/保存 */
.pg-sidebar { padding: 16px; height: fit-content; }
.saved-item { padding: 8px 12px; background: var(--bg-deep); border-radius: 6px; margin-bottom: 6px; font-size: 12px; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; }
.saved-item:hover { border-color: var(--border-hover); }
.saved-item .name { font-weight: 600; margin-bottom: 2px; }
.saved-item .preview { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 输入区 */
.pg-input-area { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; }
.pg-input-area textarea { flex: 1; min-height: 60px; max-height: 200px; padding: 10px; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 8px; color: var(--fg); font-size: 14px; resize: vertical; }

/* 配置栏 */
.pg-config { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); }
.pg-config input, .pg-config select { padding: 8px 12px; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 6px; color: var(--fg); font-size: 13px; width: 100%; }

.pg-actions { display: flex; gap: 6px; }

/* 对比模式 */
.pg-compare { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pg-compare-col { padding: 16px; min-height: 300px; }
.pg-compare-col h4 { font-size: 13px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

/* 隐私提示 */
.privacy-note { background: rgba(0,217,255,0.06); border: 1px solid rgba(0,217,255,0.2); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--muted); margin-top: 12px; }

/* Tab 切换 */
.pg-mode-tabs { display: flex; gap: 4px; padding: 4px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; width: fit-content; }
.pg-mode-tabs button { background: transparent; color: var(--muted); padding: 6px 14px; font-size: 13px; }
.pg-mode-tabs button.active { background: var(--grad-primary); color: #001428; }

/* 流式光标 */
.streaming-cursor::after { content: "▍"; color: var(--accent); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* 复制/重新生成按钮 */
.msg-actions { margin-top: 8px; display: flex; gap: 6px; }
.msg-actions button { padding: 4px 10px; background: rgba(120,160,255,0.1); color: var(--muted); border: 0; font-size: 11px; border-radius: 4px; cursor: pointer; }
.msg-actions button:hover { background: rgba(0,217,255,0.15); color: var(--accent); }
</style>
</head>
<body>
<div id="topbar"></div>

<main class="main" style="max-width: 1280px;">
  <div class="pg-hero fade-in">
    <div class="page-hero-tagline"><span class="page-hero-tagline-dot"></span><span>免费 · 浏览器直跑 · 不上传 Key</span></div>
    <h1><span class="gradient-text">API Playground</span></h1>
    <p>测试任意 OpenAI / Anthropic 兼容的 API。支持流式输出、参数调节、多模型对比。</p>
  </div>

  <!-- 配置栏 -->
  <div class="card glass-strong" style="padding: 16px;">
    <div class="pg-config">
      <div><label style="font-size:11px;color:var(--muted);">Base URL</label><input type="text" id="cfg-base-url" placeholder="https://api.deepseek.com/v1"></div>
      <div><label style="font-size:11px;color:var(--muted);">API Key</label><input type="password" id="cfg-api-key" placeholder="sk-..."></div>
      <div><label style="font-size:11px;color:var(--muted);">模型</label><input type="text" id="cfg-model" placeholder="deepseek-chat"></div>
      <div><label style="font-size:11px;color:var(--muted);">协议</label><select id="cfg-protocol"><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option></select></div>
      <div class="pg-actions" style="align-self:end;">
        <button id="btn-send">▶ 发送</button>
        <button class="secondary" id="btn-stop" disabled>⏹</button>
      </div>
    </div>
    <div class="privacy-note">
      <strong style="color:var(--accent);">🔒 隐私保护：</strong>API Key 仅在本地浏览器使用，<strong>不会上传</strong>到我们的服务器。直接由你的浏览器发请求到 base_url。
    </div>
  </div>

  <!-- 模式切换 -->
  <div class="pg-mode-tabs">
    <button class="active" data-mode="single">单模型对话</button>
    <button data-mode="compare">多模型对比</button>
  </div>

  <!-- 单模型模式 -->
  <div id="mode-single" class="pg-layout">
    <!-- 左侧参数 -->
    <div class="card glass-strong pg-params">
      <h4 style="margin-top:0;">参数</h4>
      <div class="param-group">
        <label>Temperature <span class="val" id="val-temp">0.7</span></label>
        <input type="range" id="param-temp" min="0" max="2" step="0.1" value="0.7">
      </div>
      <div class="param-group">
        <label>Max Tokens <span class="val" id="val-maxtok">1024</span></label>
        <input type="range" id="param-maxtok" min="1" max="8192" step="1" value="1024">
      </div>
      <div class="param-group">
        <label>Top P <span class="val" id="val-topp">1.0</span></label>
        <input type="range" id="param-topp" min="0" max="1" step="0.05" value="1">
      </div>
      <div class="param-group">
        <label><input type="checkbox" id="param-stream" checked> 流式输出</label>
      </div>
      <div class="param-group">
        <label>System Prompt</label>
        <textarea id="param-system" placeholder="你是 ..."></textarea>
      </div>
    </div>

    <!-- 中间对话 -->
    <div class="card glass-strong pg-chat">
      <div class="pg-messages" id="messages"></div>
      <div class="pg-input-area">
        <textarea id="user-input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="btn-send-input">发送</button>
      </div>
    </div>

    <!-- 右侧历史/保存 -->
    <div class="card glass-strong pg-sidebar">
      <h4 style="margin-top:0;">已保存测试</h4>
      <div id="saved-list"></div>
      <button onclick="saveCurrent()" style="margin-top:8px;width:100%;">+ 保存当前测试</button>
      <button class="secondary" onclick="clearHistory()" style="margin-top:6px;width:100%;">清空全部</button>
      <div class="privacy-note" style="margin-top:16px;">
        <strong style="color:var(--accent);">已保存 =</strong> System Prompt + 模型参数（不含 Key 和对话内容）
      </div>
    </div>
  </div>

  <!-- 对比模式 -->
  <div id="mode-compare" style="display:none;">
    <div class="card glass-strong" style="padding: 16px; margin-bottom: 16px;">
      <h4 style="margin-top:0;">对比 3 个模型</h4>
      <p class="muted" style="font-size: 12px;">填 3 组 (Base URL, API Key, 模型)，同 prompt 跑一次。结果并列展示。</p>
      <div id="compare-configs" style="display:grid;grid-template-columns:repeat(3, 1fr);gap:12px;"></div>
      <textarea id="compare-prompt" placeholder="对比 prompt（同时发给 3 个模型）" style="margin-top:12px;width:100%;min-height:60px;"></textarea>
      <button onclick="runCompare()" style="margin-top:12px;">▶ 同时发送</button>
    </div>
    <div class="pg-compare" id="compare-results"></div>
  </div>

</main>

<div id="footer"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="ab.js"></script>
<script>
if (typeof renderTopbar === "function") renderTopbar("playground");

const $ = (id) => document.getElementById(id);

// 参数滑块同步
function bindSlider(id, valId) {
  const s = $(id), v = $(valId);
  s.addEventListener("input", () => v.textContent = s.value);
}
bindSlider("param-temp", "val-temp");
bindSlider("param-maxtok", "val-maxtok");
bindSlider("param-topp", "val-topp");

// 模式切换
document.querySelectorAll(".pg-mode-tabs button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".pg-mode-tabs button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    const m = b.dataset.mode;
    $("mode-single").style.display = m === "single" ? "" : "none";
    $("mode-compare").style.display = m === "compare" ? "" : "none";
  });
});

// 对话状态
let conv = [];  // [{role, content}]
let abortCtrl = null;

// 加载已保存
function loadSaved() {
  try {
    const s = JSON.parse(localStorage.getItem("pg_saved") || "[]");
    $("saved-list").innerHTML = s.length ? s.map((it, i) =>
      '<div class="saved-item" data-idx="' + i + '">' +
        '<div class="name">' + escapeHtml(it.name) + '</div>' +
        '<div class="preview">' + escapeHtml(it.model || "") + ' · ' + escapeHtml((it.system || "").slice(0, 30)) + '</div>' +
      '</div>'
    ).join("") : '<div class="muted" style="padding:16px;text-align:center;">还没有</div>';
    document.querySelectorAll(".saved-item").forEach(el => {
      el.addEventListener("click", () => {
        const it = s[el.dataset.idx];
        $("cfg-base-url").value = it.base_url || "";
        $("cfg-model").value = it.model || "";
        $("param-system").value = it.system || "";
        if (it.params) {
          $("param-temp").value = it.params.temperature || 0.7;
          $("val-temp").textContent = it.params.temperature || 0.7;
          $("param-maxtok").value = it.params.max_tokens || 1024;
          $("val-maxtok").textContent = it.params.max_tokens || 1024;
          $("param-topp").value = it.params.top_p || 1;
          $("val-topp").textContent = it.params.top_p || 1;
        }
      });
    });
  } catch (e) {}
}

function saveCurrent() {
  const name = prompt("给这个测试起个名字：");
  if (!name) return;
  const list = JSON.parse(localStorage.getItem("pg_saved") || "[]");
  list.push({
    name,
    base_url: $("cfg-base-url").value.trim(),
    model: $("cfg-model").value.trim(),
    system: $("param-system").value.trim(),
    params: {
      temperature: parseFloat($("param-temp").value),
      max_tokens: parseInt($("param-maxtok").value),
      top_p: parseFloat($("param-topp").value)
    }
  });
  localStorage.setItem("pg_saved", JSON.stringify(list));
  loadSaved();
}

function clearHistory() {
  if (!confirm("清空所有已保存测试？")) return;
  localStorage.removeItem("pg_saved");
  loadSaved();
}

// 添加消息
function addMsg(role, content, meta) {
  const wrap = document.createElement("div");
  wrap.className = "pg-msg " + role;
  const roleMap = { user: "你", assistant: "AI", system: "System" };
  let html = '<div class="pg-msg-role">' + roleMap[role] + '</div>';
  html += '<div class="pg-msg-content">' + escapeHtml(content || "") + '</div>';
  if (meta) html += '<div class="pg-msg-meta">' + escapeHtml(meta) + '</div>';
  if (role === "assistant") {
    html += '<div class="msg-actions"><button onclick="copyMsg(this)">📋 复制</button><button onclick="regenMsg(this)">🔄 重新生成</button></div>';
  }
  wrap.innerHTML = html;
  $("messages").appendChild(wrap);
  $("messages").scrollTop = $("messages").scrollHeight;
  return wrap;
}

function copyMsg(btn) {
  const content = btn.parentElement.previousElementSibling.textContent;
  navigator.clipboard.writeText(content).then(() => {
    btn.textContent = "✓ 已复制";
    setTimeout(() => btn.textContent = "📋 复制", 1500);
  });
}

function regenMsg(btn) {
  // 删除最后一条 assistant，重新发
  const msg = btn.closest(".pg-msg");
  if (msg && confirm("重新生成最后一条回复？")) {
    msg.remove();
    conv.pop();
    sendMsg(conv[conv.length - 1]?.content || "");
  }
}

// 发送消息
async function sendMsg(text) {
  const baseUrl = $("cfg-base-url").value.trim();
  const apiKey = $("cfg-api-key").value.trim();
  const model = $("cfg-model").value.trim();
  const protocol = $("cfg-protocol").value;
  const stream = $("param-stream").checked;

  if (!baseUrl || !apiKey || !model) {
    alert("请填 Base URL / API Key / 模型");
    return;
  }

  const systemPrompt = $("param-system").value.trim();
  const messages = [];
  if (systemPrompt) messages.push({ role: "system", content: systemPrompt });
  if (text) messages.push({ role: "user", content: text });

  if (text) {
    addMsg("user", text);
    conv.push({ role: "user", content: text });
  }

  const params = {
    temperature: parseFloat($("param-temp").value),
    max_tokens: parseInt($("param-maxtok").value),
    top_p: parseFloat($("param-topp").value)
  };

  $("btn-send").disabled = true;
  $("btn-send-input").disabled = true;
  $("btn-stop").disabled = false;
  abortCtrl = new AbortController();

  const startTime = Date.now();
  let assistantMsg = null;
  let fullContent = "";
  let totalTokens = null;

  try {
    if (protocol === "openai") {
      const url = baseUrl.replace(/\/$/, "") + "/chat/completions";
      const headers = { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey };

      const resp = await fetch(url, {
        method: "POST",
        headers,
        body: JSON.stringify(Object.assign({ model, messages, stream }, params)),
        signal: abortCtrl.signal
      });

      if (!resp.ok) {
        const errText = await resp.text();
        addMsg("system", "❌ HTTP " + resp.status + ": " + errText.slice(0, 500));
        return;
      }

      if (stream) {
        assistantMsg = addMsg("assistant", "", "");
        const contentEl = assistantMsg.querySelector(".pg-msg-content");
        contentEl.classList.add("streaming-cursor");
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop();
          for (const line of lines) {
            if (line.startsWith("data: ")) {
              const data = line.slice(6).trim();
              if (data === "[DONE]") break;
              try {
                const obj = JSON.parse(data);
                const delta = obj.choices?.[0]?.delta?.content || "";
                if (delta) {
                  fullContent += delta;
                  contentEl.textContent = fullContent;
                  $("messages").scrollTop = $("messages").scrollHeight;
                }
                if (obj.usage) totalTokens = obj.usage.total_tokens;
              } catch (e) {}
            }
          }
        }
        contentEl.classList.remove("streaming-cursor");
      } else {
        const data = await resp.json();
        fullContent = data.choices?.[0]?.message?.content || "(无回复)";
        totalTokens = data.usage?.total_tokens;
        assistantMsg = addMsg("assistant", fullContent);
      }
    } else if (protocol === "anthropic") {
      const url = baseUrl.replace(/\/$/, "") + "/v1/messages";
      const headers = { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" };
      const resp = await fetch(url, {
        method: "POST",
        headers,
        body: JSON.stringify(Object.assign({ model, messages: messages.filter(m => m.role !== "system"), system: systemPrompt || undefined, max_tokens: params.max_tokens }, { temperature: params.temperature, top_p: params.top_p })),
        signal: abortCtrl.signal
      });
      if (!resp.ok) {
        addMsg("system", "❌ HTTP " + resp.status + ": " + (await resp.text()).slice(0, 500));
        return;
      }
      const data = await resp.json();
      fullContent = data.content?.[0]?.text || "(无回复)";
      totalTokens = (data.usage?.input_tokens || 0) + (data.usage?.output_tokens || 0);
      assistantMsg = addMsg("assistant", fullContent);
    }

    const duration = ((Date.now() - startTime) / 1000).toFixed(2);
    let meta = "⚡ " + duration + "s";
    if (totalTokens) meta += " · " + totalTokens + " tokens";
    const metaEl = assistantMsg.querySelector(".pg-msg-meta");
    if (metaEl) metaEl.textContent = meta;

    conv.push({ role: "assistant", content: fullContent });
  } catch (e) {
    if (e.name === "AbortError") {
      addMsg("system", "⏹ 已停止");
    } else {
      addMsg("system", "❌ " + e.message);
    }
  } finally {
    $("btn-send").disabled = false;
    $("btn-send-input").disabled = false;
    $("btn-stop").disabled = true;
    abortCtrl = null;
  }
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", """: "&quot;" })[c]);
}

// 绑定发送
$("btn-send").addEventListener("click", () => {
  const text = $("user-input").value.trim();
  if (!text) return;
  $("user-input").value = "";
  sendMsg(text);
});
$("btn-send-input").addEventListener("click", () => {
  const text = $("user-input").value.trim();
  if (!text) return;
  $("user-input").value = "";
  sendMsg(text);
});
$("user-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const text = $("user-input").value.trim();
    if (!text) return;
    $("user-input").value = "";
    sendMsg(text);
  }
});
$("btn-stop").addEventListener("click", () => {
  if (abortCtrl) abortCtrl.abort();
});

// 对比模式
function initCompare() {
  const c = $("compare-configs");
  c.innerHTML = [0,1,2].map(i =>
    '<div style="background:var(--bg-deep);padding:12px;border-radius:8px;">' +
      '<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">模型 ' + (i+1) + '</div>' +
      '<input type="text" placeholder="Base URL" data-cmp="base_url" data-idx="' + i + '" style="margin-bottom:6px;">' +
      '<input type="password" placeholder="API Key" data-cmp="api_key" data-idx="' + i + '" style="margin-bottom:6px;">' +
      '<input type="text" placeholder="模型名" data-cmp="model" data-idx="' + i + '">' +
    '</div>'
  ).join("");
  // 自动从单模型模式填第一组
  c.querySelectorAll("input").forEach(inp => {
    inp.style.cssText = "padding:8px;background:var(--bg-deep);border:1px solid var(--border);border-radius:6px;color:var(--fg);font-size:12px;width:100%;box-sizing:border-box;";
  });
}

async function runCompare() {
  const prompt = $("compare-prompt").value.trim();
  if (!prompt) { alert("请填对比 prompt"); return; }
  const configs = [0,1,2].map(i => ({
    base_url: document.querySelector('[data-cmp="base_url"][data-idx="' + i + '"]').value.trim(),
    api_key: document.querySelector('[data-cmp="api_key"][data-idx="' + i + '"]').value.trim(),
    model: document.querySelector('[data-cmp="model"][data-idx="' + i + '"]').value.trim()
  }));

  $("compare-results").innerHTML = configs.map((c, i) =>
    '<div class="card glass-strong pg-compare-col">' +
      '<h4>' + (c.model || "模型 " + (i+1)) + '</h4>' +
      '<div id="cmp-' + i + '" class="muted" style="font-size:12px;">请求中...</div>' +
    '</div>'
  ).join("");

  await Promise.all(configs.map((cfg, i) => callCompare(cfg, prompt, "cmp-" + i)));
}

async function callCompare(cfg, prompt, targetId) {
  if (!cfg.base_url || !cfg.api_key || !cfg.model) {
    document.getElementById(targetId).innerHTML = '<em class="muted">未填配置</em>';
    return;
  }
  try {
    const start = Date.now();
    const resp = await fetch(cfg.base_url.replace(/\/$/, "") + "/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.api_key },
      body: JSON.stringify({ model: cfg.model, messages: [{ role: "user", content: prompt }], max_tokens: 1024 })
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    const content = data.choices?.[0]?.message?.content || "(无回复)";
    const tokens = data.usage?.total_tokens;
    const dur = ((Date.now() - start) / 1000).toFixed(2);
    document.getElementById(targetId).innerHTML = '<div style="white-space:pre-wrap;font-size:13px;line-height:1.6;">' + escapeHtml(content) + '</div>' +
      '<div class="muted" style="margin-top:12px;font-size:11px;">⚡ ' + dur + 's' + (tokens ? ' · ' + tokens + ' tokens' : '') + '</div>';
  } catch (e) {
    document.getElementById(targetId).innerHTML = '<em class="muted">❌ ' + e.message + '</em>';
  }
}

loadSaved();
initCompare();
</script>
</body>
