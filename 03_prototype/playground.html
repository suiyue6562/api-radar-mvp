<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 真伪检测 - API优选咨询</title>
<meta name="description" content="给你的 API 渠道做体检。验证可达性、鉴权、模型真实性、性能指标。防骗、防伪、防降智。">
<link rel="stylesheet" href="style.css">
<style>
.ap-hero { padding: 32px 0 16px; text-align: center; }
.ap-hero h1 { font-size: 36px; margin-bottom: 8px; }
.ap-hero .gradient-text { background: var(--grad-primary); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.ap-hero p { color: var(--muted); font-size: 14px; max-width: 600px; margin: 0 auto; }

/* 输入面板 */
.ap-input-card { padding: 20px; max-width: 720px; margin: 0 auto; }
.ap-input-card label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.05em; margin-top: 12px; }
.ap-input-card label:first-child { margin-top: 0; }
.ap-input-card input { width: 100%; padding: 10px 14px; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 8px; color: var(--fg); font-size: 14px; font-family: var(--font-mono); }
.ap-input-card input:focus { outline: none; border-color: var(--accent); }

/* 测试项 checklist */
.ap-checks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
.ap-check { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg-deep); border-radius: 6px; font-size: 13px; }
.ap-check input[type=checkbox] { width: auto; }

/* 按钮 */
.ap-start-btn { width: 100%; padding: 14px; font-size: 16px; margin-top: 16px; font-weight: 700; }

/* 进度 */
.ap-progress { display: none; padding: 24px; max-width: 720px; margin: 16px auto; }
.ap-progress.show { display: block; }
.ap-step { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid var(--border); }
.ap-step:last-child { border-bottom: 0; }
.ap-step-icon { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.ap-step-icon.pending { background: var(--bg-deep); color: var(--muted); border: 1px solid var(--border); }
.ap-step-icon.running { background: rgba(0,217,255,0.2); color: var(--accent); animation: pulse 1.5s infinite; }
.ap-step-icon.ok { background: rgba(34,197,94,0.2); color: #22c55e; }
.ap-step-icon.warn { background: rgba(255,184,77,0.2); color: #ffb84d; }
.ap-step-icon.fail { background: rgba(255,71,87,0.2); color: #ff4757; }
.ap-step-name { flex: 1; font-size: 14px; }
.ap-step-result { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
@keyframes pulse { 50% { opacity: 0.5; } }

/* 报告 */
.ap-report { display: none; max-width: 720px; margin: 16px auto; }
.ap-report.show { display: block; }

.ap-score { text-align: center; padding: 32px; background: var(--grad-glow); border: 1px solid var(--border-strong); border-radius: 14px; margin-bottom: 16px; }
.ap-score-num { font-family: var(--font-mono); font-size: 64px; font-weight: 800; background: var(--grad-primary); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
.ap-score-label { color: var(--muted); font-size: 12px; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
.ap-score-verdict { margin-top: 16px; font-size: 18px; font-weight: 700; }

/* 详情项 */
.ap-section { padding: 20px; margin-bottom: 12px; }
.ap-section h3 { margin: 0 0 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.ap-section h3 .icon { width: 24px; height: 24px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
.ap-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
.ap-row:last-child { border-bottom: 0; }
.ap-row .key { color: var(--muted); }
.ap-row .val { font-family: var(--font-mono); font-weight: 600; }
.ap-row .val.ok { color: #22c55e; }
.ap-row .val.warn { color: #ffb84d; }
.ap-row .val.fail { color: #ff4757; }

/* 警告 */
.ap-warning { background: rgba(255,184,77,0.08); border: 1px solid rgba(255,184,77,0.3); border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
.ap-warning strong { color: #ffb84d; }

.ap-danger { background: rgba(255,71,87,0.08); border: 1px solid rgba(255,71,87,0.3); border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
.ap-danger strong { color: #ff4757; }

/* 隐私提示 */
.ap-privacy { background: rgba(0,217,255,0.06); border: 1px solid rgba(0,217,255,0.2); border-radius: 8px; padding: 12px; font-size: 12px; color: var(--muted); margin-top: 16px; }

/* Tab */
.ap-tabs { display: flex; gap: 4px; padding: 4px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; margin: 24px auto; width: fit-content; }
.ap-tabs button { background: transparent; color: var(--muted); padding: 8px 16px; font-size: 13px; }
.ap-tabs button.active { background: var(--grad-primary); color: #001428; font-weight: 700; }

@media (max-width: 600px) {
  .ap-checks { grid-template-columns: 1fr; }
  .ap-score-num { font-size: 48px; }
}
</style>
</head>
<body>
<div id="topbar"></div>

<main class="main" style="max-width: 800px;">
  <div class="ap-hero fade-in">
    <div class="page-hero-tagline"><span class="page-hero-tagline-dot"></span><span>浏览器直跑 · Key 不上传</span></div>
    <h1><span class="gradient-text">🔍 API 真伪检测</span></h1>
    <p>给你的 API 渠道做体检：验证可达性、鉴权、模型真实性、性能指标。<br>防骗、防伪、防降智、防充值到假渠道。</p>
  </div>

  <div class="ap-tabs">
    <button class="active" data-mode="full">深度体检（30 秒）</button>
    <button data-mode="quick">快速检测（5 秒）</button>
  </div>

  <!-- 输入 -->
  <div class="card glass-strong ap-input-card" id="input-card">
    <label>Base URL</label>
    <input type="text" id="in-url" placeholder="https://api.example.com/v1">

    <label>API Key</label>
    <input type="password" id="in-key" placeholder="sk-...">

    <label>声称模型名（渠道说支持哪个模型）</label>
    <input type="text" id="in-model" placeholder="如：gpt-4, claude-sonnet-5, deepseek-chat">

    <label>声称协议</label>
    <select id="in-protocol" style="width:100%;padding:10px;background:var(--bg-deep);border:1px solid var(--border);border-radius:8px;color:var(--fg);font-size:14px;">
      <option value="openai">OpenAI 兼容</option>
      <option value="anthropic">Anthropic 兼容</option>
    </select>

    <label style="margin-top:16px;">检测项</label>
    <div class="ap-checks">
      <label class="ap-check"><input type="checkbox" id="chk-reachable" checked> 可达性 + TLS</label>
      <label class="ap-check"><input type="checkbox" id="chk-auth" checked> 鉴权有效性</label>
      <label class="ap-check"><input type="checkbox" id="chk-model" checked> <b>模型指纹 (v2)</b> - 5 个标准答案探测 + 延迟指纹</label>
      <label class="ap-check"><input type="checkbox" id="chk-rate" checked> 速率限制 (5/10/20 并发探测)</label>
      <label class="ap-check"><input type="checkbox" id="chk-price"> 价格真实性（输入声称价格后启用）</label>
      <label class="ap-check"><input type="checkbox" id="chk-perf" checked> 性能 + Token</label>
      <label class="ap-check"><input type="checkbox" id="chk-stream" checked> 流式响应</label>
      <label class="ap-check"><input type="checkbox" id="chk-cors" checked> CORS 浏览器直跑</label>
      <label class="ap-check"><input type="checkbox" id="chk-fakestream" checked> <b>假流式识别 (v3)</b> - chunk 大小分布</label>
      <label class="ap-check"><input type="checkbox" id="chk-tls" checked> TLS 证书深度 (v3) - HSTS / 签名</label>
      <label class="ap-check"><input type="checkbox" id="chk-redirect" checked> HTTP→HTTPS 重定向 (v3)</label>
      <label class="ap-check"><input type="checkbox" id="chk-headers" checked> 响应头合规 (v3) - CORS/限流/RequestID</label>
      <label class="ap-check"><input type="checkbox" id="chk-stability" checked> 时间稳定性 (v3) - 3 次采样 + 标准差</label>
    </div>

    <div id="price-input" style="margin-top:12px;display:none;padding:12px;background:var(--bg-deep);border-radius:8px;">
      <label style="font-size:11px;color:var(--muted);">声称输入价 (USD / 1M tokens)</label>
      <input type="number" id="claimed-input-price" step="any" placeholder="例：3.0" style="margin-bottom:8px;">
      <label style="font-size:11px;color:var(--muted);">声称输出价 (USD / 1M tokens)</label>
      <input type="number" id="claimed-output-price" step="any" placeholder="例：15.0">
    </div>

    <button class="ap-start-btn" id="start-btn">▶ 开始体检</button>

    <div class="ap-privacy">
      🔒 <strong style="color:var(--accent);">隐私保护：</strong>所有检测在浏览器内完成。API Key <strong>不会上传</strong>到我们的服务器，直接由你的浏览器发请求到目标 URL。
    </div>
  </div>

  <!-- 进度 -->
  <div class="card glass-strong ap-progress" id="progress-card">
    <h3 style="margin:0 0 16px;font-size:16px;">🔬 体检进行中</h3>
    <div id="steps-container"></div>
  </div>

  <!-- 报告 -->
  <div class="ap-report" id="report-card">
    <div class="ap-score">
      <div class="ap-score-num" id="score-num">--</div>
      <div class="ap-score-label">综合评分（10 分制）</div>
      <div class="ap-score-verdict" id="score-verdict">--</div>
    </div>

    <div id="warnings-container"></div>

    <div class="card glass-strong ap-section">
      <h3><span class="icon" style="background:rgba(0,217,255,0.15);color:#00d9ff;">🌐</span>可达性</h3>
      <div id="r-reachable"></div>
    </div>

    <div class="card glass-strong ap-section">
      <h3><span class="icon" style="background:rgba(176,107,255,0.15);color:#b066ff;">🔐</span>鉴权</h3>
      <div id="r-auth"></div>
    </div>

    <div class="card glass-strong ap-section">
      <h3><span class="icon" style="background:rgba(255,107,157,0.15);color:#ff6b9d;">🤖</span>模型真实性</h3>
      <div id="r-model"></div>
    </div>

    <div class="card glass-strong ap-section">
      <h3><span class="icon" style="background:rgba(34,197,94,0.15);color:#22c55e;">⚡</span>性能</h3>
      <div id="r-perf"></div>
    </div>

    <div class="card glass-strong ap-section" id="r-stream-section" style="display:none;">
      <h3><span class="icon" style="background:rgba(0,217,255,0.15);color:#00d9ff;">📡</span>流式</h3>
      <div id="r-stream"></div>
    </div>

    <div class="card glass-strong ap-section" id="r-cors-section" style="display:none;">
      <h3><span class="icon" style="background:rgba(255,184,77,0.15);color:#ffb84d;">🔗</span>CORS</h3>
      <div id="r-cors"></div>
    </div>

    <div class="card glass-strong ap-section" id="r-fakestream-section" style="display:none;">
      <h3><span class="icon" style="background:rgba(255,107,157,0.15);color:#ff6b9d;">🎭</span>假流式识别</h3>
      <div id="r-fakestream"></div>
    </div>

    <div class="card glass-strong ap-section" id="r-tls-section" style="display:none;">
      <h3><span class="icon" style="background:rgba(0,255,163,0.15);color:#00ffa3;">🔒</span>TLS 证书深度</h3>
      <div id="r-tls"></div>
    </div>

    <div class="card glass-strong ap-section" id="r-redirect-section" style="display:none;">
      <h3><span class="icon" style="background:rgba(176,107,255,0.15);color:#b066ff;">↪️</span>HTTPS 重定向</h3>
      <div id="r-redirect"></div>
    </div>

    <div class="card glass-strong ap-section" id="r-headers-section" style="display:none;">
      <h3><span class="icon" style="background:rgba(0,217,255,0.15);color:#00d9ff;">📋</span>响应头合规</h3>
      <div id="r-headers"></div>
    </div>

    <div class="card glass-strong ap-section" id="r-stability-section" style="display:none;">
      <h3><span class="icon" style="background:rgba(34,197,94,0.15);color:#22c55e;">📊</span>时间稳定性</h3>
      <div id="r-stability"></div>
    </div>

    <div style="text-align:center;margin-top:24px;">
      <button onclick="location.reload()" class="secondary">重新检测另一个</button>
      <a href="compare.html" class="btn btn-ghost" style="text-decoration:none;margin-left:8px;">去看更便宜的渠道 →</a>
    </div>
  </div>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="probes.js"></script>
<script>
if (typeof renderTopbar === "function") renderTopbar("playground");

const $ = (id) => document.getElementById(id);

const STEPS = {
  reachable: { name: "可达性 + TLS", icon: "🌐" },
  auth: { name: "鉴权有效性", icon: "🔐" },
  model: { name: "模型指纹 v2", icon: "🤖" },
  rate: { name: "速率限制探测", icon: "⚡" },
  price: { name: "价格真实性", icon: "💰" },
  perf: { name: "性能 + Token", icon: "⏱️" },
  stream: { name: "流式响应", icon: "📡" },
  cors: { name: "CORS 浏览器直跑", icon: "🔗" },
  fakestream: { name: "假流式识别 v3", icon: "🎭" },
  tls: { name: "TLS 证书 v3", icon: "🔒" },
  redirect: { name: "HTTPS 重定向 v3", icon: "↪️" },
  headers: { name: "响应头合规 v3", icon: "📋" },
  stability: { name: "时间稳定性 v3", icon: "📊" }
};

const state = { checks: {}, results: {}, url: "", key: "", model: "", protocol: "openai" };
let abortCtrl = null;

document.querySelectorAll(".ap-tabs button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".ap-tabs button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    const quick = b.dataset.mode === "quick";
    ["chk-perf","chk-stream","chk-cors"].forEach(id => $(id).checked = !quick);
  });
});

function addStep(id) {
  const wrap = document.createElement("div");
  wrap.className = "ap-step";
  wrap.id = "step-" + id;
  wrap.innerHTML = `
    <div class="ap-step-icon pending" id="step-icon-${id}">⏳</div>
    <div class="ap-step-name">${STEPS[id].icon} ${STEPS[id].name}</div>
    <div class="ap-step-result" id="step-result-${id}">等待</div>
  `;
  $("steps-container").appendChild(wrap);
}

function setStep(id, status, resultText) {
  const icon = $(`step-icon-${id}`);
  const result = $(`step-result-${id}`);
  const statusMap = {
    pending: ["⏳", "pending", "等待"],
    running: ["⏳", "running", "检测中..."],
    ok: ["✅", "ok", resultText || "通过"],
    warn: ["⚠️", "warn", resultText || "警告"],
    fail: ["❌", "fail", resultText || "失败"]
  };
  const [emoji, cls, txt] = statusMap[status] || statusMap.pending;
  icon.className = "ap-step-icon " + cls;
  icon.textContent = emoji;
  result.textContent = txt;
}

function renderRow(parentId, rows) {
  const el = $(parentId);
  el.innerHTML = rows.map(r => {
    const cls = r.status || "";
    return `<div class="ap-row"><span class="key">${r.key}</span><span class="val ${cls}">${r.val}</span></div>`;
  }).join("");
}

function addWarning(type, msg) {
  const wrap = document.createElement("div");
  wrap.className = type === "danger" ? "ap-danger" : "ap-warning";
  wrap.innerHTML = type === "danger" ? `<strong>🚨 高风险：</strong>${msg}` : `<strong>⚠️ 注意：</strong>${msg}`;
  $("warnings-container").appendChild(wrap);
}

function calcScore() {
  let s = 10;
  Object.values(state.results).forEach(r => {
    if (r.status === "fail") s -= 3;
    else if (r.status === "warn") s -= 1;
  });
  return Math.max(0, Math.min(10, s));
}

function verdict(score) {
  if (score >= 9) return { text: "✅ 真品，可以放心用", color: "#22c55e" };
  if (score >= 7) return { text: "🟢 基本可信，建议先用小金额", color: "#00d9ff" };
  if (score >= 5) return { text: "⚠️ 有风险，建议先小金额测试", color: "#ffb84d" };
  if (score >= 3) return { text: "🚨 高风险，建议立即停止", color: "#ff6b9d" };
  return { text: "❌ 大概率是假渠道/假 API", color: "#ff4757" };
}

async function start() {
  state.url = $("in-url").value.trim().replace(/\/$/, "");
  state.key = $("in-key").value.trim();
  state.model = $("in-model").value.trim();
  state.protocol = $("in-protocol").value;
  if (!state.url || !state.key || !state.model) { alert("请填完整：基础地址、API 密钥、模型名"); return; }

  state.checks = {
    reachable: $("chk-reachable").checked,
    auth: $("chk-auth").checked,
    model: $("chk-model").checked,
    rate: $("chk-rate").checked,
    price: $("chk-price").checked,
    perf: $("chk-perf").checked,
    stream: $("chk-stream").checked,
    cors: $("chk-cors").checked,
    fakestream: $("chk-fakestream").checked,
    tls: $("chk-tls").checked,
    redirect: $("chk-redirect").checked,
    headers: $("chk-headers").checked,
    stability: $("chk-stability").checked
  };

  $("input-card").style.display = "none";
  $("progress-card").classList.add("show");
  $("steps-container").innerHTML = "";
  Object.keys(STEPS).forEach(id => { if (state.checks[id]) addStep(id); });

  // 顺序执行
  if (state.checks.reachable) await checkReachable();
  if (state.checks.auth) await checkAuth();
  if (state.checks.model) await checkModel();
  if (state.checks.rate) await checkRate();
  if (state.checks.price) await checkPrice();
  if (state.checks.perf) await checkPerf();
  if (state.checks.stream) await checkStream();
  if (state.checks.cors) await checkCORS();
  if (state.checks.fakestream) await checkFakeStream();
  if (state.checks.tls) await checkTLSDeep();
  if (state.checks.redirect) await checkHttpsRedirect();
  if (state.checks.headers) await checkResponseHeaders();
  if (state.checks.stability) await checkStability();

  showReport();
}

// ============ 检查 1：可达性 ============
async function checkReachable() {
  setStep("reachable", "running");
  try {
    const t0 = Date.now();
    const resp = await fetch(state.url.replace(/\/v1$/, "") + "/models", {
      method: "GET",
      headers: { "Authorization": "Bearer " + state.key },
      signal: AbortSignal.timeout(10000)
    }).catch(() => null);
    const latency = Date.now() - t0;
    const reachable = resp !== null;
    const tls = location.protocol === "https:";
    state.results.reachable = {
      status: reachable ? "ok" : "fail",
      latency,
      statusCode: resp ? resp.status : null,
      tls
    };
    setStep("reachable", state.results.reachable.status, reachable ? `${latency}ms` : "连接失败");
    renderRow("r-reachable", [
      { key: "URL 可达", val: reachable ? "✅ 是" : "❌ 否", status: reachable ? "ok" : "fail" },
      { key: "HTTPS", val: tls ? "✅ 是" : "❌ 否", status: tls ? "ok" : "fail" },
      { key: "响应延迟", val: latency + "ms", status: latency > 3000 ? "warn" : "ok" },
      { key: "HTTP 状态", val: resp ? resp.status : "N/A", status: resp && resp.status < 400 ? "ok" : "fail" }
    ]);
    if (!reachable) addWarning("danger", "无法连接到目标 URL。这可能是：URL 拼错 / 域名挂了 / 被防火墙屏蔽。");
    else if (latency > 3000) addWarning("warning", "响应延迟较高（" + latency + "ms），用户体验会受影响。");
  } catch (e) {
    state.results.reachable = { status: "fail", error: e.message };
    setStep("reachable", "fail", e.message);
    renderRow("r-reachable", [{ key: "URL 可达", val: "❌ 否", status: "fail" }, { key: "错误", val: e.message, status: "fail" }]);
    addWarning("danger", "连接错误：" + e.message);
  }
}

// ============ 检查 2：鉴权 ============
async function checkAuth() {
  setStep("auth", "running");
  try {
    const url = state.protocol === "openai"
      ? state.url + "/chat/completions"
      : state.url + "/v1/messages";
    const headers = state.protocol === "openai"
      ? { "Content-Type": "application/json", "Authorization": "Bearer " + state.key }
      : { "Content-Type": "application/json", "x-api-key": state.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" };
    const body = state.protocol === "openai"
      ? JSON.stringify({ model: state.model, messages: [{ role: "user", content: "hi" }], max_tokens: 5 })
      : JSON.stringify({ model: state.model, messages: [{ role: "user", content: "hi" }], max_tokens: 5 });

    const resp = await fetch(url, { method: "POST", headers, body, signal: AbortSignal.timeout(15000) });
    const data = await resp.json().catch(() => ({}));

    let authOk = false, status = "fail", label = "鉴权失败";
    if (resp.status === 200) { authOk = true; status = "ok"; label = "鉴权通过"; }
    else if (resp.status === 401 || resp.status === 403) { status = "fail"; label = "Key 无效或过期"; }
    else if (resp.status === 404) { status = "fail"; label = "模型不存在或路径错"; }
    else if (resp.status === 429) { status = "warn"; label = "限流（Key 可能是好的）"; }
    else if (resp.status >= 500) { status = "warn"; label = "服务端错误"; }

    state.results.auth = { status, code: resp.status, body: data };
    setStep("auth", status, label);

    const errMsg = data?.error?.message || data?.message || "";
    renderRow("r-auth", [
      { key: "HTTP 状态", val: resp.status, status: status },
      { key: "鉴权结果", val: authOk ? "✅ 通过" : "❌ 失败", status: status },
      { key: "响应内容", val: authOk ? "(成功)" : errMsg.slice(0, 80), status: authOk ? "ok" : "fail" }
    ]);
    if (!authOk && resp.status === 401) addWarning("danger", "API Key 无效。可能原因：key 拼错 / 渠道挂了 / 充值被清零。");
    if (resp.status === 404) addWarning("danger", "模型 " + state.model + " 不存在或路径错误。这是**最常见的假渠道迹象**：假 API 会乱编模型名。");
  } catch (e) {
    state.results.auth = { status: "fail", error: e.message };
    setStep("auth", "fail", e.message);
    renderRow("r-auth", [{ key: "鉴权结果", val: "❌ 请求失败", status: "fail" }, { key: "错误", val: e.message, status: "fail" }]);
  }
}

// ============ 检查 3：模型真实性 v2 (deepCheck) ============
async function checkModel() {
  setStep("model", "running");
  try {
    const deep = await RADAR_PROBES.deepCheck(
      state.url, state.key, state.model, state.protocol,
      (id, status, text) => setStep(id, status, text)
    );

    if (deep.fatal) {
      state.results.model = { status: "fail", error: deep.error };
      setStep("model", "fail", deep.error);
      addWarning("danger", "模型探测失败：" + deep.error);
      return;
    }

    // 综合状态
    let status = "ok";
    if (deep.score >= 80) status = "ok";
    else if (deep.score >= 50) status = "warn";
    else status = "fail";

    state.results.model = { status, score: deep.score, deep };
    setStep("model", status, `得分 ${deep.score}/100`);

    // 渲染报告
    const rows = [
      { key: "综合得分", val: deep.score + "/100", status: deep.score >= 80 ? "ok" : (deep.score >= 50 ? "warn" : "fail") },
      { key: "答案正确率", val: deep.passRate + "% (" + deep.passWeight + "/" + deep.totalWeight + " 权重)", status: deep.passRate >= 80 ? "ok" : (deep.passRate >= 50 ? "warn" : "fail") },
      { key: "平均延迟", val: deep.avgLatency + "ms", status: deep.avgLatency > 8000 ? "warn" : "ok" },
      { key: "指纹匹配", val: deep.fp ? deep.fp.label : "未知模型", status: deep.fp ? "ok" : "warn" },
      { key: "延迟指纹", val: deep.fpVerdict, status: deep.fpDetails.includes("符合") ? "ok" : (deep.fpDetails ? "warn" : "ok") }
    ];
    deep.results.forEach((r, i) => {
      rows.push({
        key: "探测 " + (i + 1) + ": " + r.probe,
        val: r.pass ? "✅ " + (r.content ? r.content.slice(0, 30) : "通过") : "❌ " + r.reason,
        status: r.pass ? "ok" : "fail"
      });
    });
    renderRow("r-model", rows);

    if (deep.score < 50) {
      addWarning("danger", "模型真实性得分仅 " + deep.score + "/100 - 该渠道极大概率不是真实 " + state.model);
    } else if (deep.score < 80) {
      addWarning("warning", "模型真实性得分 " + deep.score + "/100 - 部分探测失败，可能是限流或模型被替换");
    }
    if (deep.fpDetails && !deep.fpDetails.includes("符合")) {
      addWarning("warning", deep.fpDetails);
    }
  } catch (e) {
    state.results.model = { status: "fail", error: e.message };
    setStep("model", "fail", e.message);
    addWarning("danger", "模型检查异常：" + e.message);
  }
}

// ============ 检查 4：性能 ============
async function checkPerf() {
  setStep("perf", "running");
  try {
    const probe = { model: state.model, messages: [{ role: "user", content: "Say OK" }], max_tokens: 5 };
    const url = state.url + "/chat/completions";
    const headers = { "Content-Type": "application/json", "Authorization": "Bearer " + state.key };

    const t0 = Date.now();
    const resp = await fetch(url, { method: "POST", headers, body: JSON.stringify(probe), signal: AbortSignal.timeout(15000) });
    const data = await resp.json().catch(() => ({}));
    const latency = Date.now() - t0;

    // 取 token 计费
    const usage = data?.usage || {};
    const tokens = usage.total_tokens || (usage.input_tokens + usage.output_tokens) || 0;

    state.results.perf = { status: "ok", latency, tokens, usage };
    setStep("perf", "ok", latency + "ms · " + tokens + " tokens");

    const speedLabel = latency < 1500 ? "快" : latency < 5000 ? "中" : "慢";
    renderRow("r-perf", [
      { key: "响应延迟", val: latency + "ms (" + speedLabel + ")", status: latency < 5000 ? "ok" : "warn" },
      { key: "消耗 tokens", val: tokens, status: "ok" },
      { key: "输入 Tokens", val: usage.prompt_tokens || usage.input_tokens || 0, status: "ok" },
      { key: "输出 Tokens", val: usage.completion_tokens || usage.output_tokens || 0, status: "ok" }
    ]);
  } catch (e) {
    state.results.perf = { status: "fail", error: e.message };
    setStep("perf", "fail", e.message);
  }
}



// ============ 检查 5.5：假流式识别 v3 ============
async function checkFakeStream() {
  setStep("fakestream", "running");
  try {
    const r = await RADAR_V3.detectFakeStream(state.url, state.key, state.model);
    if (r.error) {
      setStep("fakestream", "fail", r.error);
      addWarning("danger", "流式测试失败：" + r.error);
      return;
    }
    state.results.fakestream = r;
    setStep("fakestream", r.status, r.numChunks + " chunks, 最大/总=" + r.fakeStreamScore + "%");
    if (r.status === "fail") addWarning("danger", "⚠️ 假流式！声称流式但只有 " + r.numChunks + " 个 chunk，最大块占 " + r.fakeStreamScore + "% - 这不是真正的 SSE");
    document.getElementById("r-fakestream-section").style.display = "block";
    renderRow("r-fakestream", [
      { key: "chunk 数量", val: r.numChunks + " 个", status: r.numChunks > 3 ? "ok" : "fail" },
      { key: "总字节", val: r.totalBytes + " B", status: "ok" },
      { key: "首 chunk 大小", val: r.firstChunkSize + " B", status: r.firstChunkSize < r.totalBytes / 2 ? "ok" : "warn" },
      { key: "最大 chunk", val: r.maxChunkSize + " B", status: r.maxChunkSize < r.totalBytes * 0.8 ? "ok" : "fail" },
      { key: "平均 chunk", val: r.avgChunkSize + " B", status: "ok" },
      { key: "假流式评分", val: r.fakeStreamScore + "%", status: r.fakeStreamScore > 80 ? "fail" : "ok" }
    ]);
  } catch (e) {
    setStep("fakestream", "fail", e.message);
    addWarning("danger", "假流式检测异常：" + e.message);
  }
}

// ============ 检查 5.6：TLS 证书深度 v3 ============
async function checkTLSDeep() {
  setStep("tls", "running");
  try {
    const r = await RADAR_V3.tlsDeepCheck(state.url);
    if (r.error) { setStep("tls", "fail", r.error); return; }
    state.results.tls = r;
    setStep("tls", r.status, r.issues.length === 0 ? "全部合规" : r.issues.length + " 个问题");
    document.getElementById("r-tls-section").style.display = "block";
    const rows = [
      { key: "HTTPS", val: r.isHttps ? "✓ 是" : "❌ 否", status: r.isHttps ? "ok" : "fail" },
      { key: "HSTS", val: r.hasHSTS ? "✓ 启用" : "❌ 未启用", status: r.hasHSTS ? "ok" : "fail" },
      { key: "Server 标识", val: r.server || "✓ 未暴露", status: r.server ? "warn" : "ok" },
      { key: "X-Powered-By", val: r.xPoweredBy || "✓ 未暴露", status: r.xPoweredBy ? "warn" : "ok" }
    ];
    renderRow("r-tls", rows);
    r.issues.forEach(iss => addWarning("warning", "TLS 问题：" + iss));
  } catch (e) { setStep("tls", "fail", e.message); }
}

// ============ 检查 5.7：HTTPS 重定向 v3 ============
async function checkHttpsRedirect() {
  setStep("redirect", "running");
  try {
    const r = await RADAR_V3.httpsRedirectCheck(state.url);
    if (r.error) { setStep("redirect", "warn", r.error); }
    else {
      setStep("redirect", r.status, r.message);
      state.results.redirect = r;
      document.getElementById("r-redirect-section").style.display = "block";
      renderRow("r-redirect", [
        { key: "HTTP 状态", val: r.httpStatus || "N/A", status: r.httpStatus === 301 || r.httpStatus === 308 ? "ok" : "warn" },
        { key: "是否重定向", val: r.redirects ? "✓ 是" : "❌ 否", status: r.redirects ? "ok" : "warn" },
        { key: "重定向到 HTTPS", val: r.redirectsToHttps ? "✓ 是" : "❌ 否", status: r.redirectsToHttps ? "ok" : "fail" }
      ]);
      if (!r.redirectsToHttps && r.redirects) addWarning("warning", "HTTP 不强制重定向到 HTTPS - 中间人攻击风险");
    }
  } catch (e) { setStep("redirect", "fail", e.message); }
}

// ============ 检查 5.8：响应头合规 v3 ============
async function checkResponseHeaders() {
  setStep("headers", "running");
  try {
    const r = await RADAR_V3.responseHeadersCheck(state.url, state.key, state.model);
    if (r.error) { setStep("headers", "fail", r.error); return; }
    setStep("headers", r.status, r.checks.filter(c => c.status === "fail").length === 0 ? "合规" : "有问题");
    state.results.headers = r;
    document.getElementById("r-headers-section").style.display = "block";
    renderRow("r-headers", r.checks);
  } catch (e) { setStep("headers", "fail", e.message); }
}

// ============ 检查 5.9：时间稳定性 v3 ============
async function checkStability() {
  setStep("stability", "running");
  try {
    const r = await RADAR_V3.stabilityCheck(state.url, state.key, state.model);
    if (r.error) { setStep("stability", "fail", r.error); return; }
    setStep("stability", r.status, "平均 " + r.avg + "ms, CV=" + r.cv);
    state.results.stability = r;
    document.getElementById("r-stability-section").style.display = "block";
    renderRow("r-stability", [
      { key: "样本数", val: r.samples.length + " 次", status: "ok" },
      { key: "平均延迟", val: r.avg + "ms", status: "ok" },
      { key: "标准差", val: r.std + "ms", status: r.std < r.avg * 0.3 ? "ok" : "warn" },
      { key: "变异系数 (CV)", val: r.cv, status: r.cv === "fail" ? "fail" : (r.cv === "warn" ? "warn" : "ok") }
    ]);
    if (r.status === "warn") addWarning("warning", "稳定性 " + r.cv + " - " + r.message);
  } catch (e) { setStep("stability", "fail", e.message); }
}

// ============ 检查 3.5：速率限制探测 ============
async function checkRate() {
  setStep("rate", "running");
  try {
    const result = await RADAR_PROBES.rateLimitCheck(state.url, state.key, state.model, state.protocol);
    state.results.rate = { status: "ok", result };
    const total = Object.values(result).map(r => r.rate).reduce((a, b) => a + b, 0) / 3;
    setStep("rate", total >= 80 ? "ok" : (total >= 50 ? "warn" : "fail"), `并发测试均通过 ${Math.round(total)}%`);
    
    const rows = Object.entries(result).map(([k, v]) => ({
      key: "并发 " + k.slice(1) + " 请求",
      val: v.ok + "/" + v.total + " 通过 (" + v.rate + "%)" + (v.rateLimited ? " | " + v.rateLimited + " 限流" : ""),
      status: v.rate >= 80 ? "ok" : (v.rate >= 50 ? "warn" : "fail")
    }));
    renderRow("r-rate", rows);
    
    if (total < 50) addWarning("danger", "速率限制触发严重 - 并发 " + (Object.keys(result).join("/")) + " 中大部分失败");
    else if (total < 80) addWarning("warning", "速率限制较严 - 高并发可能触发 429");
  } catch (e) {
    state.results.rate = { status: "fail", error: e.message };
    setStep("rate", "fail", e.message);
  }
}

// ============ 检查 3.6：价格真实性 ============
async function checkPrice() {
  setStep("price", "running");
  try {
    const inp = parseFloat($("claimed-input-price").value);
    const out = parseFloat($("claimed-output-price").value);
    if (!inp || !out) {
      setStep("price", "warn", "未填声称价格，跳过");
      state.results.price = { status: "warn", skipped: true };
      return;
    }
    const r = await RADAR_PROBES.priceVerify(state.url, state.key, state.model, state.protocol, inp, out);
    state.results.price = { status: "ok", r };
    setStep("price", "ok", "已验证");
    renderRow("r-price", [
      { key: "声称输入价", val: "$" + inp + "/M tokens", status: "ok" },
      { key: "声称输出价", val: "$" + out + "/M tokens", status: "ok" },
      { key: "实际 input tokens", val: r.inputTokens || "N/A", status: "ok" },
      { key: "实际 output tokens", val: r.outputTokens || "N/A", status: "ok" },
      { key: "实际成本", val: "$" + (r.costUsd || "0") + " USD", status: "ok" }
    ]);
  } catch (e) {
    state.results.price = { status: "fail", error: e.message };
    setStep("price", "fail", e.message);
  }
}

// ============ 检查 5：流式 ============
async function checkStream() {
  setStep("stream", "running");
  try {
    const url = state.url + "/chat/completions";
    const headers = { "Content-Type": "application/json", "Authorization": "Bearer " + state.key };
    const body = JSON.stringify({ model: state.model, messages: [{ role: "user", content: "Hi" }], max_tokens: 10, stream: true });
    const t0 = Date.now();
    const resp = await fetch(url, { method: "POST", headers, body, signal: AbortSignal.timeout(15000) });
    const reader = resp.body.getReader();
    let firstChunkTime = null;
    let chunks = 0;
    let totalBytes = 0;
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      if (firstChunkTime === null) firstChunkTime = Date.now();
      chunks++;
      totalBytes += value.length;
      decoder.decode(value);
    }
    const totalTime = Date.now() - t0;
    const ttft = firstChunkTime ? firstChunkTime - t0 : totalTime;
    state.results.stream = { status: "ok", chunks, ttft, totalTime, totalBytes };
    setStep("stream", "ok", chunks + " chunks, TTFT " + ttft + "ms");
    $("r-stream-section").style.display = "block";
    renderRow("r-stream", [
      { key: "流式 chunks", val: chunks, status: chunks > 1 ? "ok" : "fail" },
      { key: "首 token 延迟", val: ttft + "ms", status: ttft < 1000 ? "ok" : "warn" },
      { key: "总耗时", val: totalTime + "ms", status: "ok" },
      { key: "返回字节", val: totalBytes + "B", status: "ok" }
    ]);
    if (chunks <= 1) addWarning("warning", "声称支持流式但只收到 1 个 chunk。可能不支持流式。");
  } catch (e) {
    state.results.stream = { status: "fail", error: e.message };
    setStep("stream", "fail", e.message);
    $("r-stream-section").style.display = "block";
    renderRow("r-stream", [{ key: "流式", val: "❌ 不支持或失败", status: "fail" }]);
  }
}

// ============ 检查 6：CORS ============
async function checkCORS() {
  setStep("cors", "running");
  try {
    const url = state.url + "/chat/completions";
    const headers = { "Content-Type": "application/json", "Authorization": "Bearer " + state.key };
    const body = JSON.stringify({ model: state.model, messages: [{ role: "user", content: "Hi" }], max_tokens: 5 });
    const resp = await fetch(url, { method: "POST", headers, body, mode: "cors", signal: AbortSignal.timeout(10000) });
    const allowOrigin = resp.headers.get("access-control-allow-origin");
    const status = resp.ok ? "ok" : "warn";
    state.results.cors = { status, allowOrigin, ok: resp.ok };
    setStep("cors", status, allowOrigin || (resp.ok ? "支持" : "受限"));
    $("r-cors-section").style.display = "block";
    renderRow("r-cors", [
      { key: "CORS", val: allowOrigin ? "✅ " + allowOrigin : "⚠️ 受限", status: status },
      { key: "HTTP 状态", val: resp.status, status: status }
    ]);
    if (!allowOrigin && resp.ok) addWarning("warning", "API 可用但 CORS 受限。该渠道不允许浏览器直接调用，需要服务端代理。");
  } catch (e) {
    if (e.name === "TypeError" && e.message.includes("fetch")) {
      state.results.cors = { status: "fail", error: "CORS 阻止" };
      setStep("cors", "fail", "CORS 阻止");
      $("r-cors-section").style.display = "block";
      renderRow("r-cors", [{ key: "CORS", val: "❌ 被浏览器阻止", status: "fail" }]);
      addWarning("warning", "CORS 被浏览器阻止。这表明该渠道不允许从浏览器直接调用（需要服务端代理或本地工具）。");
    } else {
      state.results.cors = { status: "fail", error: e.message };
      setStep("cors", "fail", e.message);
    }
  }
}
