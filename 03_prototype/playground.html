<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground · 实时探测 · 13 项检测 · 评分警告 - API优选咨询</title>
<meta name="description" content="输入 URL + Key + 模型，13 项硬核检测实时探测，输出评分、警告与详细响应。">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* === Playground 页 - okkmax 风格 === */
.pg-hero { padding: 32px 0 8px; text-align: center; }
.pg-hero h1 { font-size: 36px; font-weight: 800; margin-bottom: 6px; }

/* 主网格：左输入 / 右输出 */
.pg-main { display: grid; grid-template-columns: 420px 1fr; gap: 16px; margin-top: 24px; }
@media (max-width: 900px) { .pg-main { grid-template-columns: 1fr; } }

/* 左输入卡 */
.pg-input-card { padding: 20px; border-radius: 14px; background: var(--bg-card); border: 1px solid var(--border); }
.pg-input-card h3 { font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 12px; }

.pg-field { margin-bottom: 14px; }
.pg-field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.pg-field input, .pg-field select { width: 100%; padding: 10px 12px; font-size: 13px; }
.pg-field .hint { font-size: 10px; color: var(--muted); margin-top: 3px; }

/* 探测选项 */
.pg-probes-title { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 8px; }
.pg-probes-title h3 { margin: 0; font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; }
.pg-probes-title .all-toggle { font-size: 11px; color: var(--accent); cursor: pointer; background: transparent; border: 0; }

.pg-probes-grid { display: grid; grid-template-columns: 1fr; gap: 4px; max-height: 280px; overflow-y: auto; padding-right: 4px; }
.pg-probe-check { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: background 0.15s; font-size: 12px; }
.pg-probe-check:hover { background: rgba(0, 0, 0, 0.04); }
.pg-probe-check input { width: auto; padding: 0; margin: 0; cursor: pointer; }
.pg-probe-check-num { font-family: var(--font-mono); font-size: 10px; color: var(--muted); min-width: 18px; }
.pg-probe-check-name { flex: 1; font-weight: 500; }
.pg-probe-check-sub { font-size: 10px; color: var(--muted); }

.pg-run-btn { width: 100%; padding: 12px; font-size: 14px; margin-top: 16px; }

/* 右输出卡 */
.pg-output-card { padding: 20px; border-radius: 14px; background: var(--bg-card); border: 1px solid var(--border); min-height: 600px; }
.pg-output-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 400px; color: var(--muted); text-align: center; }
.pg-output-empty-icon { font-size: 64px; opacity: 0.3; margin-bottom: 16px; }
.pg-output-empty-text { font-size: 14px; margin-bottom: 8px; }
.pg-output-empty-sub { font-size: 12px; }

/* 评分圆环 */
.pg-score-row { display: flex; align-items: center; gap: 24px; padding: 16px; border-radius: 10px; background: var(--bg-deep); border: 1px solid var(--border); margin-bottom: 16px; }
.pg-score-ring { width: 96px; height: 96px; position: relative; flex-shrink: 0; }
.pg-score-ring svg { transform: rotate(-90deg); }
.pg-score-ring-bg { stroke: var(--border); fill: none; stroke-width: 8; }
.pg-score-ring-fg { stroke: url(#score-grad); fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.6s; }
.pg-score-ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 24px; font-weight: 800; }
.pg-score-info { flex: 1; min-width: 0; }
.pg-score-grade { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
.pg-score-grade.A { color: #22c55e; }
.pg-score-grade.B { color: #fbbf24; }
.pg-score-grade.C { color: #f59e0b; }
.pg-score-grade.D { color: #ef4444; }
.pg-score-meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
.pg-score-meta strong { color: var(--fg); }

/* 警告区 */
.pg-warnings { margin-bottom: 16px; }
.pg-warn-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.pg-warn { display: flex; gap: 10px; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 12px; line-height: 1.5; }
.pg-warn-icon { font-size: 18px; flex-shrink: 0; }
.pg-warn-content { flex: 1; }
.pg-warn-content strong { display: block; margin-bottom: 2px; }
.pg-warn.danger { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); color: var(--fg); }
.pg-warn.danger .pg-warn-icon { color: #ef4444; }
.pg-warn.warn { background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.25); }
.pg-warn.warn .pg-warn-icon { color: #fbbf24; }
.pg-warn.info { background: rgba(0, 0, 0, 0.06); border: 1px solid rgba(0, 0, 0, 0.25); }
.pg-warn.info .pg-warn-icon { color: var(--accent); }
.pg-warn.ok { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.25); }
.pg-warn.ok .pg-warn-icon { color: #22c55e; }

/* 检测项结果 */
.pg-checks-title { font-size: 13px; font-weight: 700; margin: 16px 0 8px; }
.pg-checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pg-check { padding: 8px 10px; border-radius: 6px; background: var(--bg-deep); border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; font-size: 11px; }
.pg-check-icon { font-size: 14px; flex-shrink: 0; }
.pg-check-icon.pass { color: #22c55e; }
.pg-check-icon.fail { color: #ef4444; }
.pg-check-icon.warn { color: #fbbf24; }
.pg-check-name { flex: 1; font-weight: 500; }
.pg-check-value { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
@media (max-width: 700px) { .pg-checks { grid-template-columns: 1fr; } }

/* 响应详情 */
.pg-response { padding: 12px; border-radius: 8px; background: var(--bg-base); border: 1px solid var(--border); font-family: var(--font-mono); font-size: 11px; line-height: 1.6; color: var(--fg); max-height: 240px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
.pg-response-meta { font-size: 10px; color: var(--muted); margin-bottom: 8px; }

/* Footer */
.pg-footer { text-align: center; padding: 40px 20px 20px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); margin-top: 40px; }
.pg-footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<!-- SVG gradient for score ring -->
<svg width="0" height="0" style="position:absolute;">
  <linearGradient id="score-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#000000"/>
    <stop offset="50%" stop-color="#000000"/>
    <stop offset="100%" stop-color="#000000"/>
  </linearGradient>
</svg>

<div id="topbar"></div>

<main class="main">
  <div class="pg-hero fade-in">
    <div class="page-hero-tagline"><span class="page-hero-tagline-dot"></span><span>13 项硬核检测 · 评分 + 警告 · 响应详情</span></div>
    <h1><span class="gradient-text">Playground · 实时探测</span></h1>
    <p>输入 URL + Key + 模型 → 选探测项 → 跑</p>
  </div>

  <div class="pg-main">
    <!-- 左：输入 -->
    <div class="pg-input-card">
      <h3>🎯 测试目标</h3>
      <div class="pg-field">
        <label>API Base URL</label>
        <input id="pg-url" type="text" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1">
        <div class="hint">官方站 / 中转站 / 自建网关</div>
      </div>
      <div class="pg-field">
        <label>API Key</label>
        <input id="pg-key" type="password" placeholder="sk-..." value="">
        <div class="hint">本机检测 · 不上传 · 不存储</div>
      </div>
      <div class="pg-field">
        <label>模型</label>
        <select id="pg-model">
          <option value="gpt-5.5">GPT-5.5</option>
          <option value="claude-fable-5">Claude Fable 5</option>
          <option value="gemini-3-pro">Gemini 3 Pro</option>
          <option value="deepseek-v4">DeepSeek V4</option>
          <option value="qwen3.8-max">Qwen 3.8 Max</option>
        </select>
      </div>

      <div class="pg-probes-title">
        <h3>🧪 探测选项 (13)</h3>
        <button class="all-toggle" onclick="toggleAllProbes()">全选/反选</button>
      </div>
      <div class="pg-probes-grid" id="pg-probes"></div>

      <button class="btn btn-primary pg-run-btn" onclick="runProbes()">🚀 开始探测</button>
    </div>

    <!-- 右：输出 -->
    <div class="pg-output-card" id="pg-output">
      <div class="pg-output-empty">
        <div class="pg-output-empty-icon">🛰️</div>
        <div class="pg-output-empty-text">等待开始探测</div>
        <div class="pg-output-empty-sub">输入 API URL 和 Key · 选择探测项 · 点击「开始探测」</div>
      </div>
    </div>
  </div>
</main>
<footer class="footer" id="footer"></footer>




<script src="data.js?v=20260921d"></script>
<script src="app.js?v=20260921d"></script>
<script>
function escapeHtml(s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

if (typeof renderTopbar === "function") renderTopbar("playground");

const PROBES = [
  { num: '01', name: '指纹签名', sub: '是否官方原生' },
  { num: '02', name: '缓存一致性', sub: 'prompt prefix 命中' },
  { num: '03', name: '限速模式', sub: 'TPM/RPM 边界' },
  { num: '04', name: '错误码分布', sub: '429/5xx 比例' },
  { num: '05', name: '首字延迟 TTFT', sub: 'p50/p95' },
  { num: '06', name: 'Token 吞吐', sub: 'tok/s' },
  { num: '07', name: '工具调用', sub: 'tool_use 合规' },
  { num: '08', name: '结构化输出', sub: 'JSON Schema' },
  { num: '09', name: '流式稳定', sub: '断流率' },
  { num: '10', name: 'Reasoning', sub: '思维链长度' },
  { num: '11', name: '多模态支持', sub: '视觉/音频' },
  { num: '12', name: '长上下文', sub: '100K+ 召回' },
  { num: '13', name: '退款政策', sub: '未消费可退' }
];

function renderProbes() {
  document.getElementById('pg-probes').innerHTML = PROBES.map((p, i) =>
    '<label class="pg-probe-check">' +
      '<input type="checkbox" data-idx="' + i + '" checked>' +
      '<span class="pg-probe-check-num">' + p.num + '</span>' +
      '<span class="pg-probe-check-name">' + p.name + ' <span class="pg-probe-check-sub">· ' + p.sub + '</span></span>' +
    '</label>'
  ).join('');
}

function toggleAllProbes() {
  const cbs = document.querySelectorAll('#pg-probes input[type=checkbox]');
  const allChecked = Array.from(cbs).every(c => c.checked);
  cbs.forEach(c => c.checked = !allChecked);
}

// 模拟探测 — 真实环境会发请求，这里生成确定性的演示结果
function runProbes() {
  const url = document.getElementById('pg-url').value.trim();
  const key = document.getElementById('pg-key').value.trim();
  const model = document.getElementById('pg-model').value;
  if (!url) { alert('请输入 API URL'); return; }
  if (!key) { alert('请输入 API Key'); return; }

  const cbs = document.querySelectorAll('#pg-probes input[type=checkbox]:checked');
  if (cbs.length === 0) { alert('请至少选择 1 个探测项'); return; }

  // 计算分数（确定性，基于 URL hash）
  let h = 0;
  for (let i = 0; i < url.length; i++) h = (h * 31 + url.charCodeAt(i)) | 0;
  const score = Math.abs(h) % 41 + 55; // 55-95
  const grade = score >= 90 ? 'A' : score >= 80 ? 'B' : score >= 70 ? 'C' : 'D';
  const checks = [];
  cbs.forEach(cb => {
    const idx = parseInt(cb.dataset.idx);
    const p = PROBES[idx];
    const v = (Math.abs(h + idx * 17) % 100);
    let status = 'pass', val = 'OK';
    if (v < 15 && idx % 4 === 3) { status = 'fail'; val = 'fail'; }
    else if (v < 30) { status = 'warn'; val = (v + 'ms').slice(0, 6); }
    else { val = (v + 50) + 'ms'; }
    checks.push({ name: p.name, num: p.num, status, val });
  });

  const warnings = [];
  if (url.includes('localhost') || url.includes('127.0.0.1')) {
    warnings.push({ type: 'info', icon: '🔒', title: '本地 URL', text: '你正在测试本地部署的 API，不会消耗外网流量' });
  }
  if (url.includes('openai.com') && grade === 'A') {
    warnings.push({ type: 'ok', icon: '✅', title: '官方域名', text: '这是 OpenAI 官方域名，指纹应为 Claude 4.5+ 系统提示词' });
  }
  const hasHighLatency = checks.some(c => c.status === 'warn' && c.name.includes('延迟'));
  if (hasHighLatency) {
    warnings.push({ type: 'warn', icon: '⏱', title: '首字延迟偏高', text: 'TTFT p95 > 800ms · 适合离线批处理，不适合实时对话' });
  }
  const hasFail = checks.some(c => c.status === 'fail');
  if (hasFail) {
    warnings.push({ type: 'danger', icon: '🚨', title: '检测到 1 项失败', text: '退款政策 / 缓存一致性异常 · 建议人工复核' });
  }
  if (warnings.length === 0) {
    warnings.push({ type: 'ok', icon: '🎉', title: '全部通过', text: '13 项检测均符合预期 · 可放心使用' });
  }

  // 模拟响应
  const response = JSON.stringify({
    id: 'chatcmpl-' + Math.random().toString(36).slice(2, 10),
    object: 'chat.completion',
    created: Math.floor(Date.now() / 1000),
    model: model,
    choices: [{
      index: 0,
      message: { role: 'assistant', content: 'Hello! How can I help you today? This is a sample response from the probed API.' },
      finish_reason: 'stop'
    }],
    usage: { prompt_tokens: 16, completion_tokens: 19, total_tokens: 35 }
  }, null, 2);

  const out = document.getElementById('pg-output');
  const circumference = 2 * Math.PI * 40;
  const offset = circumference * (1 - score / 100);

  out.innerHTML =
    // 评分
    '<div class="pg-score-row">' +
      '<div class="pg-score-ring">' +
        '<svg width="96" height="96">' +
          '<circle class="pg-score-ring-bg" cx="48" cy="48" r="40"></circle>' +
          '<circle class="pg-score-ring-fg" cx="48" cy="48" r="40" stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '"></circle>' +
        '</svg>' +
        '<div class="pg-score-ring-num">' + score + '</div>' +
      '</div>' +
      '<div class="pg-score-info">' +
        '<div class="pg-score-grade ' + grade + '">' + grade + ' 级</div>' +
        '<div class="pg-score-meta">' +
          '<strong>' + escapeHtml(url.replace(/^https?:\/\//, '').slice(0, 40)) + '</strong><br>' +
          '模型: ' + escapeHtml(model) + '<br>' +
          '检测项: ' + cbs.length + ' / 13 · 通过 ' + checks.filter(c => c.status === 'pass').length +
        '</div>' +
      '</div>' +
    '</div>' +

    // 警告
    '<div class="pg-warnings">' +
      '<div class="pg-warn-title">⚠️ 警告与提示</div>' +
      warnings.map(w =>
        '<div class="pg-warn ' + w.type + '">' +
          '<span class="pg-warn-icon">' + w.icon + '</span>' +
          '<div class="pg-warn-content"><strong>' + w.title + '</strong>' + w.text + '</div>' +
        '</div>'
      ).join('') +
    '</div>' +

    // 检测项
    '<div class="pg-checks-title">📋 检测项详情</div>' +
    '<div class="pg-checks">' + checks.map(c =>
      '<div class="pg-check">' +
        '<span class="pg-check-icon ' + c.status + '">' + (c.status === 'pass' ? '✓' : c.status === 'fail' ? '✗' : '!') + '</span>' +
        '<span class="pg-check-name">' + c.num + ' ' + escapeHtml(c.name) + '</span>' +
        '<span class="pg-check-value">' + escapeHtml(c.val) + '</span>' +
      '</div>'
    ).join('') + '</div>' +

    // 响应
    '<div class="pg-checks-title" style="margin-top:18px;">📡 响应详情</div>' +
    '<div class="pg-response-meta">POST ' + escapeHtml(url) + '/chat/completions · 200 OK · 142ms</div>' +
    '<div class="pg-response">' + escapeHtml(response) + '</div>';
}

renderProbes();
</script>

</body>
</html>
