<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>横向比价 - API Radar</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.main h1 { font-size: 28px; margin-bottom: 8px; }
.page-desc { color: var(--muted); margin-bottom: 24px; }
.cmp-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
.cmp-inputs { padding: 24px; }
.cmp-inputs h3 { margin-bottom: 16px; }
.cmp-best { padding: 24px; background: var(--grad-glow); border-color: var(--border-strong); }
.cmp-best-num { font-family: var(--font-mono); font-size: 36px; font-weight: 800; background: var(--grad-primary); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.cmp-table { padding: 0; overflow: hidden; }
.cmp-table table th { background: var(--bg-deep); }
.cmp-table .price-cell { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--accent); }
.badge-best { background: linear-gradient(135deg, var(--success), var(--accent)); color: #001428; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-left: 6px; }
</style>
</head>
<body>
<div id="topbar"></div>
<main class="main">
  <div class="page-hero fade-in">
    <div class="page-hero-tagline"><span class="page-hero-tagline-dot"></span><span>智能选方案</span></div>
    <h1><span class="gradient-text">📊 横向比价</span></h1>
    <p class="subtitle">选模型 → 填用量 → 看 N 个渠道月成本对比</p>
  </div>

  <div class="cmp-grid">
    <div class="card cmp-inputs">
      <h3>① 用量</h3>
      <div class="input-group" style="margin-bottom:12px;">
        <label>模型</label>
        <select id="cmp-model"></select>
      </div>
      <div class="flex gap-3" style="margin-bottom:12px;">
        <div class="input-group w-full"><label>输入 Token（M）</label><input type="number" id="cmp-input" value="100"></div>
        <div class="input-group w-full"><label>输出 Token（M）</label><input type="number" id="cmp-output" value="20"></div>
      </div>
      <div class="input-group" style="margin-bottom:12px;">
        <label>缓存读取 Token（M，可选）</label>
        <input type="number" id="cmp-cache" value="0">
      </div>

      <h3 style="margin-top:24px;">② 显示选项</h3>
      <div class="flex gap-3" style="margin-bottom:12px;">
        <div class="input-group w-full"><label>币种</label>
          <select id="cmp-currency"><option value="CNY">人民币 ¥</option><option value="USD">美元 $</option></select>
        </div>
        <div class="input-group w-full"><label>排序</label>
          <select id="cmp-sort"><option value="total">总价升序</option><option value="provider">按渠道名</option><option value="official">官方优先</option></select>
        </div>
      </div>
      <button class="btn btn-primary w-full" id="cmp-btn">🧮 生成对比</button>

      <div class="cmp-best" id="cmp-best" style="margin-top:24px;">
        <div class="muted text-xs" style="text-transform:uppercase;letter-spacing:0.08em;">最低月成本</div>
        <div class="cmp-best-num" id="cmp-best-total">¥ 0</div>
        <div class="muted text-sm" id="cmp-best-info">—</div>
        <div class="muted text-xs" style="margin-top:8px;" id="cmp-fx">CNY</div>
      </div>
    </div>

    <div class="card cmp-table">
      <table>
        <thead>
          <tr><th>渠道</th><th>类型</th><th>输入成本</th><th>输出成本</th><th>缓存成本</th><th>月成本</th><th>差异</th><th>付款</th><th>发票</th><th>操作</th></tr>
        </thead>
        <tbody id="cmp-table-body"></tbody>
      </table>
    </div>
  </div>

  <div class="card glass-strong" style="margin-top:24px;padding:20px;">
    <div class="muted text-sm">
      💡 "中转"渠道价格可能更低但数据政策因渠道而异；建议结合"三栏分列"评估。差异 = (当前渠道 - 最低渠道) / 最低渠道 × 100%。
    </div>
  </div>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function() {
  if (typeof renderTopbar === 'function') renderTopbar('compare');
  const D = API_RADAR_DATA;
  const sel = document.getElementById('cmp-model');
  D.models.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.id;
    opt.textContent = m.display_name + ' (' + fmtUSD(m.official_input_usd_m) + '/' + fmtUSD(m.official_output_usd_m) + ')';
    sel.appendChild(opt);
  });

  const params = new URLSearchParams(location.search);
  const presetModel = params.get('model');
  if (presetModel && D.models.find(m => m.id === presetModel)) sel.value = presetModel;

  function runCompare() {
    const modelId = sel.value;
    const input = parseFloat(document.getElementById('cmp-input').value) || 0;
    const output = parseFloat(document.getElementById('cmp-output').value) || 0;
    const cache = parseFloat(document.getElementById('cmp-cache').value) || 0;
    const currency = document.getElementById('cmp-currency').value;
    const sortBy = document.getElementById('cmp-sort').value;

    const offerings = D.offerings.filter(o => o.model_id === modelId);
    if (offerings.length === 0) {
      document.getElementById('cmp-table-body').innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:var(--muted);">该模型暂无渠道</td></tr>';
      return;
    }

    const results = offerings.map(o => {
      const provider = D.providers.find(p => p.id === o.provider_id);
      const cost = calcCost(getModel(modelId), o, input, output, cache);
      return { offering: o, provider, cost };
    });

    if (sortBy === 'total') results.sort((a, b) => a.cost.total - b.cost.total);
    else if (sortBy === 'provider') results.sort((a, b) => a.provider.name.localeCompare(b.provider.name, 'zh'));
    else if (sortBy === 'official') results.sort((a, b) => (b.offering.multiplier === 1.0 ? 1 : 0) - (a.offering.multiplier === 1.0 ? 1 : 0));

    const best = results[0];
    const disp = (n) => currency === 'CNY' ? fmtCNY(n * API_RADAR.FX) : fmtUSD(n);

    document.getElementById('cmp-best-total').textContent = disp(best.cost.total);
    document.getElementById('cmp-best-info').textContent = '最优：' + best.provider.name + ' · ' + getModel(modelId).display_name;
    document.getElementById('cmp-fx').textContent = currency + ' · 汇率 ' + API_RADAR_DATA.fx_rate.date;

    const tbody = document.getElementById('cmp-table-body');
    tbody.innerHTML = '';
    results.forEach((r, i) => {
      const diff = best.cost.total > 0 ? ((r.cost.total - best.cost.total) / best.cost.total * 100) : 0;
      const isBest = i === 0;
      const tr = document.createElement('tr');
      if (isBest) tr.style.background = 'rgba(0,255,163,0.06)';
      const isOff = r.offering.multiplier === 1.0;
      tr.innerHTML =
        '<td><a href="provider.html?id=' + r.provider.id + '" style="color:var(--fg);text-decoration:none;"><strong>' + r.provider.name + '</strong></a>' + (isOff ? ' <span class="tag tag-accent" style="font-size:10px;">官方</span>' : ' <span class="tag tag-purple" style="font-size:10px;">中转 ' + r.offering.multiplier + 'x</span>') + '</td>' +
        '<td><span style="font-size:11px;color:var(--muted);">' + ({official:'官方',aggregator:'聚合',gateway:'网关',self_host:'自托管',cloud:'云厂商'}[r.provider.type]||r.provider.type) + '</span></td>' +
        '<td class="price-cell">' + disp(r.cost.inputCost) + '</td>' +
        '<td class="price-cell">' + disp(r.cost.outputCost) + '</td>' +
        '<td class="price-cell">' + disp(r.cost.cacheCost) + '</td>' +
        '<td class="price-cell" style="font-weight:700;">' + disp(r.cost.total) + (isBest ? ' <span class="badge-best">最省</span>' : '') + '</td>' +
        '<td style="color:' + (diff === 0 ? 'var(--success)' : 'var(--muted)') + ';">' + (diff === 0 ? '基线' : '+' + diff.toFixed(0) + '%') + '</td>' +
        '<td style="font-size:11px;">' + (r.provider.payment_currency||[]).join('/') + '</td>' +
        '<td>' + (r.provider.invoice_available ? '<span style="color:var(--success);">✓</span>' : '<span style="color:var(--muted);">×</span>') + '</td>' +
        '<td><a href="provider.html?id=' + r.provider.id + '" style="font-size:12px;">详情 →</a></td>';
      tbody.appendChild(tr);
    });
  }

  document.getElementById('cmp-btn').addEventListener('click', runCompare);
  ['cmp-input', 'cmp-output', 'cmp-cache', 'cmp-currency', 'cmp-sort'].forEach(id => {
    document.getElementById(id).addEventListener('input', runCompare);
    document.getElementById(id).addEventListener('change', runCompare);
  });
  sel.addEventListener('change', runCompare);
  runCompare();
})();
</script>
</body>
</html>
