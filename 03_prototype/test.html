<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测 Key · 5 项检测 · 30 秒出结果 - API优选咨询</title>
<meta name="description" content="输入 URL + Key，5 项核心检测秒级返回 · 评分 + 警告。">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* === Test Key 页 - okkmax 风格 === */
.tk-hero { padding: 32px 0 8px; text-align: center; }
.tk-hero h1 { font-size: 36px; font-weight: 800; margin-bottom: 6px; }

/* 输入区（居中、最大 640） */
.tk-input-wrap { max-width: 640px; margin: 24px auto 0; padding: 24px; border-radius: 14px; background: var(--bg-card); border: 1px solid var(--border); }
.tk-input-wrap h3 { font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 14px; }
.tk-field { margin-bottom: 14px; }
.tk-field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.tk-field input, .tk-field select { width: 100%; padding: 12px 14px; font-size: 14px; }
.tk-field .hint { font-size: 10px; color: var(--muted); margin-top: 3px; }

.tk-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tk-quick-btn { font-size: 11px; padding: 4px 10px; border-radius: 999px; background: rgba(120,160,255,0.08); border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: all 0.15s; }
.tk-quick-btn:hover { color: var(--accent); border-color: var(--accent); }

.tk-run-btn { width: 100%; padding: 14px; font-size: 15px; }

/* 加载动画 */
.tk-loading { text-align: center; padding: 40px 20px; color: var(--muted); }
.tk-loading-icon { font-size: 32px; margin-bottom: 8px;  display: inline-block; }
.tk-loading-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin: 16px auto; max-width: 400px; }
.tk-loading-bar-fill { height: 100%; background: var(--grad-primary);  }
@keyframes loading-bar {
  0% { width: 0; margin-left: 0; }
  50% { width: 60%; margin-left: 20%; }
  100% { width: 0; margin-left: 100%; }
}

/* 结果区 */
.tk-result { max-width: 800px; margin: 24px auto 0; }
.tk-score-card { padding: 20px; border-radius: 14px; background: var(--bg-card); border: 1px solid var(--border); display: grid; grid-template-columns: 120px 1fr; gap: 20px; align-items: center; }
.tk-score-ring { width: 120px; height: 120px; position: relative; }
.tk-score-ring svg { transform: rotate(-90deg); }
.tk-score-ring-fg { stroke: url(#score-grad); fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.6s; }
.tk-score-ring-bg { stroke: var(--border); fill: none; stroke-width: 10; }
.tk-score-ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 32px; font-weight: 800; }
.tk-score-info .grade { font-size: 36px; font-weight: 800; }
.tk-score-info .grade.A { color: #22c55e; }
.tk-score-info .grade.B { color: #fbbf24; }
.tk-score-info .grade.C { color: #f59e0b; }
.tk-score-info .grade.D { color: #ef4444; }
.tk-score-info .desc { font-size: 14px; margin-top: 4px; }
.tk-score-info .meta { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; }

@media (max-width: 600px) { .tk-score-card { grid-template-columns: 1fr; text-align: center; } .tk-score-ring { margin: 0 auto; } }

/* 警告 */
.tk-warnings { margin-top: 16px; padding: 18px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border); }
.tk-warnings h3 { font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 10px; }
.tk-warn { display: flex; gap: 10px; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 13px; line-height: 1.5; }
.tk-warn-icon { font-size: 20px; flex-shrink: 0; }
.tk-warn-content { flex: 1; }
.tk-warn-content strong { display: block; margin-bottom: 2px; }
.tk-warn.danger { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); }
.tk-warn.danger .tk-warn-icon { color: #ef4444; }
.tk-warn.warn { background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.25); }
.tk-warn.warn .tk-warn-icon { color: #fbbf24; }
.tk-warn.info { background: rgba(0, 0, 0, 0.06); border: 1px solid rgba(0, 0, 0, 0.25); }
.tk-warn.info .tk-warn-icon { color: var(--accent); }
.tk-warn.ok { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.25); }
.tk-warn.ok .tk-warn-icon { color: #22c55e; }

/* 5 项检测 */
.tk-checks { margin-top: 16px; padding: 18px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border); }
.tk-checks h3 { font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 12px; }
.tk-check-row { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--bg-deep); border: 1px solid var(--border); margin-bottom: 6px; transition: all 0.15s; }
.tk-check-row:hover { border-color: var(--accent); }
.tk-check-num { font-family: var(--font-mono); font-size: 13px; font-weight: 800; color: var(--accent); }
.tk-check-info { min-width: 0; }
.tk-check-name { font-size: 13px; font-weight: 600; }
.tk-check-val { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.tk-check-status { font-size: 11px; padding: 4px 10px; border-radius: 999px; font-weight: 700; }
.tk-check-status.pass { background: rgba(34,197,94,0.15); color: #22c55e; }
.tk-check-status.fail { background: rgba(239,68,68,0.15); color: #ef4444; }
.tk-check-status.warn { background: rgba(251,191,36,0.15); color: #fbbf24; }

/* Footer */
.tk-footer { text-align: center; padding: 40px 20px 20px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); margin-top: 40px; }
.tk-footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute;">
  <linearGradient id="score-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#000000"/>
    <stop offset="50%" stop-color="#000000"/>
    <stop offset="100%" stop-color="#000000"/>
  </linearGradient>
</svg>

<div id="topbar"></div>

<main class="main">
  <div class="tk-hero fade-in">
    <div class="page-hero-tagline"><span class="page-hero-tagline-dot"></span><span>5 项核心检测 · 30 秒出结果 · Key 不出本机</span></div>
    <h1><span class="gradient-text">测 Key · 一键验真</span></h1>
    <p>检测 API Key 是否可用 · 是否被风控 · 是否限速</p>
  </div>

  <!-- 输入 -->
  <div class="tk-input-wrap">
    <h3>🔑 待测 Key</h3>

    <div class="tk-field">
      <label>API Base URL</label>
      <div class="tk-quick" style="margin-bottom:6px;">
        <button class="tk-quick-btn" onclick="quickFill('openai')">OpenAI</button>
        <button class="tk-quick-btn" onclick="quickFill('anthropic')">Anthropic</button>
        <button class="tk-quick-btn" onclick="quickFill('gemini')">Gemini</button>
        <button class="tk-quick-btn" onclick="quickFill('deepseek')">DeepSeek</button>
        <button class="tk-quick-btn" onclick="quickFill('qwen')">通义千问</button>
        <button class="tk-quick-btn" onclick="quickFill('glm')">智谱</button>
      </div>
      <input id="tk-url" type="text" placeholder="https://api.openai.com/v1" value="">
      <div class="hint">点击上方快速填充 · 或手动输入</div>
    </div>

    <div class="tk-field">
      <label>API Key</label>
      <input id="tk-key" type="password" placeholder="sk-..." value="">
      <div class="hint">本机检测 · 不上传 · 不存储 · 关闭窗口即销毁</div>
    </div>

    <button class="btn btn-primary tk-run-btn" onclick="runTest()">🚀 开始 5 项检测</button>
  </div>

  <!-- 结果区 -->
  <div id="tk-result" class="tk-result"></div>
</main>
<footer class="footer" id="footer"></footer>




<script src="data.js?v=20260922i"></script>
<script src="app.js?v=20260922i"></script>
<script>
function escapeHtml(s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

if (typeof renderTopbar === "function") renderTopbar("test");

const QUICK = {
  openai: { url: 'https://api.openai.com/v1', name: 'OpenAI' },
  anthropic: { url: 'https://api.anthropic.com/v1', name: 'Anthropic' },
  gemini: { url: 'https://generativelanguage.googleapis.com/v1beta', name: 'Gemini' },
  deepseek: { url: 'https://api.deepseek.com/v1', name: 'DeepSeek' },
  qwen: { url: 'https://dashscope.aliyuncs.com/compatible-mode/v1', name: '通义千问' },
  glm: { url: 'https://open.bigmodel.cn/api/paas/v4', name: '智谱' }
};

function quickFill(k) {
  document.getElementById('tk-url').value = QUICK[k].url;
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function runTest() {
  const url = document.getElementById('tk-url').value.trim();
  const key = document.getElementById('tk-key').value.trim();
  if (!url) { alert('请输入 API URL'); return; }
  if (!key) { alert('请输入 API Key'); return; }
  if (key.length < 8) { alert('Key 太短 · 至少 8 位'); return; }

  const result = document.getElementById('tk-result');

  // 加载动画
  result.innerHTML = '<div class="tk-loading">' +
    '<div class="tk-loading-icon">🛰️</div>' +
    '<div>正在执行 5 项检测 ...</div>' +
    '<div class="tk-loading-bar"><div class="tk-loading-bar-fill"></div></div>' +
    '<div class="muted" style="font-size:11px;">5 项检测 · 平均耗时 30 秒</div>' +
  '</div>';

  // 模拟异步
  setTimeout(() => renderResult(url, key), 1200);
}

function renderResult(url, key) {
  const h = hashStr(url + key);
  const score = (h % 41) + 55; // 55-95
  const grade = score >= 90 ? 'A' : score >= 80 ? 'B' : score >= 70 ? 'C' : 'D';
  const gradeText = {
    A: '优秀 · 可放心使用',
    B: '良好 · 适合生产',
    C: '一般 · 建议人工复核',
    D: '较差 · 存在风险'
  }[grade];

  // 5 项检测
  const checks = [
    { num: '01', name: 'Key 有效性', val: '鉴权通过' },
    { num: '02', name: '余额 / 额度', val: '剩余 ¥' + ((h % 5000) / 100).toFixed(2) },
    { num: '03', name: '限速阈值', val: '60 RPM / 1M TPM' },
    { num: '04', name: '区域可达性', val: url.includes('openai.com') ? '海外' : url.includes('aliyun') || url.includes('deepseek') ? '国内可点' : '海外' },
    { num: '05', name: '退款 / 转让', val: (h % 7 === 0) ? '不支持' : '支持' }
  ];
  checks.forEach((c, i) => {
    const v = (h + i * 31) % 100;
    if (v < 10 && i === 4) c.status = 'fail';
    else if (v < 20) c.status = 'warn';
    else c.status = 'pass';
  });

  // 警告
  const warnings = [];
  if (key.startsWith('sk-') && key.length > 30) {
    warnings.push({ type: 'ok', icon: '✅', title: 'Key 格式正确', text: '符合 OpenAI / Anthropic 标准前缀' });
  }
  if (url.includes('localhost') || url.includes('127.0.0.1')) {
    warnings.push({ type: 'info', icon: '🏠', title: '本地 API', text: '检测到本地地址，限速阈值可能不适用' });
  }
  const failChecks = checks.filter(c => c.status !== 'pass');
  if (failChecks.length > 0) {
    warnings.push({ type: 'danger', icon: '🚨', title: failChecks.length + ' 项检测异常', text: failChecks.map(c => c.name).join('、') });
  }
  if (url.includes('openai.com') && grade === 'D') {
    warnings.push({ type: 'warn', icon: '⚠️', title: '官方 Key 应 ≥ 80 分', text: '你的分数 ' + score + ' 异常低 · 可能是 Key 被限速 / 余额不足' });
  }
  if (warnings.length === 0) {
    warnings.push({ type: 'ok', icon: '🎉', title: '全部通过', text: '5 项核心检测均符合预期 · 可放心使用' });
  }

  const circumference = 2 * Math.PI * 50;
  const offset = circumference * (1 - score / 100);

  const result = document.getElementById('tk-result');
  result.innerHTML =

    // 评分
    '<div class="tk-score-card">' +
      '<div class="tk-score-ring">' +
        '<svg width="120" height="120">' +
          '<circle class="tk-score-ring-bg" cx="60" cy="60" r="50"></circle>' +
          '<circle class="tk-score-ring-fg" cx="60" cy="60" r="50" stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '"></circle>' +
        '</svg>' +
        '<div class="tk-score-ring-num">' + score + '</div>' +
      '</div>' +
      '<div class="tk-score-info">' +
        '<div class="grade ' + grade + '">' + grade + ' 级</div>' +
        '<div class="desc">' + gradeText + '</div>' +
        '<div class="meta">' +
          '🔗 ' + escapeHtml(url.replace(/^https?:\/\//, '').slice(0, 40)) + '<br>' +
          '🔑 ' + escapeHtml(key.slice(0, 8)) + '...' + escapeHtml(key.slice(-4)) + '<br>' +
          '🕐 检测耗时 1.2s · ' + new Date().toLocaleString('zh-CN') +
        '</div>' +
      '</div>' +
    '</div>' +

    // 警告
    '<div class="tk-warnings">' +
      '<h3>⚠️ 警告与提示</h3>' +
      warnings.map(w =>
        '<div class="tk-warn ' + w.type + '">' +
          '<span class="tk-warn-icon">' + w.icon + '</span>' +
          '<div class="tk-warn-content"><strong>' + w.title + '</strong>' + w.text + '</div>' +
        '</div>'
      ).join('') +
    '</div>' +

    // 5 项检测
    '<div class="tk-checks">' +
      '<h3>📋 5 项检测详情</h3>' +
      checks.map(c =>
        '<div class="tk-check-row">' +
          '<span class="tk-check-num">' + c.num + '</span>' +
          '<div class="tk-check-info">' +
            '<div class="tk-check-name">' + escapeHtml(c.name) + '</div>' +
            '<div class="tk-check-val">' + escapeHtml(c.val) + '</div>' +
          '</div>' +
          '<span class="tk-check-status ' + c.status + '">' + (c.status === 'pass' ? '✓ 通过' : c.status === 'warn' ? '! 警告' : '✗ 失败') + '</span>' +
        '</div>'
      ).join('') +
    '</div>' +

    '<div class="muted text-sm" style="text-align:center;margin-top:16px;">完整 13 项检测请前往 <a href="playground.html">Playground</a></div>';
}

document.getElementById('tk-key').addEventListener('keypress', e => { if (e.key === 'Enter') runTest(); });
document.getElementById('tk-url').addEventListener('keypress', e => { if (e.key === 'Enter') runTest(); });
</script>

</body>
</html>
